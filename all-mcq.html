<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল কুইজ ক্যাটাগরি - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK (Handles Announcement, Header, Navigation & Footer styles) -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        /* PAGE SPECIFIC STYLES FOR ALL-MCQ */
        .container {
            max-width: 900px;
            margin: 35px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            border: 1px solid #e2e8f0;
        }

        .btn-home {
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-bottom-right-radius: 8px;
            border-top-left-radius: 9px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover { background-color: var(--primary-dark); }

        .page-title { 
            text-align: center; 
            color: var(--dark); 
            margin-top: 15px; 
            margin-bottom: 25px; 
            font-size: 26px;
            font-weight: 700;
        }

        .category-card { 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            background: #ffffff; 
            overflow: hidden; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: border-color 0.2s ease;
        }
        .category-card:hover {
            border-color: #cbd5e1;
        }

        .category-header { 
            background: #f8fafc; 
            padding: 14px 20px; 
            font-size: 18px; 
            font-weight: 700; 
            color: var(--dark); 
            border-bottom: 1px solid #e2e8f0; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subcategory-list { 
            padding: 18px 20px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
        }

        .subcategory-btn { 
            background-color: #f1f5f9; 
            color: #334155; 
            text-decoration: none; 
            padding: 9px 16px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 600; 
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .subcategory-btn:hover { 
            background-color: var(--primary); 
            color: #ffffff; 
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .loading-text { 
            text-align: center; 
            color: var(--gray); 
            font-size: 16px; 
            padding: 40px 0; 
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px 15px;
                padding: 20px 15px;
            }
            .page-title {
                font-size: 20px;
                margin-top: 25px;
            }
            .subcategory-list {
                padding: 12px 15px;
            }
            .subcategory-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <!-- MAIN PAGE CONTENT -->
    <div class="container">
        <a href="index.html" class="btn-home"><i class="fa-solid fa-arrow-left"></i> হোম পেজ</a>
        <h1 class="page-title"><i class="fa-solid fa-layer-group" style="color: var(--primary);"></i> সকল কুইজ ক্যাটাগরি (All MCQ)</h1>
        
        <div id="category-wrapper">
            <p class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ক্যাটাগরি ডাটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
        </div>
    </div>

    <!-- DYNAMIC GLOBAL FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINK (Handles Header, Navigation, Mobile Menu, Announce Bar, and Footer SWR Rendering) -->
    <script src="global/global.js"></script>

    <!-- ALL MCQ CATEGORY FETCH SCRIPT -->
    <script>
        const API_URL = 'https://mosabber-quiz-app.onrender.com/api/questions';

        async function fetchCategories() {
            const wrapper = document.getElementById('category-wrapper');

            try {
                const token = localStorage.getItem('token') || localStorage.getItem('quiz_token') || '';
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(API_URL, { method: 'GET', headers: headers });
                const data = await res.json();

                if (!res.ok || !Array.isArray(data)) {
                    throw new Error("Failed to fetch questions");
                }

                const groupedCategories = {};

                data.forEach(item => {
                    if (!item.category) return;
                    
                    const parts = item.category.split('/');
                    const mainCat = parts[0]?.trim() || 'অন্যান্য';
                    const subCat = parts[1]?.trim() || parts[0]?.trim();

                    if (!groupedCategories[mainCat]) {
                        groupedCategories[mainCat] = new Set();
                    }
                    groupedCategories[mainCat].add(subCat);
                });

                wrapper.innerHTML = "";

                if (Object.keys(groupedCategories).length === 0) {
                    wrapper.innerHTML = `<p class="loading-text"><i class="fa-solid fa-circle-exclamation"></i> কোনো ক্যাটাগরি পাওয়া যায়নি!</p>`;
                    return;
                }

                Object.keys(groupedCategories).forEach(mainCat => {
                    const card = document.createElement('div');
                    card.className = 'category-card';

                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerHTML = `<i class="fa-solid fa-folder-open" style="color: var(--primary);"></i> ${mainCat}`;
                    card.appendChild(header);

                    const subList = document.createElement('div');
                    subList.className = 'subcategory-list';

                    groupedCategories[mainCat].forEach(subCat => {
                        const btn = document.createElement('a');
                        btn.className = 'subcategory-btn';
                        btn.innerHTML = `<i class="fa-regular fa-file-lines"></i> ${subCat}`;
                        btn.href = `quiz.html?category=${encodeURIComponent(mainCat + '/' + subCat)}`;
                        subList.appendChild(btn);
                    });

                    card.appendChild(subList);
                    wrapper.appendChild(card);
                });

            } catch (err) {
                console.error("Error loading categories:", err);
                wrapper.innerHTML = `<p style="text-align:center; color: var(--danger); padding: 30px;"><i class="fa-solid fa-triangle-exclamation"></i> ক্যাটাগরি ডাটা লোড করতে সমস্যা হয়েছে!</p>`;
            }
        }

        window.onload = fetchCategories;
    </script>

</body>
</html>

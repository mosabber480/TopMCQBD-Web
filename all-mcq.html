<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সকল কুইজ ক্যাটাগরি - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK (Root level path for /pages files) -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        /* PAGE SPECIFIC STYLES FOR ALL-MCQ - EXACT 1300PX ALIGNMENT WITH HEADER */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .all-mcq-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            border: 1px solid #e2e8f0;
            width: 100%;
        }

        .btn-home {
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-bottom-right-radius: 8px;
            border-top-left-radius: 9px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover { background-color: var(--primary-dark); }

        .page-title { 
            text-align: center; 
            color: var(--dark); 
            margin-top: 15px; 
            margin-bottom: 25px; 
            font-size: 26px;
            font-weight: 700;
        }

        /* 3-LEVEL CATEGORY ACCORDION CARD STYLES */
        .main-category-card { 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            background: #ffffff; 
            overflow: hidden; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .main-category-header { 
            background: #f8fafc; 
            padding: 14px 20px; 
            font-size: 18px; 
            font-weight: 700; 
            color: var(--dark); 
            border-bottom: 1px solid #e2e8f0; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sub-category-block {
            padding: 15px 20px;
            border-bottom: 1px dashed #e2e8f0;
        }
        .sub-category-block:last-child {
            border-bottom: none;
        }

        .sub-category-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topic-btn-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            padding-left: 10px;
        }

        .topic-btn { 
            background-color: #f1f5f9; 
            color: #334155; 
            text-decoration: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 13px; 
            font-weight: 600; 
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .topic-btn:hover { 
            background-color: var(--primary); 
            color: #ffffff; 
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .loading-text { 
            text-align: center; 
            color: var(--gray); 
            font-size: 16px; 
            padding: 40px 0; 
        }

        @media (max-width: 768px) {
            .container {
                margin: 15px auto;
                padding: 0 10px;
            }
            .all-mcq-card {
                padding: 20px 15px;
            }
            .page-title {
                font-size: 20px;
                margin-top: 25px;
            }
            .sub-category-block {
                padding: 12px 10px;
            }
            .topic-btn-group {
                padding-left: 0;
            }
            .topic-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <!-- MAIN PAGE CONTENT -->
    <div class="container">
        <div class="all-mcq-card">
            <a href="index.html" class="btn-home"><i class="fa-solid fa-arrow-left"></i> হোম পেজ</a>
            <h1 class="page-title"><i class="fa-solid fa-layer-group" style="color: var(--primary);"></i> সকল কুইজ ক্যাটাগরি (All MCQ)</h1>
            
            <div id="category-wrapper">
                <p class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> ক্যাটাগরি ডাটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
            </div>
        </div>
    </div>

    <!-- DYNAMIC GLOBAL FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINKS -->
    <script src="config.js"></script>
    <script src="global/global.js"></script>

    <!-- ALL MCQ CATEGORY FETCH SCRIPT -->
    <script>
        const QUESTIONS_API = `${CONFIG.MAIN_PAID_API}/questions`;
        const CAT_API_URL = `${CONFIG.MAIN_PAID_API}/categories`;

        async function fetchCategories() {
            const wrapper = document.getElementById('category-wrapper');

            try {
                const token = localStorage.getItem('token') || localStorage.getItem('quiz_token') || '';
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                // 1. Fetch categories from Category API and Questions API simultaneously
                const [catRes, qRes] = await Promise.all([
                    fetch(CAT_API_URL, { headers }).catch(() => null),
                    fetch(QUESTIONS_API, { headers }).catch(() => null)
                ]);

                const categoryTree = {}; // Structure: { MainCat: { SubCat: [Topic1, Topic2] } }

                // Helper to safely populate nested tree
                const addPathToTree = (pathStr) => {
                    if (!pathStr || typeof pathStr !== 'string') return;
                    const parts = pathStr.split('/').map(p => p.trim()).filter(Boolean);
                    if (parts.length === 0) return;

                    const mainCat = parts[0] || 'অন্যান্য';
                    const subCat = parts[1] || mainCat;
                    const topic = parts[2] || subCat;

                    if (!categoryTree[mainCat]) categoryTree[mainCat] = {};
                    if (!categoryTree[mainCat][subCat]) categoryTree[mainCat][subCat] = new Set();
                    categoryTree[mainCat][subCat].add(topic);
                };

                // Process Category API data
                if (catRes && catRes.ok) {
                    const catData = await catRes.json();
                    let rawCats = Array.isArray(catData) ? catData : (catData.categories || catData.data || []);
                    rawCats.forEach(addPathToTree);
                }

                // Process Questions API data
                if (qRes && qRes.ok) {
                    const qData = await qRes.json();
                    let rawQuestions = Array.isArray(qData) ? qData : (qData.mcqs || qData.questions || []);
                    rawQuestions.forEach(q => {
                        if (q.category) addPathToTree(q.category);
                    });
                }

                wrapper.innerHTML = "";

                const mainCategories = Object.keys(categoryTree);

                if (mainCategories.length === 0) {
                    wrapper.innerHTML = `<p class="loading-text"><i class="fa-solid fa-circle-exclamation"></i> কোনো ক্যাটাগরি পাওয়া যায়নি!</p>`;
                    return;
                }

                // Render 3-Level Hierarchy
                mainCategories.forEach(mainCat => {
                    const mainCard = document.createElement('div');
                    mainCard.className = 'main-category-card';

                    const mainHeader = document.createElement('div');
                    mainHeader.className = 'main-category-header';
                    mainHeader.innerHTML = `<span><i class="fa-solid fa-folder-open" style="color: var(--primary); margin-right: 8px;"></i> ${mainCat}</span>`;
                    mainCard.appendChild(mainHeader);

                    const subCats = Object.keys(categoryTree[mainCat]);

                    subCats.forEach(subCat => {
                        const subBlock = document.createElement('div');
                        subBlock.className = 'sub-category-block';

                        const subTitle = document.createElement('div');
                        subTitle.className = 'sub-category-title';
                        subTitle.innerHTML = `<i class="fa-solid fa-folder" style="color: #17a2b8;"></i> ${subCat}`;
                        subBlock.appendChild(subTitle);

                        const topicGroup = document.createElement('div');
                        topicGroup.className = 'topic-btn-group';

                        const topics = Array.from(categoryTree[mainCat][subCat]);

                        topics.forEach(topic => {
                            const btn = document.createElement('a');
                            btn.className = 'topic-btn';
                            btn.innerHTML = `<i class="fa-regular fa-file-lines"></i> ${topic}`;
                            // Full Category Path: Main / Sub / Topic
                            const fullCategoryPath = `${mainCat}/${subCat}/${topic}`;
                            btn.href = `quiz.html?category=${encodeURIComponent(fullCategoryPath)}`;
                            topicGroup.appendChild(btn);
                        });

                        subBlock.appendChild(topicGroup);
                        mainCard.appendChild(subBlock);
                    });

                    wrapper.appendChild(mainCard);
                });

            } catch (err) {
                console.error("Error loading 3-level categories:", err);
                wrapper.innerHTML = `<p style="text-align:center; color: var(--danger); padding: 30px;"><i class="fa-solid fa-triangle-exclamation"></i> ক্যাটাগরি ডাটা লোড করতে সমস্যা হয়েছে!</p>`;
            }
        }

        window.onload = fetchCategories;
    </script>

</body>
</html>

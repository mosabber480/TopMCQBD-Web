<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK (Root level path for /pages files) -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .auth-card {
            background: white;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid #e2e8f0;
        }

        h2 { margin-top: 0; color: var(--dark, #2c3e50); text-align: center; margin-bottom: 20px; font-weight: 700; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        
        /* PASSWORD FIELD WITH EYE ICON STYLING */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password-icon {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #777;
            font-size: 15px;
            transition: color 0.2s ease;
            user-select: none;
        }

        .toggle-password-icon:hover {
            color: var(--primary, #007bff);
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus { border-color: var(--primary, #007bff); }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary, #007bff);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover { background-color: var(--primary-dark, #0056b3); }

        .toggle-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }
        .toggle-link {
            color: var(--primary, #007bff);
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div id="global-announce-bar" style="display:none;"></div>
        <header id="global-header"></header>

        <main class="main-content">
            <div class="auth-card">
                <h2 id="formTitle"><i class="fa-solid fa-lock"></i> Login to Account</h2>
                
                <div id="alertBox" class="alert"></div>

                <!-- LOGIN FORM -->
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address:</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email..." required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter password..." required>
                            <i class="fa-solid fa-eye toggle-password-icon" onclick="togglePasswordVisibility('loginPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn" id="loginBtn">
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                </form>

                <!-- REGISTER FORM -->
                <form id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" id="regName" placeholder="Enter full name..." required>
                    </div>
                    <div class="form-group">
                        <label>Email Address:</label>
                        <input type="email" id="regEmail" placeholder="Enter email address..." required>
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <div class="password-wrapper">
                            <input type="password" id="regPassword" placeholder="Create a password..." required>
                            <i class="fa-solid fa-eye toggle-password-icon" onclick="togglePasswordVisibility('regPassword', this)"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password:</label>
                        <div class="password-wrapper">
                            <input type="password" id="regConfirmPassword" placeholder="Re-enter password to confirm..." required>
                            <i class="fa-solid fa-eye toggle-password-icon" onclick="togglePasswordVisibility('regConfirmPassword', this)"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn" id="regBtn" style="background-color: #28a745;">
                        <i class="fa-solid fa-user-plus"></i> Register Account
                    </button>
                </form>

                <div class="toggle-text" id="toggleMessage">
                    Don't have an account? <span class="toggle-link" onclick="toggleForm('register')">Register Now</span>
                </div>
            </div>
        </main>

        <footer id="global-footer"></footer>
    </div>

    <!-- GLOBAL JS LINK (Root level path for /pages files) -->
    <script src="global/global.js"></script>

    <script>
        const AUTH_API = 'https://mosabber-quiz-app.onrender.com/api/auth';

        function togglePasswordVisibility(inputId, icon) {
            const inputField = document.getElementById(inputId);
            if (inputField.type === "password") {
                inputField.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                inputField.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'register' || urlParams.get('mode') === 'register') {
                toggleForm('register');
            }
        });

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `${isSuccess ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-exclamation"></i>'} ${msg}`;
            alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'}`;
            alertBox.style.display = 'block';
        }

        function toggleForm(type) {
            document.getElementById('alertBox').style.display = 'none';
            if (type === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-pen"></i> Register Account';
                document.getElementById('toggleMessage').innerHTML = `Already have an account? <span class="toggle-link" onclick="toggleForm('login')">Login Here</span>`;
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-lock"></i> Login to Account';
                document.getElementById('toggleMessage').innerHTML = `Don't have an account? <span class="toggle-link" onclick="toggleForm('register')">Register Now</span>`;
            }
        }

        // LOGIN SUBMIT
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;
            btn.disabled = true;

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${AUTH_API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && (data.success || data.token)) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('quiz_token', data.token);
                    localStorage.setItem('quiz_user', JSON.stringify(data.user));

                    showAlert("Login Successful! Redirecting...", true);
                    
                    setTimeout(() => {
                        if (data.user && (data.user.role === 'owner' || data.user.role === 'admin')) {
                            window.location.href = 'admin/dashboard.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    }, 1000);
                } else {
                    showAlert(data.message || "Invalid login credentials!");
                }
            } catch (err) {
                showAlert("Server connection error!");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login`;
                btn.disabled = false;
            }
        });

        // REGISTER SUBMIT
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                showAlert("Passwords do not match! Please re-check.");
                return;
            }

            const btn = document.getElementById('regBtn');
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...`;
            btn.disabled = true;

            try {
                const res = await fetch(`${AUTH_API}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (res.ok && (data.success || data.token)) {
                    showAlert("Registration successful! Please login below.", true);
                    document.getElementById('registerForm').reset();
                    setTimeout(() => toggleForm('login'), 1500);
                } else {
                    showAlert(data.message || "Registration failed!");
                }
            } catch (err) {
                showAlert("Server connection error!");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Register Account`;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

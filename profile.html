<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile & Subscription - MCQ Platform</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP ALERT BANNER STYLING */
        #topAlertBanner {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; padding: 12px 30px; display: none;
            justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            background-color: #ffffff; color: #2c3e50; font-weight: 600; font-size: 15px;
            border-top: 16px solid #2a3c4d; border-bottom: 1px solid #e2e8f0; animation: slideDown 0.3s ease-in-out;
        }
        #topAlertBanner::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 6px; background-color: #dc3545; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
        #topAlertBanner.info::before { background-color: #007bff; }
        #topAlertBanner.success::before { background-color: #28a745; }
        #topAlertBanner.warning::before { background-color: #ff9f43; }
        #topAlertBanner.danger::before { background-color: #dc3545; }

        .alert-btns { display: flex; gap: 10px; }
        .btn-alert { padding: 7px 18px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-alert-ok { background-color: #28a745; color: white; }
        .btn-alert-ok:hover { background-color: #218838; }
        .btn-alert-cancel { background-color: #dc3545; color: white; }
        .btn-alert-cancel:hover { background-color: #c82333; }

        .profile-container-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .user-info p { margin: 8px 0; color: #555; font-size: 15px; }

        .sub-box {
            background-color: #f8f9fa;
            border-left: 5px solid #007bff;
            padding: 15px 20px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
        }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-quiz { background-color: #28a745; color: white; }
        .btn-quiz:hover { background-color: #218838; }
        .btn-logout { background-color: #dc3545; color: white; }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <!-- TOP ALERT BANNER SYSTEM WITH YES / NO BUTTONS -->
    <div id="topAlertBanner">
        <span id="alertMessage">Message here...</span>
        <div class="alert-btns">
            <button class="btn-alert btn-alert-ok" id="alertOkBtn">Yes</button>
            <button class="btn-alert btn-alert-cancel" id="alertCancelBtn" style="display:none;">No</button>
        </div>
    </div>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <!-- MAIN PROFILE SECTION -->
    <main class="profile-container-wrapper">
        <div class="profile-card">
            <div class="profile-header">
                <h2 style="margin:0; color:#333;"><i class="fa-solid fa-user-gear" style="color:var(--primary);"></i> User Profile</h2>
                <span id="roleBadge" class="badge" style="background:#e0e0e0;">Customer</span>
            </div>

            <div class="user-info">
                <p><strong>Full Name:</strong> <span id="userName">Loading...</span></p>
                <p><strong>Email Address:</strong> <span id="userEmail">Loading...</span></p>
            </div>

            <div class="sub-box">
                <h3 style="margin-top:0; color:#007bff; font-size:16px;"><i class="fa-solid fa-gem"></i> Subscription Status</h3>
                <p><strong>Current Plan:</strong> <span id="subPlan">None</span></p>
                <p><strong>Status:</strong> <span id="subStatus" class="badge badge-expired">Checking...</span></p>
                <p><strong>Expiration Date:</strong> <span id="subExpiry">N/A</span></p>
            </div>

            <div class="btn-group">
                <a href="index.html" class="btn btn-quiz"><i class="fa-solid fa-play"></i> Start Practice</a>
                <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>
    </main>

    <!-- DYNAMIC FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINK -->
    <script src="global/global.js"></script>

    <!-- PROFILE LOGIC -->
    <script>
        const user = JSON.parse(localStorage.getItem('quiz_user') || localStorage.getItem('user'));
        const token = localStorage.getItem('quiz_token') || localStorage.getItem('token');

        function showTopAlert(msg, type = 'info', isConfirm = false) {
            return new Promise((resolve) => {
                const banner = document.getElementById('topAlertBanner');
                document.getElementById('alertMessage').innerHTML = msg;
                banner.className = type;
                banner.style.display = 'flex';

                const okBtn = document.getElementById('alertOkBtn');
                const cancelBtn = document.getElementById('alertCancelBtn');

                if (isConfirm) {
                    cancelBtn.style.display = 'inline-block';
                } else {
                    cancelBtn.style.display = 'none';
                }

                okBtn.onclick = () => { banner.style.display = 'none'; resolve(true); };
                cancelBtn.onclick = () => { banner.style.display = 'none'; resolve(false); };

                if (!isConfirm) {
                    setTimeout(() => { banner.style.display = 'none'; resolve(true); }, 4000);
                }
            });
        }

        if (!token || !user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').innerText = user.name || 'N/A';
            document.getElementById('userEmail').innerText = user.email || 'N/A';
            document.getElementById('roleBadge').innerText = user.role ? user.role.toUpperCase() : 'CUSTOMER';

            const sub = user.subscription || {};
            const isSubActive = sub.active && sub.endDate && new Date(sub.endDate) > new Date();

            document.getElementById('subPlan').innerText = sub.plan ? sub.plan.replace('_', ' ').toUpperCase() : 'NO PLAN';
            
            const statusElem = document.getElementById('subStatus');
            if (user.role === 'owner' || user.role === 'admin') {
                statusElem.innerText = 'FULL ACCESS';
                statusElem.className = 'badge badge-active';
                document.getElementById('subExpiry').innerText = 'Lifetime Access';
            } else if (isSubActive) {
                statusElem.innerText = 'ACTIVE';
                statusElem.className = 'badge badge-active';
                document.getElementById('subExpiry').innerText = new Date(sub.endDate).toLocaleDateString();
            } else {
                statusElem.innerText = 'INACTIVE / EXPIRED';
                statusElem.className = 'badge badge-expired';
                document.getElementById('subExpiry').innerText = sub.endDate ? new Date(sub.endDate).toLocaleDateString() : 'N/A';
            }
        }

        async function logout() {
            const confirmLogout = await showTopAlert('আপনি কি নিশ্চিত যে লগআউট করতে চান?', 'warning', true);
            if (confirmLogout) {
                localStorage.removeItem('quiz_token');
                localStorage.removeItem('quiz_user');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>

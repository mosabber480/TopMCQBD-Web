<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MCQ Platform</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global/global.css">

    <style>
        .container { max-width: 1300px; margin: 40px auto; padding: 0 20px; width: 100%; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; } 
        .box { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        
        .form-group { margin-bottom: 12px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 8px 35px 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .toggle-password { position: absolute; right: 10px; top: 32px; cursor: pointer; color: #888; }
        
        .btn-submit { background-color: #007bff; width: fit-content; min-width: 140px; padding: 10px 20px; font-size: 14px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-logout { background-color: #dc3545; color: white; width: fit-content; min-width: 140px; padding: 10px 20px; text-align: center; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; border: none; cursor: pointer; display: inline-block; margin-top: 15px; }
        .btn-quiz { background-color: #28a745; color: white; width: fit-content; min-width: 140px; padding: 10px 20px; text-align: center; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block; }

        .sub-box { 
            background-color: white; 
            padding: 15px 20px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0;
            border-left: 5px solid #007bff; 
        }
        
        .badge { display: inline-block; padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 12px; }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        .badge-pending { background-color: #ffc107; color: #212529; }
        .badge-rejected { background-color: #f8d7da; color: #721c24; }
        .badge-type { background-color: #e2e8f0; color: #333; }

        .plan-link-btn { 
            display: inline-flex; 
            align-items: center;
            background-color: #007bff; 
            color: white !important; 
            padding: 3px 12px; 
            border-radius: 30px;
            text-decoration: none; 
            font-size: 12px; 
            font-weight: bold; 
            margin-left: 10px; 
            transition: 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            vertical-align: middle;
        }
        .plan-link-btn i {
            margin-left: 6px;
            font-size: 12px;
        }
        .plan-link-btn:hover { 
            background-color: #0056b3; 
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* একাধিক pending request কার্ড আকারে দেখানোর জন্য */
        .pending-request-card {
            margin: 10px 0;
            padding: 12px 15px;
            background: #fff8e1;
            border: 1px dashed #ffc107;
            border-radius: 6px;
        }
        .pending-request-card.rejected {
            background: #fdf2f2;
            border: 1px dashed #dc3545;
        }
        .pending-request-card .prc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .pending-request-card .prc-plan {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .pending-request-card .prc-info {
            font-size: 12.5px;
            color: #555;
            line-height: 1.8;
            margin: 0;
        }
        .pending-request-card .prc-info span { color: #222; font-weight: 600; }

        .logout-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(3px);
        }
        .logout-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .logout-modal {
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 90%;
        }
        .logout-modal-overlay.active .logout-modal {
            transform: translateY(0);
        }
        .logout-icon {
            font-size: 45px;
            color: #dc3545;
            margin-bottom: 15px;
        }
        .logout-modal h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 22px;
        }
        .logout-modal p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.5;
        }
        .logout-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .logout-btn-cancel, .logout-btn-confirm {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            flex: 1;
        }
        .logout-btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }
        .logout-btn-cancel:hover {
            background: #cbd5e1;
        }
        .logout-btn-confirm {
            background: #dc3545;
            color: white;
        }
        .logout-btn-confirm:hover {
            background: #c82333;
        }

        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; gap: 20px; } }
    </style>
</head>
<body>

    <header id="global-header"></header>

    <div class="container">
        <div class="grid-2">
            <!-- বাম কলাম -->
            <div>
                <div class="box">
                    <h2 style="margin-top: 0; margin-bottom: 15px;"><i class="fa-solid fa-user"></i> <span id="mainUserName"></span></h2>
                    <p style="margin: 8px 0;"><strong>Name:</strong> <span id="userName"></span></p>
                    <p style="margin: 8px 0;"><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p style="margin: 8px 0;"><strong>Status:</strong> <span id="userStatusBadge" class="badge"></span></p>
                </div>

                <form id="changePasswordForm" class="box" style="border-left: 5px solid #ffc107;">
                    <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 18px; color: #333;">
                        <i class="fa-solid fa-lock"></i> Change Password
                    </h3>
                    
                    <div class="form-group">
                        <label>Current Password:</label>
                        <input type="password" id="oldPassword" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('oldPassword')"></i>
                    </div>
                    <div class="form-group">
                        <label>New Password:</label>
                        <input type="password" id="newPassword" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('newPassword')"></i>
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password:</label>
                        <input type="password" id="confirmNewPassword" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmNewPassword')"></i>
                    </div>
                    
                    <div style="margin-top: 15px;">
                        <button type="submit" class="btn-submit" style="background-color: #28a745; margin-top:0;">Update</button>
                    </div>
                </form>

                <button class="btn-logout" type="button" onclick="openLogoutModal()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>

            <!-- ডান কলাম -->
            <div style="padding:0;">
                <div class="sub-box">
                    <h4 style="margin:0 0 10px 0; color:#007bff;"><i class="fa-solid fa-gem"></i> Subscription Status</h4>
                    <p style="margin: 5px 0; line-height: 2;"><strong>Current Plan:</strong> <span id="subPlan" style="font-weight:bold;"></span></p>

                    <p style="margin: 5px 0;"><strong>Expiration Date:</strong> <span id="subExpiry"></span></p>
                    <p style="margin: 5px 0;" id="remainingTimeWrapper"><strong>Remaining Time:</strong> <span id="subRemaining" style="color: #e67e22; font-weight: bold;"></span></p>

                    <!-- একাধিক Pending Request-এর লিস্ট এখানে JS দিয়ে রেন্ডার হবে -->
                    <div id="pendingRequestsWrapper" style="display: none; margin-top: 12px;">
                        <p style="margin: 0 0 4px 0; font-weight: bold; font-size: 13px; color: #555;">
                            <i class="fa-solid fa-clock-rotate-left"></i> Your Requests:
                        </p>
                        <div id="pendingRequestsList"></div>
                    </div>
                </div>
                <a href="index.html" class="btn-quiz"><i class="fa-solid fa-play"></i> Start Practice</a>
            </div>
        </div>
    </div>

    <div class="logout-modal-overlay" id="logoutModal">
        <div class="logout-modal">
            <i class="fa-solid fa-right-from-bracket logout-icon"></i>
            <h3>লগআউট নিশ্চিত করুন</h3>
            <p>আপনি কি নিশ্চিত যে আপনি আপনার একাউন্ট থেকে লগআউট করতে চান?</p>
            <div class="logout-actions">
                <button class="logout-btn-cancel" onclick="closeLogoutModal()">বাতিল করুন</button>
                <button class="logout-btn-confirm" onclick="confirmLogout()">লগআউট</button>
            </div>
        </div>
    </div>

    <footer id="global-footer"></footer>

    <script src="global/global.js"></script>
    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000/api' 
            : 'https://mosabber-quiz-app.onrender.com/api';

        let user = JSON.parse(localStorage.getItem('quiz_user') || localStorage.getItem('user'));
        const token = localStorage.getItem('quiz_token') || localStorage.getItem('token');

        if (!token || !user) { window.location.href = 'login.html'; }

        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function getRemainingTime(endDateStr) {
            const now = new Date();
            const end = new Date(endDateStr);
            if (end <= now) return 'Expired';

            let years = end.getFullYear() - now.getFullYear();
            let months = end.getMonth() - now.getMonth();
            let days = end.getDate() - now.getDate();
            let hours = end.getHours() - now.getHours();

            if (hours < 0) { hours += 24; days--; }
            if (days < 0) { const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0); days += prevMonth.getDate(); months--; }
            if (months < 0) { months += 12; years--; }

            let parts = [];
            if (years > 0) parts.push(`${years} Year${years > 1 ? 's' : ''}`);
            if (months > 0) parts.push(`${months} Month${months > 1 ? 's' : ''}`);
            if (days > 0) parts.push(`${days} Day${days > 1 ? 's' : ''}`);
            if (hours > 0) parts.push(`${hours} Hour${hours > 1 ? 's' : ''}`);

            return parts.length > 0 ? parts.join(' ') : 'Less than 1 Hour';
        }

        function planLabel(plan) {
            return (plan || '').replace('_', ' ').toUpperCase();
        }

        function typeLabel(type) {
            if (type === 'renew') return 'মেয়াদ বৃদ্ধি (Renew)';
            if (type === 'add') return 'অতিরিক্ত যোগ (Add)';
            return 'নতুন রিকোয়েস্ট';
        }

        function methodLabel(method) {
            return method === 'bkash' ? 'বিকাশ' : method === 'nagad' ? 'নগদ' : method;
        }

        // একাধিক pending request কার্ড আকারে রেন্ডার করা
        function renderPendingRequests(pendingRequests) {
            const wrapper = document.getElementById('pendingRequestsWrapper');
            const list = document.getElementById('pendingRequestsList');
            list.innerHTML = '';

            if (!pendingRequests || pendingRequests.length === 0) {
                wrapper.style.display = 'none';
                return;
            }

            wrapper.style.display = 'block';

            pendingRequests.forEach((reqItem) => {
                const isRejected = reqItem.status === 'rejected';
                const card = document.createElement('div');
                card.className = 'pending-request-card' + (isRejected ? ' rejected' : '');

                card.innerHTML = `
                    <div class="prc-top">
                        <span class="prc-plan">${planLabel(reqItem.plan)}</span>
                        <span class="badge ${isRejected ? 'badge-rejected' : 'badge-pending'}">${isRejected ? 'Rejected' : 'Pending'}</span>
                    </div>
                    <p class="prc-info">
                        <span class="badge badge-type" style="margin-bottom:4px; display:inline-block;">${typeLabel(reqItem.type)}</span><br>
                        ফোন: <span>${reqItem.phone}</span> &nbsp;|&nbsp; ট্রানজেকশন আইডি: <span>${reqItem.transactionId}</span> &nbsp;|&nbsp; মাধ্যম: <span>${methodLabel(reqItem.paymentMethod)}</span><br>
                        পাঠানো হয়েছে: <span>${new Date(reqItem.requestedAt).toLocaleString()}</span>
                        ${isRejected && reqItem.rejectionReason ? `<br><span style="color:#dc3545;">কারণ: ${reqItem.rejectionReason}</span>` : ''}
                    </p>
                `;
                list.appendChild(card);
            });
        }

        function renderProfileUI() {
            document.getElementById('mainUserName').innerText = user.name || 'User';
            document.getElementById('userName').innerText = user.name || 'N/A';
            document.getElementById('userEmail').innerText = user.email || 'N/A';
            
            const sub = user.subscription || {};
            const isSubActive = sub.active && sub.endDate && new Date(sub.endDate) > new Date();
            const pendingRequests = user.pendingRequests || [];
            const activePendingCount = pendingRequests.filter(r => r.status === 'pending').length;
            const hasActivePending = activePendingCount > 0;
            const subPlanElem = document.getElementById('subPlan');

            if (sub.plan && sub.plan !== 'none') {
                subPlanElem.innerHTML = planLabel(sub.plan);
                subPlanElem.style.color = "#28a745";
            } else if (hasActivePending) {
                subPlanElem.innerHTML = `আপনার ${activePendingCount} টি রিকোয়েস্ট এডমিন অ্যাপ্রুভালের অপেক্ষায় আছে। <a href="contact.html" class="plan-link-btn">Contact Us <i class="fa-solid fa-arrow-right"></i></a>`;
                subPlanElem.style.color = "#856404";
            } else {
                subPlanElem.innerHTML = `আপনার কোনো প্যাকেজ সিলেক্ট করা নাই। <a href="packages.html" class="plan-link-btn">Choose a package <i class="fa-solid fa-arrow-right"></i></a>`;
                subPlanElem.style.color = "#dc3545";
            }
            
            const statusElem = document.getElementById('userStatusBadge');
            const remainingWrapper = document.getElementById('remainingTimeWrapper');
            const remainingElem = document.getElementById('subRemaining');

            remainingWrapper.style.display = 'block';

            if (user.role === 'owner' || user.role === 'admin') {
                statusElem.innerText = 'FULL ACCESS';
                statusElem.className = 'badge badge-active';
                document.getElementById('subExpiry').innerText = 'Lifetime Access';
                remainingWrapper.style.display = 'none'; 
            } else if (isSubActive) {
                statusElem.innerText = 'ACTIVE';
                statusElem.className = 'badge badge-active';
                document.getElementById('subExpiry').innerText = new Date(sub.endDate).toLocaleDateString();
                remainingElem.innerText = getRemainingTime(sub.endDate); 
            } else {
                statusElem.innerText = 'INACTIVE / EXPIRED';
                statusElem.className = 'badge badge-expired';
                document.getElementById('subExpiry').innerText = sub.endDate ? new Date(sub.endDate).toLocaleDateString() : 'N/A';
                remainingWrapper.style.display = 'none'; 
            }

            // Active subscription থাকলেও pending (renew) request থাকতে পারে, তাই badge শুধু inactive অবস্থায় override হবে
            if (hasActivePending && user.role !== 'owner' && user.role !== 'admin' && !isSubActive) {
                statusElem.innerText = 'PENDING APPROVAL';
                statusElem.className = 'badge badge-pending';
            }

            renderPendingRequests(pendingRequests);
        }

        if(user) {
            renderProfileUI();
        }

        async function fetchLiveUserData() {
            try {
                const res = await fetch(`${API_BASE}/users/me`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success && data.user) {
                    user = data.user; 
                    const storageKey = localStorage.getItem('quiz_user') ? 'quiz_user' : 'user';
                    localStorage.setItem(storageKey, JSON.stringify(user));
                    
                    renderProfileUI(); 
                }
            } catch (err) {
                console.error('Error fetching live data:', err);
            }
        }

        fetchLiveUserData();

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmPassword) {
                showTopAlert('❌ নতুন পাসওয়ার্ড দুটি মিলছে না!', 'danger');
                return;
            }

            const res = await fetch(`${API_BASE}/auth/change-password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ 
                    oldPassword: document.getElementById('oldPassword').value,
                    newPassword: newPassword 
                })
            });
            const data = await res.json();
            if (data.success) { showTopAlert('✅ ' + data.message, 'success'); document.getElementById('changePasswordForm').reset(); }
            else { showTopAlert('❌ ' + data.message, 'danger'); }
        });

        function openLogoutModal() {
            document.getElementById('logoutModal').classList.add('active');
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').classList.remove('active');
        }

        function confirmLogout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>

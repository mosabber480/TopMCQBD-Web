<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্যাকেজসমূহ - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        .page-banner {
            background: linear-gradient(135deg, var(--dark), #1a252f);
            color: white;
            padding: 50px 20px;
            text-align: center;
        }
        .page-banner h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .page-banner p { font-size: 16px; color: #cbd5e1; }
        
        .content-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .package-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .package-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #e9ecef; display: flex; flex-direction: column; }
        .package-img { width: 100%; height: 160px; object-fit: cover; }
        .package-body { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .package-title { font-size: 20px; color: var(--dark); margin-bottom: 8px; font-weight: 700; }
        .package-desc { color: var(--gray); font-size: 14px; margin-bottom: 15px; flex-grow: 1; line-height: 1.6; }
        .package-price { font-size: 24px; font-weight: 800; color: var(--secondary-dark); margin-bottom: 15px; }
        .package-price span { font-size: 14px; color: var(--gray); font-weight: normal; }
        .btn-buy { background-color: var(--dark); color: white; text-decoration: none; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .loading-box { text-align: center; padding: 50px; font-size: 18px; color: var(--gray); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <div class="page-banner">
        <h1 id="pkg-page-title">আমাদের প্রিপারেশন প্যাকেজসমূহ</h1>
        <p id="pkg-page-subtitle">আপনার প্রয়োজন অনুযায়ী সেরা প্রিপারেশন প্যাকেজটি বেছে নিন</p>
    </div>

    <div class="content-container">
        <div class="package-grid" id="packages-wrapper">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> প্যাকেজ লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- DYNAMIC FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINK -->
    <script src="global/global.js"></script>

    <script>
        const API_URL = 'https://mosabber-quiz-app.onrender.com/api/home-config';

        async function fetchPackages() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                if (data.packageSectionInfo && data.packageSectionInfo.title) {
                    document.getElementById('pkg-page-title').innerText = data.packageSectionInfo.title;
                    if (data.packageSectionInfo.subtitle) {
                        document.getElementById('pkg-page-subtitle').innerText = data.packageSectionInfo.subtitle;
                    }
                }

                const pkgWrapper = document.getElementById('packages-wrapper');
                if (data.packages && data.packages.length > 0) {
                    pkgWrapper.innerHTML = data.packages.map(p => `
                        <div class="package-card">
                            ${p.imageUrl ? `<img src="${p.imageUrl}" class="package-img" alt="${p.title}">` : '<div class="package-img" style="background:#e2e8f0; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-box-open" style="font-size:40px; color:#aaa;"></i></div>'}
                            <div class="package-body">
                                <h3 class="package-title">${p.title}</h3>
                                <p class="package-desc">${p.desc}</p>
                                <div class="package-price">${p.price} <span>${p.duration}</span></div>
                                <a href="${p.buyLink || '#contact'}" class="btn-buy"><i class="fa-solid fa-cart-shopping"></i> প্যাকেজটি কিনুন</a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    pkgWrapper.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">কোনো প্যাকেজ পাওয়া যায়নি।</p>`;
                }
            } catch (err) {
                console.error("Package fetch error:", err);
            }
        }

        window.onload = fetchPackages;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopMCQ - সেরা অনলাইন কুইজ ও প্রস্তুতি প্ল্যাটফর্ম</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        /* ভেরিয়েবল ডিফাইন করা হলো যাতে এরর না আসে */
        :root {
            --secondary-dark: #27ae60;
        }

        /* এখানে শুধু index.html পেজের নিজস্ব স্লাইডার বা কন্টেন্টের CSS থাকবে */
        .slider-section {
            position: relative;
            max-width: 1300px;
            margin: 25px auto 0 auto;
            padding: 0 20px;
        }
        .slider-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #1a252f;
            min-height: 380px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .slide { display: none; padding: 60px 50px; color: white; position: relative; min-height: 380px; }
        .slide.active { display: flex; flex-direction: column; justify-content: center; }
        .slide-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; }
        .slide-content { position: relative; z-index: 2; }
        .slide h1 { font-size: 34px; margin-bottom: 15px; color: #ffffff; font-weight: 800; }
        .slide p { font-size: 18px; color: #ecf0f1; margin-bottom: 30px; max-width: 700px; }
        .slide-btns { display: flex; gap: 15px; flex-wrap: wrap; }
        
        /* UPDATED BUTTON STYLE */
        .btn-main { background-color: var(--secondary); color: white; text-decoration: none; padding: 12px 26px; border-radius: 6px; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; transition: background-color 0.3s ease; }
        .btn-main:hover { background-color: var(--secondary-dark); }
        
        .btn-secondary { background-color: rgba(255, 255, 255, 0.15); color: white; text-decoration: none; padding: 12px 26px; border-radius: 6px; font-weight: bold; font-size: 15px; border: 2px solid white; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); }
        .btn-secondary:hover { background-color: white; color: var(--dark); }
        .slider-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.4); cursor: pointer; transition: all 0.3s ease; }
        .dot.active { background-color: #ffffff; width: 28px; border-radius: 10px; }
        
        .section-container { max-width: 1300px; margin: 50px auto; padding: 0 20px; }
        .section-title { text-align: center; font-size: 28px; color: var(--dark); margin-bottom: 10px; font-weight: 700; }
        .section-subtitle { text-align: center; color: var(--gray); font-size: 15px; margin-bottom: 35px; }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .demo-card { background: white; padding: 22px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e9ecef; display: flex; flex-direction: column; justify-content: space-between; }
        .demo-badge { background-color: #e3f2fd; color: var(--primary); padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700; width: fit-content; margin-bottom: 12px; }
        .demo-card h3 { font-size: 18px; color: var(--dark); margin-bottom: 10px; }
        .demo-card p { color: var(--gray); font-size: 14px; margin-bottom: 20px; }
        .btn-demo { background-color: var(--primary); color: white; text-decoration: none; padding: 10px; border-radius: 6px; text-align: center; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .package-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .package-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #e9ecef; display: flex; flex-direction: column; }
        .package-img { width: 100%; height: 160px; object-fit: cover; }
        .package-body { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; }
        .package-title { font-size: 20px; color: var(--dark); margin-bottom: 8px; font-weight: 700; }
        .package-desc { color: var(--gray); font-size: 14px; margin-bottom: 15px; flex-grow: 1; }
        .package-price { font-size: 24px; font-weight: 800; color: var(--secondary-dark); margin-bottom: 15px; }
        .package-price span { font-size: 14px; color: var(--gray); font-weight: normal; }
        .btn-buy { background-color: var(--dark); color: white; text-decoration: none; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .mission-section { background-color: white; padding: 50px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 50px; }
        .mission-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 20px; }
        .mission-box { padding: 20px; background-color: #f8f9fa; border-left: 4px solid var(--primary); border-radius: 6px; }
        .loading-box { text-align: center; padding: 50px; font-size: 18px; color: var(--gray); }
    </style>
</head>
<body>

    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <section class="slider-section">
        <div class="slider-wrapper" id="slider-wrapper">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> ডাটা লোড হচ্ছে...</div>
        </div>
        <div class="slider-dots" id="slider-dots"></div>
    </section>

    <section class="section-container" id="demo">
        <h2 class="section-title" id="demo-section-title">ফ্রি ডেমো কুইজ (Free Demo Quiz)</h2>
        <p class="section-subtitle" id="demo-section-subtitle">কোনো রেজিস্ট্রেশন ছাড়াই এখনই নিচের কুইজগুলো প্র্যাকটিস করে দেখুন</p>
        <div class="demo-grid" id="demo-wrapper">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> কুইজ লোড হচ্ছে...</div>
        </div>
    </section>

    <section class="section-container" id="packages">
        <h2 class="section-title" id="package-section-title">আমাদের প্রিপারেশন প্যাকেজসমূহ</h2>
        <p class="section-subtitle" id="package-section-subtitle">আপনার প্রয়োজন অনুযায়ী সেরা প্যাকেজটি বেছে নিন</p>
        <div class="package-grid" id="packages-wrapper">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> প্যাকেজ লোড হচ্ছে...</div>
        </div>
    </section>

    <section class="section-container" id="mission">
        <div class="mission-section" id="mission-wrapper">
            <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</div>
        </div>
    </section>

    <footer id="global-footer"></footer>

    <script src="config.js"></script>
    <script src="global/global.js"></script>

    <script>
        const API_URL = `${CONFIG.MAIN_PAID_API}/home-config`;
        let slideIndex = 0;
        let slideInterval;

        async function loadHomePageData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                // --- SEO Title & Description Setup ---
                if (data.seoTitle) {
                    document.title = data.seoTitle;
                }

                if (data.seoDescription) {
                    let metaDesc = document.querySelector('meta[name="description"]');
                    if (!metaDesc) {
                        metaDesc = document.createElement('meta');
                        metaDesc.name = "description";
                        document.getElementsByTagName('head')[0].appendChild(metaDesc);
                    }
                    metaDesc.content = data.seoDescription;
                }

                const sliderWrapper = document.getElementById('slider-wrapper');
                const sliderDots = document.getElementById('slider-dots');

                if (data.sliders && data.sliders.length > 0) {
                    sliderWrapper.innerHTML = data.sliders.map((s, index) => {
                        const imgUrl = s.bgImage || 'images/slider-01.jpg';
                        const opacity = s.bgOpacity !== undefined ? s.bgOpacity : 0.5;

                        return `
                            <div class="slide ${index === 0 ? 'active' : ''}">
                                <div class="slide-bg" style="background-image: url('${imgUrl}'); opacity: ${opacity};"></div>
                                <div class="slide-content">
                                    <h1>${s.title}</h1>
                                    <p>${s.subtitle}</p>
                                    <div class="slide-btns">
                                        ${s.btn1Text ? `<a href="${s.btn1Link}" class="btn-main">${s.btn1Text}</a>` : ''}
                                        ${s.btn2Text ? `<a href="${s.btn2Link}" class="btn-secondary">${s.btn2Text}</a>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    sliderDots.innerHTML = data.sliders.map((_, index) => `
                        <span class="dot ${index === 0 ? 'active' : ''}" onclick="currentSlide(${index})"></span>
                    `).join('');

                    startAutoSlider();
                } else {
                    sliderWrapper.innerHTML = `<p style="text-align:center; padding: 40px; color:white;">কোনো স্লাইডার পাওয়া যায়নি।</p>`;
                }

                const demoTitleEl = document.getElementById('demo-section-title');
                const demoSubEl = document.getElementById('demo-section-subtitle');
                if (data.demoSectionInfo && data.demoSectionInfo.title) {
                    if (demoTitleEl) demoTitleEl.innerText = data.demoSectionInfo.title;
                    if (demoSubEl) demoSubEl.innerText = data.demoSectionInfo.subtitle || '';
                }

                const demoWrapper = document.getElementById('demo-wrapper');
                if (data.demoQuizzes && data.demoQuizzes.length > 0) {
                    demoWrapper.innerHTML = data.demoQuizzes.map(d => `
                        <div class="demo-card">
                            <div>
                                <span class="demo-badge">${d.badgeText || 'ফ্রি টেস্ট'}</span>
                                <h3>${d.title}</h3>
                                <p>${d.desc}</p>
                            </div>
                            <a href="${d.link}" class="btn-demo">কুইজ দিন <i class="fa-solid fa-arrow-right"></i></a>
                        </div>
                    `).join('');
                } else {
                    demoWrapper.innerHTML = `<p style="text-align:center;">কোনো ডেমো কুইজ পাওয়া যায়নি।</p>`;
                }

                const pkgTitleEl = document.getElementById('package-section-title');
                const pkgSubEl = document.getElementById('package-section-subtitle');
                if (data.packageSectionInfo && data.packageSectionInfo.title) {
                    if (pkgTitleEl) pkgTitleEl.innerText = data.packageSectionInfo.title;
                    if (pkgSubEl) pkgSubEl.innerText = data.packageSectionInfo.subtitle || '';
                }

                const pkgWrapper = document.getElementById('packages-wrapper');
                if (data.packages && data.packages.length > 0) {
                    pkgWrapper.innerHTML = data.packages.map(p => `
                        <div class="package-card">
                            ${p.imageUrl ? `<img src="${p.imageUrl}" class="package-img" alt="${p.title}">` : '<div class="package-img" style="background:#e2e8f0; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-box-open" style="font-size:40px; color:#aaa;"></i></div>'}
                            <div class="package-body">
                                <h3 class="package-title">${p.title}</h3>
                                <p class="package-desc">${p.desc}</p>
                                <div class="package-price">${p.price} <span>${p.duration}</span></div>
                                <a href="${p.buyLink || '#contact'}" class="btn-buy"><i class="fa-solid fa-cart-shopping"></i> প্যাকেজটি কিনুন</a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    pkgWrapper.innerHTML = `<p style="text-align:center;">কোনো প্যাকেজ পাওয়া যায়নি।</p>`;
                }

                const missionWrapper = document.getElementById('mission-wrapper');
                if (data.missionSectionInfo && (data.missionSectionInfo.sectionTitle || data.missionSectionInfo.missionDesc)) {
                    const m = data.missionSectionInfo;
                    document.getElementById('mission').style.display = 'block';
                    missionWrapper.innerHTML = `
                        <h2 class="section-title">${m.sectionTitle || 'আমাদের মিশন ও লক্ষ্য'}</h2>
                        <p class="section-subtitle">${m.sectionSubtitle || ''}</p>

                        <div class="mission-grid">
                            ${m.missionTitle || m.missionDesc ? `
                                <div class="mission-box">
                                    <h3><i class="fa-solid fa-bullseye"></i> ${m.missionTitle || 'আমাদের মিশন (Mission)'}</h3>
                                    <p>${m.missionDesc || ''}</p>
                                </div>
                            ` : ''}
                            ${m.goalTitle || m.goalDesc ? `
                                <div class="mission-box">
                                    <h3><i class="fa-solid fa-rocket"></i> ${m.goalTitle || 'আমাদের লক্ষ্য (Goal)'}</h3>
                                    <p>${m.goalDesc || ''}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    document.getElementById('mission').style.display = 'none';
                }

            } catch (err) {
                console.error("Data Fetch Error:", err);
            }
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            if (slides.length === 0) return;

            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));

            slideIndex = index;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;

            slides[slideIndex].classList.add('active');
            dots[slideIndex].classList.add('active');
        }

        function currentSlide(index) {
            showSlide(index);
            resetAutoSlider();
        }

        function startAutoSlider() {
            slideInterval = setInterval(() => {
                showSlide(slideIndex + 1);
            }, 5000);
        }

        function resetAutoSlider() {
            clearInterval(slideInterval);
            startAutoSlider();
        }

        window.onload = function() {
            loadHomePageData();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & User Management - TopMCQ</title>
    
    <!-- Instant Auth Check (Direct Redirect without Alert Popup) -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) {
                window.location.replace('login.html');
            }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #17a2b8;
            --warning: #ff9f43;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --gray-btn: #6c757d;
            --main-dash-btn: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--light); 
            color: #333;
        }

        /* OVERRIDE ALERT BANNER MAX-WIDTH FOR 1300PX CONTAINER */
        .alert-container-inner {
            max-width: 1300px !important;
        }

        /* Container with Max-Width 1300px */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 25px 25px 25px;
        }

        .box { 
            background: white; 
            padding: 25px 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }

        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        .badge-owner { background-color: #cce5ff; color: #004085; }

        .plan-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
        .btn-update { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; }
        .btn-submit { background-color: #007bff; width: 100%; padding: 10px; font-size: 14px; }

        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr; }
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Admin Global Navigation Bar Container -->
    <div id="admin-navbar-container"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Admin Tools (Owner Only Controls) -->
        <div class="grid-2">
            <!-- Create New Admin Section (Owner Only) -->
            <div class="box" id="createAdminBox" style="display:none; border-left: 5px solid #007bff;">
                <h3>➕ Create New Admin Account</h3>
                <form id="createAdminForm">
                    <div class="form-group">
                        <label>Admin Name:</label>
                        <input type="text" id="adminName" placeholder="Enter name" required>
                    </div>
                    <div class="form-group">
                        <label>Admin Email:</label>
                        <input type="email" id="adminEmail" placeholder="Enter email" required>
                    </div>
                    <div class="form-group">
                        <label>Admin Password:</label>
                        <input type="password" id="adminPassword" placeholder="Set password" required>
                    </div>
                    <button type="submit" class="btn-action btn-submit">Create Admin Account</button>
                </form>
            </div>

            <!-- Change Own Password Section -->
            <div class="box" style="border-left: 5px solid #ffc107;">
                <h3>🔐 Change Your Password</h3>
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label>Current Password:</label>
                        <input type="password" id="oldPassword" placeholder="Enter current password" required>
                    </div>
                    <div class="form-group">
                        <label>New Password:</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>
                    <button type="submit" class="btn-action btn-submit" style="background-color: #ffc107; color:#212529;">Update Password</button>
                </form>
            </div>
        </div>

        <!-- User Table Section -->
        <div class="box">
            <h3>👥 Registered Users & Subscription Plans</h3>
            <p style="color:#666; font-size:14px; margin-top: 5px;">Select a plan for any customer and click <b>Update Plan</b> to activate their subscription access.</p>
            
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>User Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Current Plan</th>
                        <th>Validity Expiry Date</th>
                        <th>Action (Set Plan)</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="9" style="text-align:center;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="global/global.js"></script>
    <script src="global/admin-global.js"></script>

    <script>
        const API_BASE = 'https://mosabber-quiz-app.onrender.com/api';
        const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
        const currentUser = JSON.parse(localStorage.getItem('user') || localStorage.getItem('quiz_user') || '{}');

        // Show Create Admin Box only to Owner
        if (currentUser.role === 'owner') {
            document.getElementById('createAdminBox').style.display = 'block';
        }

        async function loadUsers() {
            const tableBody = document.getElementById('userTableBody');
            try {
                const res = await fetch(`${API_BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (!data.success) {
                    tableBody.innerHTML = `<tr><td colspan="9" style="color:red; text-align:center;">${data.message || 'Failed to load users'}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                data.users.forEach((u, index) => {
                    const sub = u.subscription || {};
                    const isActive = sub.active && sub.endDate && new Date(sub.endDate) > new Date();
                    
                    const statusBadge = u.role === 'owner' || u.role === 'admin' 
                        ? `<span class="badge badge-owner">${u.role.toUpperCase()}</span>`
                        : (isActive 
                            ? `<span class="badge badge-active">Active</span>` 
                            : `<span class="badge badge-expired">Expired / Inactive</span>`);

                    const expiryDate = sub.endDate ? new Date(sub.endDate).toLocaleDateString() : 'N/A';

                    tableBody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><b>${u.name}</b></td>
                            <td>${u.email}</td>
                            <td><small>${u.role}</small></td>
                            <td>${statusBadge}</td>
                            <td><b>${sub.plan || 'none'}</b></td>
                            <td>${expiryDate}</td>
                            <td>
                                ${u.role === 'customer' ? `
                                    <select class="plan-select" id="plan-${u._id}">
                                        <option value="none" ${sub.plan === 'none' ? 'selected' : ''}>Cancel Plan</option>
                                        <option value="1_month" ${sub.plan === '1_month' ? 'selected' : ''}>1 Month</option>
                                        <option value="3_months" ${sub.plan === '3_months' ? 'selected' : ''}>3 Months</option>
                                        <option value="6_months" ${sub.plan === '6_months' ? 'selected' : ''}>6 Months</option>
                                        <option value="1_year" ${sub.plan === '1_year' ? 'selected' : ''}>1 Year</option>
                                        <option value="2_years" ${sub.plan === '2_years' ? 'selected' : ''}>2 Years</option>
                                    </select>
                                    <button class="btn-action btn-update" onclick="updateSubscription('${u._id}')">Save Plan</button>
                                ` : '<small style="color:#888;">Full Access</small>'}
                            </td>
                            <td>
                                ${currentUser.role === 'owner' && u.role !== 'owner' ? `
                                    <button class="btn-action btn-delete" onclick="deleteUser('${u._id}', '${u.name}')">🗑️ Delete</button>
                                ` : '<small style="color:#aaa;">N/A</small>'}
                            </td>
                        </tr>
                    `;
                });

            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="9" style="color:red; text-align:center;">Error fetching user list!</td></tr>`;
            }
        }

        async function updateSubscription(userId) {
            const selectedPlan = document.getElementById(`plan-${userId}`).value;
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/subscription`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ plan: selectedPlan })
                });

                const data = await res.json();
                if (data.success) {
                    showTopAlert(`✅ ${data.message}`, 'success');
                    loadUsers();
                } else {
                    showTopAlert(`❌ Failed: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert("❌ Error updating plan!", 'danger');
            }
        }

        async function deleteUser(userId, userName) {
            const confirmed = await showTopAlert(`Are you sure you want to delete user '${userName}'?`, 'danger', true);
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    showTopAlert(`✅ ${data.message}`, 'success');
                    loadUsers();
                } else {
                    showTopAlert(`❌ Delete failed: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert("❌ Error deleting user!", 'danger');
            }
        }

        // CREATE ADMIN SUBMIT
        document.getElementById('createAdminForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('adminName').value;
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await fetch(`${API_BASE}/users/create-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    showTopAlert(`🎉 ${data.message}`, 'success');
                    document.getElementById('createAdminForm').reset();
                    loadUsers();
                } else {
                    showTopAlert(`❌ Error: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert("❌ Error creating admin!", 'danger');
            }
        });

        // CHANGE PASSWORD SUBMIT
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const res = await fetch(`${API_BASE}/auth/change-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await res.json();
                if (data.success) {
                    showTopAlert(`✅ ${data.message}`, 'success');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    showTopAlert(`❌ Password change failed: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert("❌ Error changing password!", 'danger');
            }
        });

        // Custom Logout function
        async function logout() {
            const confirmed = await showTopAlert('আপনি কি নিশ্চিত যে লগআউট করতে চান?', 'warning', true);
            if (confirmed) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                localStorage.removeItem('quiz_token');
                localStorage.removeItem('quiz_user');
                window.location.replace('login.html');
            }
        }

        window.onload = loadUsers;
    </script>
</body>
</html>

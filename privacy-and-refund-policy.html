<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিফান্ড ও পেমেন্ট পলিসি - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- বাংলা ফন্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        :root {
            --font-main: 'Noto Sans Bengali', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #f8fafc; /* হালকা সুন্দর ব্যাকগ্রাউন্ড */
        }

        .page-banner {
            background: linear-gradient(135deg, var(--dark), #1e293b);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }
        .page-banner h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; font-family: var(--font-main); }
        .page-banner p { font-size: 16px; color: #cbd5e1; font-family: var(--font-main); }
        
        .content-container { max-width: 1300px; margin: 50px auto; padding: 0 20px; position: relative; z-index: 10; }
        
        /* সুন্দর এবং প্রিমিয়াম কার্ড ডিজাইন */
        .policy-card { 
            background: white; 
            border-radius: 12px; 
            padding: 45px 50px; /* চারদিকে পর্যাপ্ত ফাঁকা জায়গা */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* সফট শ্যাডো */
            border: 1px solid #e2e8f0; 
        }

        @media (max-width: 768px) {
            .policy-card { padding: 30px 20px; }
        }

        /* Quill-এর ডিফল্ট স্টাইল ওভাররাইড */
        #policy-content.ql-editor {
            padding: 0; /* কার্ডের ভেতরে অতিরিক্ত প্যাডিং জিরো করা হলো */
            overflow: visible;
            height: auto;
            cursor: default;
            font-family: var(--font-main) !important;
            font-size: 16px;
            line-height: 1.85;
            color: #334155; /* আরামদায়ক ডার্ক-গ্রে কালার */
        }
        
        /* হেডিং স্টাইল */
        #policy-content h1, #policy-content h2, #policy-content h3 { 
            color: #0f172a; 
            font-weight: 700;
            margin-top: 35px; /* উপরে সুন্দর ফাঁকা জায়গা */
            margin-bottom: 15px; 
            border-bottom: 1px solid #e2e8f0; /* হালকা বর্ডার */
            padding-bottom: 10px; 
            font-family: var(--font-main);
        }
        #policy-content h1:first-child, #policy-content h2:first-child, #policy-content h3:first-child {
            margin-top: 0;
        }

        /* প্যারাগ্রাফ এবং লিস্ট স্টাইল */
        #policy-content p { 
            margin-top: 0; 
            margin-bottom: 18px; 
        }
        
        /* Enter দিলে ফাঁকা জায়গার কন্ট্রোল */
        #policy-content p:has(br:only-child), #policy-content p:empty { 
            display: block; 
            min-height: 16px;
            margin-bottom: 5px;
        }
        
        #policy-content ul, #policy-content ol { 
            padding-left: 25px; 
            margin-top: 0;
            margin-bottom: 18px;
        }
        #policy-content li { 
            margin-bottom: 8px; 
            padding-left: 5px;
        }

        /* লিংক স্টাইলিং */
        #policy-content a {
            color: var(--primary, #007bff);
            text-decoration: underline;
            word-break: break-word;
            font-weight: 500;
        }
        #policy-content a:hover {
            color: var(--primary-dark, #0056b3);
        }
    </style>
</head>
<body>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <div class="page-banner">
        <h1>রিফান্ড ও পেমেন্ট পলিসি</h1>
        <p>TopMCQ প্ল্যাটফর্ম ব্যবহারের পূর্বে আমাদের পেমেন্ট ও রিফান্ড সংক্রান্ত নিয়মাবলী জেনে নিন</p>
    </div>

    <div class="content-container">
        <!-- এখানে div দুটোকে আলাদা করা হয়েছে যেন কার্ডের প্যাডিং ঠিক থাকে -->
        <div class="policy-card">
            <div id="policy-content" class="ql-editor">
                <p style="text-align: center; color: #94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> পলিসি লোড হচ্ছে...</p>
            </div>
        </div>
    </div>

    <!-- DYNAMIC FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINKS -->
    <script src="config.js"></script>
    <script src="global/global.js"></script>

    <!-- Fetch Policy Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Pages Server (topmcqbdpages.onrender.com) API Link
                const API_BASE = CONFIG.PAGES_API;
                const response = await fetch(`${API_BASE}/policy/get`);
                
                if (response.ok) {
                    const data = await response.json();
                    const policyContainer = document.getElementById('policy-content');
                    
                    if(data && data.content) {
                        policyContainer.innerHTML = data.content;
                    } else {
                        policyContainer.innerHTML = '<p style="text-align: center;">এখনও কোনো পলিসি যুক্ত করা হয়নি।</p>';
                    }
                } else {
                    throw new Error('Failed to fetch data from the server.');
                }
            } catch (error) {
                console.error('Error fetching policy:', error);
                document.getElementById('policy-content').innerHTML = '<p style="text-align: center; color: var(--danger);">পলিসি লোড করতে সমস্যা হয়েছে। দয়া করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>';
            }
        });
    </script>
</body>
</html>

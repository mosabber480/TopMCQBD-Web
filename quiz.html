<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz - Practice</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        :root {
            --quiz-primary: #007bff;
            --quiz-primary-dark: #0056b3;
            --quiz-dark: #2c3e50;
            --quiz-light: #f8f9fa;
            --quiz-gray: #6c757d;
            --quiz-success: #28a745;
            --quiz-danger: #dc3545;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* ALL MCQ ELEMENTS WRAPPED INSIDE THIS SINGLE SECTION */
        .quiz-section-wrapper {
            position: relative;
            width: 100%;
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Quiz Main Container - MATCHES EXACT 1300PX ALIGNMENT WITH HEADER */
        .quiz-container {
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        .quiz-container h1, .quiz-container h2 { text-align: center; color: #2c3e50; margin-top: 10px; margin-bottom: 5px; }

        .quiz-btn-reset {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .quiz-btn-reset:hover { background-color: #27ae60; }

        /* Floating Status Bar */
        .quiz-floating-status-bar {
            position: fixed;
            top: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            z-index: 999;
        }

        .quiz-timer-board {
            background: #e74c3c;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            min-width: 90px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .quiz-score-board {
            background: #2ecc71;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            min-width: 90px;
            text-align: center;
        }

        .quiz-header-info-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .quiz-exam-path { color: #7f8c8d; font-size: 14px; font-weight: 500; text-align: left; }
        .quiz-negative-mark-note { color: #e74c3c; font-size: 13px; font-weight: 600; text-align: right; }

        /* Controls Bar */
        .quiz-controls-bar {
            display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 20px;
            background: #f8f9fa; padding: 8px 15px; border-radius: 6px; border: 1px solid #e9ecef; flex-wrap: wrap; gap: 12px;
        }
        .quiz-nav-actions { display: flex; align-items: center; gap: 10px; }
        .quiz-right-controls-group { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .quiz-filter-group { display: flex; align-items: center; gap: 6px; }
        .quiz-select-dropdown { padding: 5px 8px; border-radius: 4px; border: 1px solid #ced4da; font-size: 13px; font-weight: 600; color: #2c3e50; background-color: #fff; cursor: pointer; outline: none; }
        .quiz-select-dropdown:focus { border-color: #007bff; }

        .quiz-switch-group { display: flex; align-items: center; gap: 12px; }
        .quiz-switch-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #2c3e50; cursor: pointer; user-select: none; }
        .quiz-switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .quiz-switch input { opacity: 0; width: 0; height: 0; }
        .quiz-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 20px; }
        .quiz-slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .quiz-slider { background-color: #007bff; }
        input:checked + .quiz-slider:before { transform: translateX(16px); }

        .quiz-color-dots-icon { display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; }
        .quiz-dot-red { width: 9px; height: 9px; background-color: #e74c3c; border-radius: 50%; }
        .quiz-dot-green { width: 9px; height: 9px; background-color: #2ecc71; border-radius: 50%; }

        /* Popup Notification */
        .quiz-corner-popup { position: fixed; bottom: 25px; right: 25px; background: #ffffff; color: #2c3e50; padding: 16px 20px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border-left: 5px solid #007bff; z-index: 2000; display: none; max-width: 340px; animation: quizSlideInRight 0.3s ease-out; }
        .quiz-corner-popup.warning { border-left-color: #f39c12; }
        .quiz-corner-popup.danger { border-left-color: #e74c3c; }
        .quiz-corner-popup.success { border-left-color: #2ecc71; }
        .quiz-corner-popup h4 { margin: 0 0 8px 0; font-size: 16px; color: #2c3e50; display: flex; align-items: center; gap: 8px; }
        .quiz-corner-popup p { margin: 0 0 12px 0; font-size: 13.5px; color: #555; line-height: 1.6; }
        
        #popup-action { display: flex; gap: 8px; flex-wrap: wrap; }
        .quiz-popup-btn { background-color: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; transition: background 0.2s ease; margin-top: 5px; display: inline-flex; align-items: center; gap: 6px; }
        .quiz-popup-btn:hover { background-color: #0056b3; }
        
        /* Green Background for "ঠিক আছে" (Okay) Button */
        .quiz-popup-close-btn { background-color: #28a745 !important; }
        .quiz-popup-close-btn:hover { background-color: #218838 !important; }

        @keyframes quizSlideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Question & Option Styles */
        .quiz-question-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #ccc; }
        .quiz-question-text { font-size: 17px; font-weight: 600; margin-bottom: 15px; color: #2c3e50; text-align: left; }
        .quiz-options-container { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 12px 20px; }
        .quiz-option-btn { background: #f8f9fa; border: 1px solid #ced4da; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 15px; text-align: left; transition: all 0.2s ease; font-weight: normal; }
        .quiz-option-btn:hover:not(.disabled) { background: #e2e6ea; border-color: #dae0e5; }
        .quiz-option-btn.disabled { cursor: not-allowed; }

        .correct { background-color: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .incorrect { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }
        .neutral-selected { background-color: #ecf7fa !important; color: #000000 !important; border-color: #222 !important; font-weight: normal !important; }

        .quiz-answer-text { font-weight: bold; color: #27ae60; margin-top: 10px; display: none; text-align: left; }
        .quiz-explanation-text { font-size: 14px; color: #555; margin-top: 5px; display: none; background: #f9f9f9; padding: 8px 12px; border-left: 3px solid #17a2b8; border-radius: 4px; }
        .quiz-result-section { text-align: center; margin-top: 40px; padding: 20px; background: #ecf0f1; border-radius: 8px; }
        .quiz-detailed-stats { font-size: 14px; margin-bottom: 12px; color: #555; }
        .quiz-correct-count { color: #2ecc71; font-weight: bold; }
        .quiz-incorrect-count { color: #e74c3c; font-weight: bold; }
        #final-score { font-size: 24px; color: #2c3e50; font-weight: bold; border-top: 2px solid #bdc3c7; padding-top: 10px; display: inline-block; }

        @media (max-width: 768px) {
            .quiz-section-wrapper { margin: 15px auto; padding: 0 10px; }
            .quiz-container { padding: 15px; }
            .quiz-floating-status-bar { top: 80px; right: 10px; gap: 6px; }
            .quiz-timer-board, .quiz-score-board { padding: 6px 12px; font-size: 14px; min-width: 80px; }
            .quiz-header-info-bar { flex-direction: column; align-items: flex-start; gap: 5px; }
            .quiz-negative-mark-note { text-align: left; }
            .quiz-controls-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
            .quiz-nav-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .quiz-right-controls-group { width: 100%; flex-direction: column; align-items: flex-start; gap: 10px; }
            .quiz-filter-group { width: 100%; }
            .quiz-switch-group { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; }
            .quiz-options-container { flex-direction: column; gap: 10px; }
            .quiz-option-btn { width: 100%; box-sizing: border-box; padding: 12px 15px; }
            .quiz-corner-popup { bottom: 15px; right: 15px; left: 15px; max-width: none; }
        }
    </style>
</head>
<body>

    <!-- DYNAMIC GLOBAL LAYOUT CONTAINERS -->
    <div id="global-announce-bar" style="display:none;"></div>
    <header id="global-header"></header>

    <!-- SINGLE SECTION WRAPPER CONTAINING ALL QUIZ ELEMENTS -->
    <section class="quiz-section-wrapper">

        <!-- Floating Status Container (Timer & Score) -->
        <div class="quiz-floating-status-bar">
            <div class="quiz-timer-board" id="timer-board-box"><span id="timer-display">00:00</span></div>
            <div class="quiz-score-board">স্কোর: <span id="live-score">0</span></div>
        </div>

        <!-- Bottom Right Corner Toast Popup -->
        <div id="corner-popup" class="quiz-corner-popup">
            <h4 id="popup-title">বিজ্ঞপ্তি</h4>
            <p id="popup-msg"></p>
            <div id="popup-action"></div>
        </div>

        <div class="quiz-container">
            <h1 id="main-title">Dynamic Quiz Practice</h1>
            <h2 id="topic-title">টপিক লোড হচ্ছে...</h2>
            
            <div class="quiz-header-info-bar">
                <div id="category-path" class="quiz-exam-path"></div>
                <div class="quiz-negative-mark-note">[ প্রতিটি ভুল উত্তরের জন্য ০.৫ নম্বর কাটা যাবে ]</div>
            </div>
            
            <hr style="margin-top: 8px; border: 0; border-top: 1px solid #ccc;">

            <div class="quiz-controls-bar">
                <div class="quiz-nav-actions">
                    <button class="quiz-btn-reset" onclick="resetQuiz()">🔄 পুনরায় শুরু করুন</button>
                </div>

                <div class="quiz-right-controls-group">
                    <div class="quiz-filter-group">
                        <select id="range-select" class="quiz-select-dropdown" onchange="renderQuizUI()">
                            <option value="all">সকল প্রশ্ন</option>
                        </select>
                        
                        <select id="limit-select" class="quiz-select-dropdown" onchange="updateRangeOptions()">
                            <option value="all">সকল প্রশ্ন</option>
                            <option value="20">20</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>

                    <!-- Toggle Switches (Color, Correct Ans, Explanation, Time) -->
                    <div class="quiz-switch-group">
                        <label class="quiz-switch-label">
                            <label class="quiz-switch">
                                <input type="checkbox" id="toggle-color" checked>
                                <span class="quiz-slider"></span>
                            </label>
                            <span class="quiz-color-dots-icon">
                                <span class="quiz-dot-red"></span>
                                <span class="quiz-dot-green"></span>
                            </span>
                        </label>

                        <label class="quiz-switch-label">
                            <label class="quiz-switch">
                                <input type="checkbox" id="toggle-answer">
                                <span class="quiz-slider"></span>
                            </label>
                            সঠিক উত্তর
                        </label>

                        <label class="quiz-switch-label">
                            <label class="quiz-switch">
                                <input type="checkbox" id="toggle-explanation" checked>
                                <span class="quiz-slider"></span>
                            </label>
                            ব্যাখ্যা
                        </label>

                        <label class="quiz-switch-label">
                            <label class="quiz-switch">
                                <input type="checkbox" id="toggle-time">
                                <span class="quiz-slider"></span>
                            </label>
                            সময়
                        </label>
                    </div>
                </div>
            </div>

            <div id="quiz-wrapper">
                <p style="text-align:center; color:#888;"><i class="fa-solid fa-spinner fa-spin"></i> ডাটাবেজ থেকে কুইজের প্রশ্ন লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
            </div>

            <div class="quiz-result-section">
                <h2>পরীক্ষার ফলাফল</h2>
                <div class="quiz-detailed-stats">
                    সঠিক উত্তর: <span id="correct-count-display" class="quiz-correct-count">০</span> টি &nbsp;&nbsp;|&nbsp;&nbsp; ভুল উত্তর: <span id="incorrect-count-display" class="quiz-incorrect-count">০</span> টি
                </div>
                <div id="final-score">আপনার মোট প্রাপ্ত স্কোর: ০</div>
            </div>
        </div>

    </section>

    <!-- DYNAMIC FOOTER CONTAINER -->
    <footer id="global-footer"></footer>

    <!-- GLOBAL JS LINK (Handles Header, Footer, Mobile Nav and Announce Bar) -->
    <script src="global/global.js"></script>

    <!-- QUIZ ENGINE SCRIPT -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category');

        const API_BASE = 'https://mosabber-quiz-app.onrender.com/api';
        const API_URL = currentCategory 
            ? `${API_BASE}/questions?category=${encodeURIComponent(currentCategory)}`
            : null;

        let quizData = []; 
        let displayQuestions = [];
        let answeredQuestions = {}; 
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;

        let timerInterval = null;
        let initialTotalSeconds = 0;
        let totalSecondsLeft = 0;
        let warningTriggered = false;

        const quizWrapper = document.getElementById('quiz-wrapper');
        const liveScoreDisplay = document.getElementById('live-score');
        const timerDisplay = document.getElementById('timer-display');
        const timerBoardBox = document.getElementById('timer-board-box');
        const correctCountDisplay = document.getElementById('correct-count-display');
        const incorrectCountDisplay = document.getElementById('incorrect-count-display');
        const finalScoreDisplay = document.getElementById('final-score');

        const toggleColor = document.getElementById('toggle-color');
        const toggleAnswer = document.getElementById('toggle-answer');
        const toggleExplanation = document.getElementById('toggle-explanation');
        const toggleTime = document.getElementById('toggle-time');
        const limitSelect = document.getElementById('limit-select');
        const rangeSelect = document.getElementById('range-select');

        const cornerPopup = document.getElementById('corner-popup');
        const popupTitle = document.getElementById('popup-title');
        const popupMsg = document.getElementById('popup-msg');
        const popupAction = document.getElementById('popup-action');

        function getBanglaLetter(index) {
            const letters = ['ক', 'খ', 'গ', 'ঘ'];
            return letters[index] || index;
        }

        toggleAnswer.addEventListener('change', updateVisibility);
        toggleExplanation.addEventListener('change', updateVisibility);
        toggleColor.addEventListener('change', updateOptionColors);

        toggleTime.addEventListener('change', () => {
            resetQuiz();
        });

        // Authentication and Subscription Access Guard
        async function initQuizAccess() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userObj = JSON.parse(localStorage.getItem('user') || localStorage.getItem('quiz_user') || '{}');
                const isSystemStaff = userObj.role === 'owner' || userObj.role === 'admin';
                const sub = userObj.subscription || {};
                const isSubscribedCustomer = sub.active && sub.endDate && new Date(sub.endDate) > new Date();

                if (!isSystemStaff && !isSubscribedCustomer) {
                    quizWrapper.innerHTML = `
                        <div style="text-align:center; padding: 40px 20px;">
                            <i class="fa-solid fa-lock fa-3x" style="color: #dc3545; margin-bottom: 15px;"></i>
                            <h2 style="color:#2c3e50; margin-bottom:10px;">সাবস্ক্রিপশন প্রয়োজন!</h2>
                            <p style="color:#666; margin-bottom: 20px;">কুইজে অংশ নিতে অ্যাক্টিভ সাবস্ক্রিপশন প্ল্যান প্রয়োজন।</p>
                            <a href="profile.html" style="text-decoration:none; background-color:#007bff; color:white; padding:8px 16px; border-radius:6px; display:inline-block;">প্রোফাইল থেকে প্ল্যান নিশ্চিত করুন</a>
                        </div>
                    `;
                    return;
                }

                fetchQuestionsFromDB();

            } catch (err) {
                fetchQuestionsFromDB();
            }
        }

        function updateVisibility() {
            Object.keys(answeredQuestions).forEach(qIndex => {
                const ansElem = document.getElementById(`ans-text-${qIndex}`);
                if (ansElem) {
                    ansElem.style.display = toggleAnswer.checked ? 'block' : 'none';
                }

                const expElem = document.getElementById(`exp-text-${qIndex}`);
                if (expElem) {
                    expElem.style.display = toggleExplanation.checked ? 'block' : 'none';
                }
            });
        }

        function updateOptionColors() {
            Object.keys(answeredQuestions).forEach(qIndex => {
                const selectedIndex = answeredQuestions[qIndex];
                const currentQuestion = quizData[qIndex];
                const qBlock = document.getElementById(`q-block-${qIndex}`);

                if (!qBlock || !currentQuestion) return;

                const correctAnsIdx = typeof currentQuestion.ans !== 'undefined' ? currentQuestion.ans : currentQuestion.correctAnswer;
                const allButtons = qBlock.querySelectorAll('.quiz-option-btn');
                const selectedBtn = allButtons[selectedIndex];
                const correctBtn = allButtons[correctAnsIdx];

                allButtons.forEach(btn => {
                    btn.classList.remove('correct', 'incorrect', 'neutral-selected');
                });

                if (toggleColor.checked) {
                    if (selectedIndex === correctAnsIdx) {
                        if (selectedBtn) selectedBtn.classList.add('correct');
                    } else {
                        if (selectedBtn) selectedBtn.classList.add('incorrect');
                        if (correctBtn) correctBtn.classList.add('correct');
                    }
                } else {
                    if (selectedBtn) selectedBtn.classList.add('neutral-selected');
                }
            });
        }

        async function fetchQuestionsFromDB() {
            const topicTitle = document.getElementById('topic-title');
            const categoryPath = document.getElementById('category-path');

            if (!currentCategory) {
                topicTitle.innerText = "কোনো ক্যাটাগরি সিলেক্ট করা হয়নি!";
                quizWrapper.innerHTML = "<p style='text-align:center; color:red;'>অনুগ্রহ করে একটি টপিক নির্বাচন করুন।</p>";
                return;
            }

            // Parse Category Path levels (Main Category > Sub-Category > Topic)
            const parts = currentCategory.split('/').map(p => p.trim()).filter(Boolean);
            const mainCat = parts[0] || '';
            const subCat = parts[1] || '';
            const topic = parts[2] || '';

            let pathDisplay = `📁 ${mainCat}`;
            let currentTopicName = mainCat;

            if (subCat) {
                pathDisplay += ` &gt; ${subCat}`;
                currentTopicName = subCat;
            }
            if (topic) {
                pathDisplay += ` &gt; ${topic}`;
                currentTopicName = topic;
            }

            topicTitle.innerText = `টপিক: ${currentTopicName.replace(/-/g, ' ')}`;
            categoryPath.innerHTML = pathDisplay;

            try {
                const token = localStorage.getItem('token') || localStorage.getItem('quiz_token') || '';
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const res = await fetch(API_URL, { method: 'GET', headers: headers });
                const data = await res.json();

                let rawList = [];
                if (Array.isArray(data)) {
                    rawList = data;
                } else if (data.mcqs && Array.isArray(data.mcqs)) {
                    rawList = data.mcqs;
                } else if (data.questions && Array.isArray(data.questions)) {
                    rawList = data.questions;
                }

                if (!res.ok || !Array.isArray(rawList)) {
                    throw new Error(data.message || "Failed to load questions");
                }

                quizData = rawList;

                if (quizData.length === 0) {
                    quizWrapper.innerHTML = `<p style="text-align:center; color:#888;"><b>${currentTopicName}</b>-এর অধীনে কোনো প্রশ্ন পাওয়া যায়নি। ড্যাশবোর্ড থেকে প্রশ্ন যোগ করুন!</p>`;
                    return;
                }

                updateRangeOptions();
            } catch (err) {
                console.error("Fetch error:", err);
                quizWrapper.innerHTML = `<p style='text-align:center; color:red;'>সার্ভার/ডাটাবেজ থেকে প্রশ্ন লোড করতে ব্যর্থ হয়েছে!</p>`;
            }
        }

        function updateRangeOptions() {
            const limitValue = limitSelect.value;
            rangeSelect.innerHTML = "";

            if (limitValue === 'all' || !Array.isArray(quizData) || quizData.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'all';
                opt.innerText = (Array.isArray(quizData) && quizData.length > 0) ? `1-${quizData.length}` : `সকল প্রশ্ন`;
                rangeSelect.appendChild(opt);
            } else {
                const chunkSize = parseInt(limitValue);
                const totalQuestions = quizData.length;

                for (let start = 0; start < totalQuestions; start += chunkSize) {
                    let end = Math.min(start + chunkSize, totalQuestions);
                    const opt = document.createElement('option');
                    opt.value = `${start}-${end}`;
                    opt.innerText = `${start + 1}-${end}`;
                    rangeSelect.appendChild(opt);
                }
            }

            renderQuizUI();
        }

        function renderQuizUI() {
            quizWrapper.innerHTML = "";
            hidePopup();
            
            if (!Array.isArray(quizData) || quizData.length === 0) {
                return;
            }

            let startIndexOffset = 0;

            const selectedRange = rangeSelect.value;

            if (selectedRange === 'all') {
                displayQuestions = quizData;
                startIndexOffset = 0;
            } else {
                const [start, end] = selectedRange.split('-').map(Number);
                displayQuestions = quizData.slice(start, end);
                startIndexOffset = start;
            }

            if (toggleTime.checked) {
                timerBoardBox.style.display = "block";
                startTimer(displayQuestions.length);
            } else {
                timerBoardBox.style.display = "none";
                if (timerInterval) clearInterval(timerInterval);
            }

            displayQuestions.forEach((item, relativeIndex) => {
                const actualIndex = startIndexOffset + relativeIndex;

                const qBlock = document.createElement('div');
                qBlock.className = 'quiz-question-block';
                qBlock.id = `q-block-${actualIndex}`;

                const qText = document.createElement('div');
                qText.className = 'quiz-question-text';
                qText.innerText = `${actualIndex + 1}. ${item.q || item.question}`;
                qBlock.appendChild(qText);

                const optContainer = document.createElement('div');
                optContainer.className = 'quiz-options-container';

                const options = item.options || [];
                options.forEach((opt, oIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option-btn';
                    btn.innerText = `(${getBanglaLetter(oIndex)}) ${opt}`;
                    
                    if (answeredQuestions[actualIndex] !== undefined) {
                        btn.classList.add('disabled');
                    } else {
                        btn.onclick = () => handleAnswer(btn, actualIndex, oIndex, optContainer);
                    }

                    optContainer.appendChild(btn);
                });

                qBlock.appendChild(optContainer);

                const correctAnsIdx = typeof item.ans !== 'undefined' ? item.ans : item.correctAnswer;
                const ansText = document.createElement('div');
                ansText.className = 'quiz-answer-text';
                ansText.id = `ans-text-${actualIndex}`;
                ansText.innerText = `সঠিক উত্তর: (${getBanglaLetter(correctAnsIdx)}) ${options[correctAnsIdx] || ''}`;
                qBlock.appendChild(ansText);

                if (item.explanation && item.explanation.trim() !== '') {
                    const expText = document.createElement('div');
                    expText.className = 'quiz-explanation-text';
                    expText.id = `exp-text-${actualIndex}`;
                    expText.innerText = `ব্যাখ্যা: ${item.explanation}`;
                    qBlock.appendChild(expText);
                }

                quizWrapper.appendChild(qBlock);
            });

            updateVisibility();
            updateOptionColors();
        }

        function startTimer(questionCount) {
            if (timerInterval) clearInterval(timerInterval);

            initialTotalSeconds = questionCount * 36;
            totalSecondsLeft = initialTotalSeconds;
            warningTriggered = false;

            updateTimerDisplay();

            const warningThreshold = Math.floor(initialTotalSeconds * 0.10);

            timerInterval = setInterval(() => {
                if (!toggleTime.checked) {
                    clearInterval(timerInterval);
                    return;
                }

                if (totalSecondsLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "00:00";
                    handleTimeOut();
                } else {
                    totalSecondsLeft--;
                    updateTimerDisplay();

                    if (warningThreshold > 0 && totalSecondsLeft <= warningThreshold && !warningTriggered) {
                        warningTriggered = true;
                        show10PercentWarningPopup();
                    }
                }
            }, 1000);
        }

        function formatTime(totalSec) {
            const minutes = Math.floor(totalSec / 60);
            const seconds = totalSec % 60;
            const formattedMinutes = minutes < 10 ? `0${minutes}` : minutes;
            const formattedSeconds = seconds < 10 ? `0${seconds}` : seconds;
            return { formattedMinutes, formattedSeconds, minutes, seconds };
        }

        function updateTimerDisplay() {
            const { formattedMinutes, formattedSeconds } = formatTime(totalSecondsLeft);
            timerDisplay.innerText = `${formattedMinutes}:${formattedSeconds}`;
        }

        function show10PercentWarningPopup() {
            if (!toggleTime.checked) return;

            const { minutes, seconds } = formatTime(totalSecondsLeft);
            let timeStr = "";
            if (minutes > 0) timeStr += `${minutes} মিনিট `;
            if (seconds > 0) timeStr += `${seconds} সেকেন্ড`;

            cornerPopup.className = "quiz-corner-popup warning";
            popupTitle.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#f39c12;"></i> সময় প্রায় শেষ!`;
            popupMsg.innerText = `আর মাত্র ${timeStr} বাকি আছে। দ্রুত উত্তর দিন!`;
            popupAction.innerHTML = `<button class="quiz-popup-btn quiz-popup-close-btn" onclick="hidePopup()">ঠিক আছে</button>`;
            cornerPopup.style.display = "block";
        }

        function handleTimeOut() {
            if (!toggleTime.checked) return;

            disableAllButtonsOnTimeOut();

            // Calculate Percentage of correct answers
            const totalCount = displayQuestions.length || 1;
            const percentage = ((correctCount / totalCount) * 100).toFixed(0);

            cornerPopup.className = "quiz-corner-popup danger";
            popupTitle.innerHTML = `<i class="fa-solid fa-clock" style="color:#e74c3c;"></i> সময় শেষ!`;
            popupMsg.innerHTML = `
                <b>সঠিক উত্তর:</b> ${correctCount} টি &nbsp;|&nbsp; <b>ভুল উত্তর:</b> ${incorrectCount} টি <br>
                <b>সঠিক উত্তরের হার:</b> ${percentage}% <br>
                <b>প্রাপ্ত মোট স্কোর:</b> ${score}
            `;
            popupAction.innerHTML = `
                <button class="quiz-popup-btn" onclick="resetQuiz()"><i class="fa-solid fa-rotate-right"></i> পুনরায় শুরু করুন</button>
                <button class="quiz-popup-btn quiz-popup-close-btn" onclick="hidePopup()">ঠিক আছে</button>
            `;
            cornerPopup.style.display = "block";
        }

        // Popup for Quiz Completion (When all loaded questions are answered)
        function showCompletionPopup() {
            if (timerInterval) clearInterval(timerInterval);

            // Calculate Percentage of correct answers
            const totalCount = displayQuestions.length || 1;
            const percentage = ((correctCount / totalCount) * 100).toFixed(0);

            cornerPopup.className = "quiz-corner-popup success";
            popupTitle.innerHTML = `<i class="fa-solid fa-trophy" style="color: #f1c40f;"></i> অভিনন্দন! পরীক্ষা সম্পন্ন হয়েছে`;
            popupMsg.innerHTML = `
                <b>সঠিক উত্তর:</b> ${correctCount} টি &nbsp;|&nbsp; <b>ভুল উত্তর:</b> ${incorrectCount} টি <br>
                <b>সঠিক উত্তরের হার:</b> ${percentage}% <br>
                <b>প্রাপ্ত মোট স্কোর:</b> ${score}
            `;
            popupAction.innerHTML = `
                <button class="quiz-popup-btn" onclick="resetQuiz()"><i class="fa-solid fa-rotate-right"></i> পুনরায় শুরু করুন</button>
                <button class="quiz-popup-btn quiz-popup-close-btn" onclick="hidePopup()">ঠিক আছে</button>
            `;
            cornerPopup.style.display = "block";
        }

        function hidePopup() {
            cornerPopup.style.display = "none";
        }

        function disableAllButtonsOnTimeOut() {
            const allOptionBtns = document.querySelectorAll('.quiz-option-btn');
            allOptionBtns.forEach(btn => {
                btn.classList.add('disabled');
                btn.onclick = null;
            });
        }

        function handleAnswer(selectedBtn, qIndex, selectedIndex, optContainer) {
            if (toggleTime.checked && totalSecondsLeft <= 0) return;

            const currentQuestion = quizData[qIndex];
            const correctAnsIdx = typeof currentQuestion.ans !== 'undefined' ? currentQuestion.ans : currentQuestion.correctAnswer;
            const allButtons = optContainer.querySelectorAll('.quiz-option-btn');
            
            allButtons.forEach(btn => {
                btn.classList.add('disabled');
                btn.onclick = null;
            });

            answeredQuestions[qIndex] = selectedIndex;

            updateOptionColors();

            if (selectedIndex === correctAnsIdx) {
                score += 1;
                correctCount += 1;
            } else {
                score -= 0.5;
                incorrectCount += 1;
            }

            liveScoreDisplay.innerText = score;
            correctCountDisplay.innerText = correctCount;
            incorrectCountDisplay.innerText = incorrectCount;
            finalScoreDisplay.innerText = `আপনার মোট প্রাপ্ত স্কোর: ${score}`;

            updateVisibility();

            // Check if user answered ALL questions loaded on screen
            if (Object.keys(answeredQuestions).length === displayQuestions.length) {
                showCompletionPopup();
            }
        }

        function resetQuiz() {
            score = 0;
            correctCount = 0;
            incorrectCount = 0;
            answeredQuestions = {};

            liveScoreDisplay.innerText = 0;
            correctCountDisplay.innerText = 0;
            incorrectCountDisplay.innerText = 0;
            finalScoreDisplay.innerText = 'আপনার মোট প্রাপ্ত স্কোর: ০';

            hidePopup();
            renderQuizUI();
        }

        window.onload = initQuizAccess;
    </script>

</body>
</html>

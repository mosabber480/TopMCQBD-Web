<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Quiz Practice - TopMCQ</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="global/global.css">
    
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f7f6;
        }

        .main-content {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .quiz-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .sub-badge {
            background-color: #d4edda;
            color: #155724;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #cbd5e1;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
            font-weight: bold;
        }

        .quiz-footer {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { background-color: #0056b3; }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .score-box {
            text-align: center;
            padding: 20px;
        }
        .score-box h2 { color: var(--primary); font-size: 28px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <header id="global-header"></header>

        <main class="main-content">
            <div class="quiz-card" id="quizContainer">
                <div class="loading-spinner">
                    <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 15px;">অ্যাক্সেস এবং কুইজ তথ্য লোড হচ্ছে...</p>
                </div>
            </div>
        </main>

        <footer id="global-footer"></footer>
    </div>

    <script src="global/global.js"></script>

    <script>
        const API_BASE = 'https://mosabber-quiz-app.onrender.com/api';
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        // 1. Check Authentication & System Roles/Subscription Access
        async function initQuizAccess() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            const quizContainer = document.getElementById('quizContainer');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // LocalStorage check for fallback fast rendering
                const userObj = JSON.parse(localStorage.getItem('user') || localStorage.getItem('quiz_user') || '{}');
                const isSystemStaff = userObj.role === 'owner' || userObj.role === 'admin';
                const sub = userObj.subscription || {};
                const isSubscribedCustomer = sub.active && sub.endDate && new Date(sub.endDate) > new Date();

                if (!isSystemStaff && !isSubscribedCustomer) {
                    quizContainer.innerHTML = `
                        <div style="text-align:center; padding: 20px;">
                            <i class="fa-solid fa-lock fa-3x" style="color: #dc3545; margin-bottom: 15px;"></i>
                            <h2 style="color:#2c3e50;">সাবস্ক্রিপশন প্রয়োজন!</h2>
                            <p style="color:#666; margin: 10px 0 20px;">কুইজে অংশ নিতে অ্যাক্টিভ সাবস্ক্রিপশন প্ল্যান প্রয়োজন।</p>
                            <a href="profile.html" class="btn" style="text-decoration:none;">প্রোফাইল থেকে প্ল্যান নিশ্চিত করুন</a>
                        </div>
                    `;
                    return;
                }

                // System Staff or Subscribed Customer -> Load Quiz Questions
                loadQuizQuestions();

            } catch (err) {
                loadQuizQuestions();
            }
        }

        // 2. Load MCQ Questions based on Category URL
        async function loadQuizQuestions() {
            const quizContainer = document.getElementById('quizContainer');
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');

            // URL থেকে ক্যাটাগরি ফিল্টার নেওয়া (যেমন: quiz.html?category=subjective/Zoology)
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('category') || '';

            try {
                // Correct Backend API endpoint alignment
                let endpoint = `${API_BASE}/questions`;
                if (category) {
                    endpoint += `?category=${encodeURIComponent(category)}`;
                }

                const res = await fetch(endpoint, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                let rawList = [];
                if (Array.isArray(data)) {
                    rawList = data;
                } else if (data.mcqs && Array.isArray(data.mcqs)) {
                    rawList = data.mcqs;
                } else if (data.questions && Array.isArray(data.questions)) {
                    rawList = data.questions;
                }

                if (res.ok && rawList.length > 0) {
                    currentQuestions = rawList.map(q => ({
                        question: q.q || q.question,
                        options: q.options || [],
                        correctAnswer: typeof q.ans !== 'undefined' ? q.ans : q.correctAnswer,
                        explanation: q.explanation || ''
                    }));
                    renderQuestion();
                } else {
                    quizContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#666;">
                        <i class="fa-solid fa-folder-open fa-2x" style="margin-bottom:10px; color:#ffc107;"></i>
                        <h3>কোনো প্রশ্ন পাওয়া যায়নি!</h3>
                        <p>এই ক্যাটাগরিতে এখনো কোনো কুইজ যুক্ত করা হয়নি।</p>
                    </div>`;
                }

            } catch (err) {
                quizContainer.innerHTML = `<p style="color:red; text-align:center;">প্রশ্ন লোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।</p>`;
            }
        }

        // 3. Render Question UI
        function renderQuestion() {
            const quizContainer = document.getElementById('quizContainer');
            
            if (currentIndex >= currentQuestions.length) {
                renderScore();
                return;
            }

            const q = currentQuestions[currentIndex];

            quizContainer.innerHTML = `
                <div class="quiz-header">
                    <span class="quiz-title"><i class="fa-solid fa-pen-to-square"></i> MCQ Practice</span>
                    <span class="sub-badge"><i class="fa-solid fa-circle-check"></i> Full Access Active</span>
                </div>

                <div class="question-box">
                    <div class="question-text">
                        <b>প্রশ্ন ${currentIndex + 1}/${currentQuestions.length}:</b> ${q.question}
                    </div>
                    <div class="options-grid" id="optionsContainer">
                        ${q.options.map((opt, idx) => `
                            <button class="option-btn" onclick="selectOption(${idx}, ${q.correctAnswer})">
                                <i class="fa-regular fa-circle"></i> ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <div class="quiz-footer">
                    <span>স্কোর: <b>${score}</b></span>
                    <button class="btn" id="nextBtn" style="display:none;" onclick="nextQuestion()">পরবর্তী প্রশ্ন <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            `;
        }

        // 4. Option Selection Logic
        function selectOption(selectedIndex, correctIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                buttons[selectedIndex].classList.add('correct');
                buttons[selectedIndex].querySelector('i').className = 'fa-solid fa-circle-check';
                score++;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[selectedIndex].querySelector('i').className = 'fa-solid fa-circle-xmark';
                
                if(buttons[correctIndex]) {
                    buttons[correctIndex].classList.add('correct');
                    buttons[correctIndex].querySelector('i').className = 'fa-solid fa-circle-check';
                }
            }

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        // 5. Final Result Display
        function renderScore() {
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = `
                <div class="score-box">
                    <i class="fa-solid fa-trophy fa-3x" style="color:#ffc107; margin-bottom: 15px;"></i>
                    <h2>কুইজ সম্পন্ন হয়েছে!</h2>
                    <p style="font-size: 18px; color: #555;">আপনার মোট প্রাপ্ত নম্বর: <b>${score} / ${currentQuestions.length}</b></p>
                    <button class="btn" style="margin-top: 20px;" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> পুনরায় চেষ্টা করুন</button>
                </div>
            `;
        }

        window.onload = initQuizAccess;
    </script>
</body>
</html>

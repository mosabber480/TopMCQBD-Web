<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile - TopMCQ</title>
    
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) { window.location.replace('../login.html'); }
        })();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global/global.css">

    <style>
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-group { margin-bottom: 12px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 8px 35px 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        
        /* Eye Icon Style */
        .toggle-password { position: absolute; right: 10px; top: 32px; cursor: pointer; color: #888; }
        
        .btn-submit { background-color: #007bff; width: 100%; padding: 10px; font-size: 14px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #64748b; margin: 0 auto 15px; }
        .info-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
        
        /* User Table Styles */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }

        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        .badge-requested { background-color: #007bff; color: white; }

        .plan-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
        .btn-update { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; }

        .table-responsive { overflow-x: auto; }

        @media (max-width: 900px) { 
            .grid-2 { grid-template-columns: 1fr; } 
            table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <div id="admin-navbar-container"></div>

    <div class="container">
        <!-- Profile Info & Settings Grid -->
        <div class="grid-2">
            <!-- Profile Info Box -->
            <div class="box">
                <div class="profile-header">
                    <div class="profile-avatar"><i class="fa-solid fa-user-shield"></i></div>
                    <h2 id="userName">Loading...</h2>
                    <p id="userRole" style="color: #666;"></p>
                </div>
                <div class="info-row"><span style="font-weight:bold;">Email:</span> <span id="userEmail">Loading...</span></div>
                <div class="info-row"><span style="font-weight:bold;">Joined:</span> <span id="userCreatedAt">N/A</span></div>
                <button class="btn-submit" style="background:#dc3545; margin-top:20px;" onclick="logout()">Logout</button>
            </div>

            <!-- Forms Box -->
            <div>
                <div class="box" id="createAdminBox" style="display:none; border-left: 5px solid #007bff;">
                    <h3>➕ Create New Admin</h3>
                    <form id="createAdminForm">
                        <div class="form-group"><label>Name:</label><input type="text" id="adminName" required></div>
                        <div class="form-group"><label>Email:</label><input type="email" id="adminEmail" required></div>
                        <div class="form-group">
                            <label>Password:</label>
                            <input type="password" id="adminPassword" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('adminPassword')"></i>
                        </div>
                        <button type="submit" class="btn-submit">Create Admin Account</button>
                    </form>
                </div>

                <div class="box" style="border-left: 5px solid #ffc107;">
                    <h3><i class="fa-solid fa-lock"></i> Change Password</h3>
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label>Current Password:</label>
                            <input type="password" id="oldPassword" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('oldPassword')"></i>
                        </div>
                        <div class="form-group">
                            <label>New Password:</label>
                            <input type="password" id="newPassword" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('newPassword')"></i>
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password:</label>
                            <input type="password" id="confirmNewPassword" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmNewPassword')"></i>
                        </div>
                        <button type="submit" class="btn-submit" style="background-color: #ffc107; color:#212529;">Update Password</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Pending Users Table Section -->
        <div class="box" style="margin-top: 25px; border-top: 5px solid #dc3545;">
            <h3><i class="fa-solid fa-user-clock"></i> Pending & Cancelled Users</h3>
            <p style="color:#666; font-size:14px; margin-top: 5px;">Customers waiting for subscription approval or whose access has been cancelled/expired.</p>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Requested Plan</th>
                            <th>Action (Set Plan)</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="pendingUserTableBody">
                        <tr><td colspan="7" style="text-align:center;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>
    <script>
        const API_BASE = 'https://mosabber-quiz-app.onrender.com/api';
        const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
        const currentUser = JSON.parse(localStorage.getItem('user') || localStorage.getItem('quiz_user') || '{}');

        // পাসওয়ার্ড ভিউ টগল ফাংশন
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        async function logout() {
            const isConfirmed = await showTopAlert('আপনি কি নিশ্চিত যে লগআউট করতে চান?', 'warning', true);
            if (isConfirmed) {
                localStorage.clear();
                window.location.replace('../login.html');
            }
        }

        if (currentUser.name) {
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userEmail').innerText = currentUser.email;
            document.getElementById('userRole').innerText = currentUser.role ? currentUser.role.toUpperCase() : 'ADMIN';
            if(currentUser.createdAt) document.getElementById('userCreatedAt').innerText = new Date(currentUser.createdAt).toLocaleDateString();
        }

        if (currentUser.role === 'owner') { document.getElementById('createAdminBox').style.display = 'block'; }

        document.getElementById('createAdminForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(`${API_BASE}/users/create-admin`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ 
                    name: document.getElementById('adminName').value,
                    email: document.getElementById('adminEmail').value,
                    password: document.getElementById('adminPassword').value 
                })
            });
            const data = await res.json();
            if (data.success) { showTopAlert('✅ ' + data.message, 'success'); document.getElementById('createAdminForm').reset(); }
            else { showTopAlert('❌ ' + data.message, 'danger'); }
        });

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmNewPassword').value;

            if (newPassword !== confirmPassword) {
                showTopAlert('❌ নতুন পাসওয়ার্ড দুটি মিলছে না!', 'danger');
                return;
            }

            const res = await fetch(`${API_BASE}/auth/change-password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ 
                    oldPassword: document.getElementById('oldPassword').value,
                    newPassword: newPassword 
                })
            });
            const data = await res.json();
            if (data.success) { showTopAlert('✅ ' + data.message, 'success'); document.getElementById('changePasswordForm').reset(); }
            else { showTopAlert('❌ ' + data.message, 'danger'); }
        });

        // ==========================================
        // PENDING / INACTIVE USERS LOGIC
        // ==========================================
        async function loadPendingUsers() {
            const tableBody = document.getElementById('pendingUserTableBody');
            try {
                const res = await fetch(`${API_BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (!data.success) {
                    tableBody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">${data.message || 'Failed to load users'}</td></tr>`;
                    return;
                }

                tableBody.innerHTML = '';
                
                // শুধুমাত্র কাস্টমার যাদের plan 'none', subscription active নয়, অথবা যারা নতুন প্যাকেজ রিকোয়েস্ট করেছে
                const pendingUsers = data.users.filter(u => 
                    u.role === 'customer' && (!u.subscription || u.subscription.plan === 'none' || u.subscription.active === false || (u.requestedPlan && u.requestedPlan !== 'none'))
                );

                if(pendingUsers.length === 0){
                    tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#28a745; font-weight:bold;">🎉 No pending users. Everyone has an active subscription!</td></tr>`;
                    return;
                }

                pendingUsers.forEach((u, index) => {
                    const sub = u.subscription || {};
                    const isRequested = u.requestedPlan && u.requestedPlan !== 'none';
                    
                    // স্ট্যাটাস ব্যাজ
                    const statusBadge = isRequested 
                        ? `<span class="badge badge-active" style="background:#ffc107; color:#212529;">Requested</span>`
                        : `<span class="badge badge-expired">Pending / Inactive</span>`;
                    
                    // রিকোয়েস্ট করা প্ল্যানের নাম দেখানো
                    const requestedPlanDisplay = isRequested
                        ? `<span class="badge badge-requested">${u.requestedPlan}</span>`
                        : `<span style="color:#888;">No Request</span>`;

                    // ড্রপডাউনে ডিফল্ট সিলেক্ট ভ্যালু নির্ধারণ (রিকোয়েস্ট থাকলে সেটা, না থাকলে কারেন্ট প্ল্যান)
                    const defaultSelect = isRequested ? u.requestedPlan : (sub.plan || 'none');

                    tableBody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><b>${u.name}</b></td>
                            <td>${u.email}</td>
                            <td>${statusBadge}</td>
                            <td>${requestedPlanDisplay}</td>
                            <td>
                                <select class="plan-select" id="plan-${u._id}">
                                    <option value="none" ${defaultSelect === 'none' ? 'selected' : ''}>Cancel Plan</option>
                                    <option value="1_month" ${defaultSelect === '1_month' ? 'selected' : ''}>1 Month</option>
                                    <option value="3_months" ${defaultSelect === '3_months' ? 'selected' : ''}>3 Months</option>
                                    <option value="6_months" ${defaultSelect === '6_months' ? 'selected' : ''}>6 Months</option>
                                    <option value="1_year" ${defaultSelect === '1_year' ? 'selected' : ''}>1 Year</option>
                                    <option value="2_years" ${defaultSelect === '2_years' ? 'selected' : ''}>2 Years</option>
                                    <option value="3_years" ${defaultSelect === '3_years' ? 'selected' : ''}>3 Years</option>
                                </select>
                                <button class="btn-action btn-update" onclick="updateSubscription('${u._id}')">Save Plan</button>
                            </td>
                            <td>
                                ${currentUser.role === 'owner' ? `
                                    <button class="btn-action btn-delete" onclick="deleteUser('${u._id}', '${u.name}')">Delete</button>
                                ` : '<small style="color:#aaa;">N/A</small>'}
                            </td>
                        </tr>
                    `;
                });

            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">Error fetching user list!</td></tr>`;
            }
        }

        async function updateSubscription(userId) {
            const selectedPlan = document.getElementById(`plan-${userId}`).value;
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/subscription`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ plan: selectedPlan })
                });

                const data = await res.json();
                if (data.success) {
                    showTopAlert(`✅ ${data.message}`, 'success');
                    loadPendingUsers(); // Reload table after update
                } else {
                    showTopAlert(`❌ Failed: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert(`❌ Error updating plan!`, 'danger');
            }
        }

        async function deleteUser(userId, userName) {
            const confirmed = await showTopAlert(`Are you sure you want to delete user '${userName}'?`, 'danger', true);
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    showTopAlert(`✅ ${data.message}`, 'success');
                    loadPendingUsers();
                } else {
                    showTopAlert(`❌ Delete failed: ${data.message}`, 'danger');
                }
            } catch (err) {
                showTopAlert(`❌ Error deleting user!`, 'danger');
            }
        }

        // On window load, fetch pending users
        window.addEventListener('DOMContentLoaded', loadPendingUsers);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & User Management - TopMCQ</title>
    
    <!-- Instant Auth Check -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) { window.location.replace('../login.html'); }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="../global/global.css">

    <style>
        :root {
            --primary: #007bff; --primary-dark: #0056b3; --secondary: #17a2b8;
            --warning: #ff9f43; --danger: #dc3545; --dark: #2c3e50;
            --light: #f4f7f6; --gray-btn: #6c757d; --main-dash-btn: #28a745;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: #333; }

        .alert-container-inner { max-width: 1300px !important; }
        .container { max-width: 1900px; margin: 0 auto; padding: 25px; }

        .box { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }

        /* Search & Filter Controls CSS */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input { width: 100%; padding: 10px 15px 10px 35px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
        .search-box input:focus { border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .search-box i { position: absolute; left: 13px; top: 13px; color: #888; }
        .filter-box { min-width: 220px; }
        .filter-box select { width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; cursor: pointer; background: white; font-weight: bold; color: #444; outline: none; }
        .filter-box select:focus { border-color: #007bff; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f5f9; }

        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-expired { background-color: #f8d7da; color: #721c24; }
        .badge-owner { background-color: #cce5ff; color: #004085; }
        .badge-requested { background-color: #ffc107; color: #212529; }
        .badge-type { background-color: #e2e8f0; color: #333; font-size: 10.5px; }

        .plan-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; color: white; transition: 0.2s; }
        .btn-update { background-color: #28a745; }
        .btn-update:hover { background-color: #218838; }
        .btn-delete { background-color: #dc3545; }
        .btn-delete:hover { background-color: #c82333; }
        .btn-edit { background-color: #007bff; }
        .btn-edit:hover { background-color: #0069d9; }
        .btn-cancel-small { background-color: #6c757d; }
        .btn-cancel-small:hover { background-color: #5a6268; }

        .table-responsive { overflow-x: auto; }

        .user-name-link { cursor: pointer; color: #007bff; text-decoration: underline; }
        .user-name-link:hover { color: #0056b3; }
        .btn-view-history { background-color: #17a2b8; margin-top: 6px; font-size: 11px; padding: 4px 10px; }

        .override-plan-text { font-weight: bold; color: #28a745; margin-bottom: 6px; }
        .override-actions { display: flex; gap: 6px; }
        .override-edit-box { display: none; }

        /* Dropdown History Styles */
        .history-row { background-color: #f8f9fa; }
        .history-container-inner { padding: 15px 25px; border: 1px solid #e2e8f0; border-radius: 8px; margin: 10px; background: white; box-shadow: inset 0 2px 8px rgba(0,0,0,0.04); }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        
        .add-payment-form { background: #f4f8ff; border: 1px dashed #007bff; border-radius: 8px; padding: 15px; margin-bottom: 18px; }
        .add-payment-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        .history-entry { background: #fff8e1; border: 1px solid #ffe58a; border-radius: 8px; padding: 12px 15px; margin-bottom: 12px; transition: 0.3s ease; }
        .history-entry:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .history-entry.rejected { background: #fdf2f2; border-color: #f3b8bd; }
        .history-entry.approved { background: #f0faf4; border-color: #a8e6b8; }
        .history-entry .he-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .history-entry .he-plan { font-weight: bold; font-size: 15px; color: #333; }
        
        .he-body-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }

        .history-entry .he-info { font-size: 13px; color: #555; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; line-height: 1.5; flex: 1; }
        .history-entry .he-actions { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
        
        .history-entry .he-edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
        .history-entry .he-edit-form .full-width { grid-column: 1 / -1; }
        
        .no-history-text { color: #888; font-size: 13.5px; text-align: center; }
        .empty-state-container { position: relative; display: flex; align-items: center; min-height: 40px; margin-bottom: 5px; }
        .empty-state-btn { position: absolute; left: 0; z-index: 2; }
        .empty-state-text { width: 100%; text-align: center; z-index: 1; }

        @media (max-width: 900px) {
            table { display: block; overflow-x: auto; }
            .add-payment-form .form-row, .history-entry .he-edit-form { grid-template-columns: 1fr; }
            .he-body-wrap { flex-direction: column; align-items: flex-start; gap: 10px; }
            .empty-state-container { flex-direction: column; align-items: flex-start; gap: 10px; }
            .empty-state-btn { position: static; }
        }
    </style>
</head>
<body>

    <div id="admin-navbar-container"></div>

    <div class="container">
        <div class="box">
            <h3><i class="fa-solid fa-users"></i> Registered Users & Subscription Plans</h3>
            <p style="color:#666; font-size:14px; margin-top: 5px;">নতুন রিকোয়েস্ট আসলে তা সরাসরি ইউজারের নামের নিচেই দেখাবে। নিচে ফিল্টার এবং সার্চ ব্যবহার করে ইউজার খুঁজে বের করুন।</p>
            
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by Name or Email..." onkeyup="applyFilters()">
                </div>
                <div class="filter-box">
                    <select id="statusFilter" onchange="applyFilters()">
                        <option value="all">All Users Status</option>
                        <option value="pending">Pending Request</option>
                        <option value="active">Active Subscription</option>
                        <option value="expired">Expired / Inactive</option>
                        <option value="admin">Owner / Admin</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>User Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Payment History</th>
                            <th>Current Plan</th>
                            <th>Expiry Date</th>
                            <th>Manual Override</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="10" style="text-align:center;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>

    <script>
        const API_BASE = 'https://mosabber-quiz-app.onrender.com/api';
        const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
        const currentUser = JSON.parse(localStorage.getItem('user') || localStorage.getItem('quiz_user') || '{}');

        let usersCache = [];        
        let currentOpenUserId = null; 

        // 💡 Remaining Time Calculator Helper Function
        function getRemainingTime(endDateStr) {
            const now = new Date();
            const end = new Date(endDateStr);
            if (end <= now) return 'Expired';

            let years = end.getFullYear() - now.getFullYear();
            let months = end.getMonth() - now.getMonth();
            let days = end.getDate() - now.getDate();
            let hours = end.getHours() - now.getHours();

            if (hours < 0) { hours += 24; days--; }
            if (days < 0) { const prevMonth = new Date(end.getFullYear(), end.getMonth(), 0); days += prevMonth.getDate(); months--; }
            if (months < 0) { months += 12; years--; }

            let parts = [];
            if (years > 0) parts.push(`${years} Year${years > 1 ? 's' : ''}`);
            if (months > 0) parts.push(`${months} Month${months > 1 ? 's' : ''}`);
            if (days > 0) parts.push(`${days} Day${days > 1 ? 's' : ''}`);
            if (hours > 0) parts.push(`${hours} Hour${hours > 1 ? 's' : ''}`);

            return parts.length > 0 ? parts.join(' ') : 'Less than 1 Hour';
        }

        function planLabel(plan) { return (plan || '').replace('_', ' ').toUpperCase(); }
        function typeLabel(type) {
            if (type === 'renew') return 'Renew';
            if (type === 'add') return 'Add';
            if (type === 'manual') return 'Manual (Admin)';
            return 'New';
        }
        function methodLabel(method) { return method === 'bkash' ? 'বিকাশ' : method === 'nagad' ? 'নগদ' : method; }

        // 💡 UPDATED: Current Plan Logic - Read directly from Database
        function getDisplayPlan(userObj) {
            const sub = userObj.subscription || {};
            
            // যদি সাবস্ক্রিপশন একটিভ থাকে এবং মেয়াদ শেষ না হয়ে থাকে, তবে ডাটাবেজে সেভ করা নামটাই দেখাবে
            if (sub.active && sub.endDate && new Date(sub.endDate) > new Date()) {
                return planLabel(sub.plan);
            }
            return 'None';
        }

        async function loadUsers() {
            const tableBody = document.getElementById('userTableBody');
            try {
                const res = await fetch(`${API_BASE}/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (!data.success) {
                    tableBody.innerHTML = `<tr><td colspan="10" style="color:red; text-align:center;">${data.message || 'Failed to load users'}</td></tr>`;
                    return;
                }

                usersCache = data.users;
                applyFilters();

            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="10" style="color:red; text-align:center;">Error fetching user list!</td></tr>`;
            }
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filteredUsers = usersCache.filter(u => {
                const nameMatch = (u.name || '').toLowerCase().includes(query);
                const emailMatch = (u.email || '').toLowerCase().includes(query);
                const matchesSearch = nameMatch || emailMatch;

                const sub = u.subscription || {};
                const isActive = sub.active && sub.endDate && new Date(sub.endDate) > new Date();
                const pendingCount = (u.pendingRequests || []).filter(r => r.status === 'pending').length;
                const isAdmin = u.role === 'owner' || u.role === 'admin';

                let userStatusCategory = 'expired';
                if (isAdmin) userStatusCategory = 'admin';
                else if (pendingCount > 0) userStatusCategory = 'pending';
                else if (isActive) userStatusCategory = 'active';

                const matchesStatus = (statusFilter === 'all' || userStatusCategory === statusFilter);

                return matchesSearch && matchesStatus;
            });

            renderTable(filteredUsers);
        }

        function renderTable(usersToRender) {
            const tableBody = document.getElementById('userTableBody');
            tableBody.innerHTML = '';

            if (usersToRender.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 25px; color: #888;"><b>কোনো ইউজার পাওয়া যায়নি!</b></td></tr>`;
                return;
            }

            usersToRender.forEach((u, index) => {
                const sub = u.subscription || {};
                const isActive = sub.active && sub.endDate && new Date(sub.endDate) > new Date();
                const pendingCount = (u.pendingRequests || []).filter(r => r.status === 'pending').length;
                const totalRecords = (u.pendingRequests || []).length;

                let statusBadge = '';
                if (u.role === 'owner' || u.role === 'admin') {
                    statusBadge = `<span class="badge badge-owner">${u.role.toUpperCase()}</span>`;
                } else if (pendingCount > 0) {
                    statusBadge = `<span class="badge badge-requested">${pendingCount} Requested</span>`;
                } else if (isActive) {
                    statusBadge = `<span class="badge badge-active">Active</span>`;
                } else {
                    statusBadge = `<span class="badge badge-expired">Expired / Inactive</span>`;
                }

                const displayPlanText = getDisplayPlan(u); 
                const defaultSelect = sub.plan || 'none';
                const expiryDate = sub.endDate ? new Date(sub.endDate).toLocaleDateString() : 'N/A';

                let remainingTimeHTML = '';
                if (isActive && u.role !== 'owner' && u.role !== 'admin') {
                    const remainingText = getRemainingTime(sub.endDate);
                    if (remainingText !== 'Expired') {
                        remainingTimeHTML = `<br><span style="color: #e67e22; font-size: 12px; font-weight: normal; display: inline-block; margin-top: 4px;">Remaining Time: ${remainingText}</span>`;
                    }
                }

                // 💡 Custom Date Manual Override Form HTML
                const currentCustomName = defaultSelect !== 'none' && !['1_month','3_months','6_months','1_year','2_years','3_years'].includes(defaultSelect) ? defaultSelect : '';
                const isCustomActive = currentCustomName ? 'selected' : '';

                const overrideDropdownHTML = `
                    <select class="plan-select" id="plan-${u._id}" onchange="toggleCustomFields('${u._id}')">
                        <option value="none" ${defaultSelect === 'none' ? 'selected' : ''}>Cancel Plan</option>
                        <option value="1_month" ${defaultSelect === '1_month' ? 'selected' : ''}>1 Month</option>
                        <option value="3_months" ${defaultSelect === '3_months' ? 'selected' : ''}>3 Months</option>
                        <option value="6_months" ${defaultSelect === '6_months' ? 'selected' : ''}>6 Months</option>
                        <option value="1_year" ${defaultSelect === '1_year' ? 'selected' : ''}>1 Year</option>
                        <option value="2_years" ${defaultSelect === '2_years' ? 'selected' : ''}>2 Years</option>
                        <option value="3_years" ${defaultSelect === '3_years' ? 'selected' : ''}>3 Years</option>
                        <option value="custom" ${isCustomActive}>Custom Plan</option>
                    </select>
                    <div id="custom-fields-${u._id}" style="display: ${isCustomActive ? 'flex' : 'none'}; flex-wrap: wrap; gap: 4px; margin-top: 6px;">
                        <input type="text" id="custom-name-${u._id}" placeholder="Plan Name (e.g. Custom Package)" value="${currentCustomName}" style="width: 100%; padding: 5px; font-size: 12px; border:1px solid #ccc; border-radius:4px;">
                        <input type="number" id="custom-y-${u._id}" placeholder="Years" min="0" style="width: 30%; flex: 1; padding: 5px; font-size: 12px; border:1px solid #ccc; border-radius:4px;">
                        <input type="number" id="custom-m-${u._id}" placeholder="Months" min="0" style="width: 30%; flex: 1; padding: 5px; font-size: 12px; border:1px solid #ccc; border-radius:4px;">
                        <input type="number" id="custom-d-${u._id}" placeholder="Days" min="0" style="width: 30%; flex: 1; padding: 5px; font-size: 12px; border:1px solid #ccc; border-radius:4px;">
                    </div>
                `;

                let overrideCell = '<small style="color:#888;">Full Access</small>';
                if (u.role === 'customer') {
                    if (isActive) {
                        overrideCell = `
                            <div class="override-view-box" id="override-view-${u._id}">
                                <div class="override-plan-text">${displayPlanText}</div>
                                <div class="override-actions">
                                    <button class="btn-action btn-edit" onclick="toggleOverrideEdit('${u._id}')">Edit</button>
                                    <button class="btn-action btn-delete" onclick="cancelActivePlan('${u._id}')">Cancel</button>
                                </div>
                            </div>
                            <div class="override-edit-box" id="override-edit-${u._id}">
                                ${overrideDropdownHTML}
                                <div class="override-actions" style="margin-top:6px;">
                                    <button class="btn-action btn-update" onclick="updateSubscription('${u._id}')">Save</button>
                                    <button class="btn-action btn-cancel-small" onclick="toggleOverrideEdit('${u._id}')">Back</button>
                                </div>
                            </div>
                        `;
                    } else {
                        overrideCell = `
                            ${overrideDropdownHTML}
                            <button class="btn-action btn-update" onclick="updateSubscription('${u._id}')" style="margin-top:6px;">Save Plan</button>
                        `;
                    }
                }

                let pendingAlertHTML = '';
                const pendingReqsForAlert = (u.pendingRequests || []).filter(r => r.status === 'pending');
                
                if (pendingReqsForAlert.length > 0) {
                    pendingAlertHTML = pendingReqsForAlert.map(pr => `
                        <tr style="background-color: #fffaf0; border-bottom: 2px solid #e0e0e0;">
                            <td colspan="10" style="padding: 12px 15px; border-left: 4px solid #ffc107;">
                                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                                    <div style="font-size: 13px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
                                        <span class="badge" style="background:#ffc107; color:#212529;"><i class="fa-solid fa-bell"></i> New Request</span>
                                        <strong style="color:#333; font-size: 14px;">${planLabel(pr.plan)}</strong>
                                        <span class="badge badge-type">${typeLabel(pr.type)}</span>
                                        <span style="color:#ccc;">|</span> ফোন: <b>${pr.phone}</b>
                                        <span style="color:#ccc;">|</span> Trx: <b>${pr.transactionId}</b>
                                        <span style="color:#ccc;">|</span> মাধ্যম: <b>${methodLabel(pr.paymentMethod)}</b>
                                        <span style="color:#ccc;">|</span> তারিখ: <b>${new Date(pr.requestedAt).toLocaleString()}</b>
                                    </div>
                                    <div style="display: flex; gap: 6px;">
                                        <button class="btn-action btn-update" onclick="approveRequest('${u._id}', '${pr._id}')"><i class="fa-solid fa-check"></i> Approve</button>
                                        <button class="btn-action btn-delete" onclick="rejectRequest('${u._id}', '${pr._id}')"><i class="fa-solid fa-xmark"></i> Reject</button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }

                tableBody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><b class="user-name-link" onclick="toggleHistoryDropdown('${u._id}')">${u.name}</b></td>
                        <td>${u.email}</td>
                        <td><small>${u.role}</small></td>
                        <td>${statusBadge}</td>
                        <td>
                            ${totalRecords > 0 ? `<span>${totalRecords} Record${totalRecords > 1 ? 's' : ''}</span>` : '<span style="color:#888;">No Record</span>'}
                            <br>
                            <button class="btn-action btn-view-history" id="btn-history-${u._id}" onclick="toggleHistoryDropdown('${u._id}')">
                                ${currentOpenUserId === u._id ? 'Close History' : 'View History'}
                            </button>
                        </td>
                        <td>
                            <b>${displayPlanText}</b>
                            ${remainingTimeHTML}
                        </td>
                        <td>${expiryDate}</td>
                        <td>${overrideCell}</td>
                        <td>
                            ${currentUser.role === 'owner' && u.role !== 'owner' ? `
                                <button class="btn-action btn-delete" onclick="deleteUser('${u._id}', '${u.name}')">Delete</button>
                            ` : '<small style="color:#aaa;">N/A</small>'}
                        </td>
                    </tr>
                    ${pendingAlertHTML}
                    <tr class="history-row" id="history-row-${u._id}" style="display: ${currentOpenUserId === u._id ? 'table-row' : 'none'};">
                        <td colspan="10" style="padding: 0;">
                            <div id="history-container-${u._id}"></div>
                        </td>
                    </tr>
                `;
            });

            if (currentOpenUserId) { renderHistoryContent(currentOpenUserId); }
        }

        // 💡 Function to Toggle Custom Input Fields
        window.toggleCustomFields = function(userId) {
            const val = document.getElementById(`plan-${userId}`).value;
            const fields = document.getElementById(`custom-fields-${userId}`);
            if(fields) fields.style.display = val === 'custom' ? 'flex' : 'none';
        }

        function toggleHistoryDropdown(userId) {
            const targetRow = document.getElementById(`history-row-${userId}`);
            const currentBtn = document.getElementById(`btn-history-${userId}`);

            if (currentOpenUserId === userId) {
                targetRow.style.display = 'none';
                if(currentBtn) currentBtn.innerHTML = 'View History';
                currentOpenUserId = null;
                return;
            }

            if (currentOpenUserId) {
                const prevRow = document.getElementById(`history-row-${currentOpenUserId}`);
                const prevBtn = document.getElementById(`btn-history-${currentOpenUserId}`);
                if (prevRow) prevRow.style.display = 'none';
                if (prevBtn) prevBtn.innerHTML = 'View History';
            }

            currentOpenUserId = userId;
            renderHistoryContent(userId); 
            targetRow.style.display = 'table-row';
            if(currentBtn) currentBtn.innerHTML = 'Close History';
        }

        function renderHistoryContent(userId) {
            const user = usersCache.find(u => u._id === userId);
            const container = document.getElementById(`history-container-${userId}`);
            if (!user || !container) return;

            const requests = [...(user.pendingRequests || [])].sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));

            const addBtnHtml = `<button class="btn-action btn-update" style="margin-top: 0px;" onclick="toggleAddForm('${userId}')"><i class="fa-solid fa-plus"></i> Add New Payment Record</button>`;

            const addFormHtml = `
                <div class="add-payment-form" id="addPaymentForm-${userId}" style="display:none; margin-top: 15px;">
                    <div class="form-row">
                        <div>
                            <label>প্যাকেজ নাম (যে কোনো কিছু)</label>
                            <!-- 💡 Dropdown Removed. Added Text Input -->
                            <input type="text" id="addPlan-${userId}" placeholder="e.g. 3_months বা Custom">
                        </div>
                        <div>
                            <label>Status</label>
                            <select id="addStatus-${userId}">
                                <option value="approved">Active (Approved)</option>
                                <option value="pending">Pending</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div><label>ফোন নাম্বার</label><input type="text" id="addPhone-${userId}" placeholder="017XXXXXXXX"></div>
                        <div><label>Transaction ID</label><input type="text" id="addTrxId-${userId}" placeholder="Transaction ID"></div>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label>পেমেন্ট মাধ্যম</label>
                        <select id="addMethod-${userId}">
                            <option value="bkash">বিকাশ (Bkash)</option>
                            <option value="nagad">নগদ (Nagad)</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn-action btn-cancel-small" style="flex:1; padding:10px;" onclick="toggleAddForm('${userId}')">বাতিল</button>
                        <button type="button" class="btn-action btn-update" style="flex:1; padding:10px;" onclick="submitAddPayment('${userId}')">Save Record</button>
                    </div>
                </div>
            `;

            let contentHTML = '';

            if (requests.length === 0) {
                contentHTML = `
                    <div class="empty-state-container">
                        <div class="empty-state-btn">${addBtnHtml}</div>
                        <div id="historyList-${userId}" class="empty-state-text"><p class="no-history-text" style="margin: 0; padding: 0;">এখনো কোনো Payment Record নেই।</p></div>
                    </div>
                    ${addFormHtml}
                `;
            } else {
                let historyListHtml = requests.map(r => {
                    const isRejected = r.status === 'rejected';
                    const isApproved = r.status === 'approved';
                    const isPending = r.status === 'pending';
                    const cardClass = isRejected ? 'rejected' : (isApproved ? 'approved' : '');
                    const statusLabel = isRejected ? 'Rejected' : (isApproved ? 'Active' : 'Pending');
                    const badgeClass = isRejected ? 'badge-expired' : (isApproved ? 'badge-active' : 'badge-requested');

                    return `
                        <div class="history-entry ${cardClass}" id="he-${r._id}">
                            <div class="he-top">
                                <span class="he-plan">${planLabel(r.plan)}</span>
                                <span class="badge ${badgeClass}">${statusLabel}</span>
                            </div>
                            
                            <div class="he-body-wrap" id="he-view-${r._id}">
                                <div class="he-info">
                                    <span class="badge badge-type">${typeLabel(r.type)}</span><span style="color:#ccc;">|</span>
                                    ফোন: <b>${r.phone}</b><span style="color:#ccc;">|</span>
                                    Trx ID: <b>${r.transactionId}</b><span style="color:#ccc;">|</span>
                                    মাধ্যম: <b>${methodLabel(r.paymentMethod)}</b><span style="color:#ccc;">|</span>
                                    তারিখ: <b>${new Date(r.requestedAt).toLocaleString()}</b>
                                    ${isRejected && r.rejectionReason ? `<span style="color:#ccc;">|</span> <span style="color:#dc3545; font-weight:bold;">কারণ: ${r.rejectionReason}</span>` : ''}
                                </div>
                                <div class="he-actions">
                                    ${isPending ? `<button class="btn-action btn-update" onclick="approveRequest('${userId}', '${r._id}')">Approve</button>
                                                   <button class="btn-action btn-delete" onclick="rejectRequest('${userId}', '${r._id}')">Reject</button>` : ''}
                                    <button class="btn-action btn-edit" onclick="startEditEntry('${r._id}')">Edit</button>
                                    <button class="btn-action btn-delete" onclick="deleteEntry('${userId}', '${r._id}')">Delete</button>
                                </div>
                            </div>

                            <div class="he-edit-form" id="he-edit-${r._id}" style="display:none;">
                                <!-- 💡 Dropdown Removed. Added Text Input -->
                                <input type="text" id="he-plan-${r._id}" value="${r.plan}" placeholder="Package Name (e.g. 1_month or Custom Name)">
                                <select id="he-method-${r._id}">
                                    <option value="bkash" ${r.paymentMethod === 'bkash' ? 'selected' : ''}>বিকাশ</option>
                                    <option value="nagad" ${r.paymentMethod === 'nagad' ? 'selected' : ''}>নগদ</option>
                                </select>
                                <input type="text" id="he-phone-${r._id}" value="${r.phone}" placeholder="ফোন নাম্বার">
                                <input type="text" id="he-trx-${r._id}" value="${r.transactionId}" placeholder="Transaction ID">
                                <div class="full-width" style="display:flex; gap:6px;">
                                    <button class="btn-action btn-update" onclick="saveEditEntry('${userId}', '${r._id}')">Save</button>
                                    <button class="btn-action btn-cancel-small" onclick="cancelEditEntry('${userId}')">বাতিল</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                contentHTML = `<div id="historyList-${userId}" style="margin-bottom: 15px;">${historyListHtml}</div>${addBtnHtml}${addFormHtml}`;
            }

            container.innerHTML = `
                <div class="history-container-inner">
                    <div class="history-header">
                        <h4 style="margin:0; color:#007bff;"><i class="fa-solid fa-clock-rotate-left"></i> Payment History for ${user.name}</h4>
                        <button class="btn-action btn-cancel-small" onclick="toggleHistoryDropdown('${userId}')"><i class="fa-solid fa-xmark"></i> Close History</button>
                    </div>
                    ${contentHTML}
                </div>
            `;
        }

        // ==========================================
        // Other Operations Functions
        // ==========================================

        function toggleOverrideEdit(userId) {
            const viewBox = document.getElementById(`override-view-${userId}`);
            const editBox = document.getElementById(`override-edit-${userId}`);
            const isEditing = editBox.style.display === 'block';
            editBox.style.display = isEditing ? 'none' : 'block';
            viewBox.style.display = isEditing ? 'block' : 'none';
        }

        async function cancelActivePlan(userId) {
            const confirmed = await showTopAlert('এই ইউজারের Active প্ল্যান বাতিল করতে চান?', 'danger', true);
            if (!confirmed) return;
            
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/subscription`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ plan: 'none' })
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ Failed: ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert(`❌ Error updating plan!`, 'danger'); }
        }

        // 💡 Update Subscription Handling (Including Custom Logic)
        async function updateSubscription(userId) {
            const plan = document.getElementById(`plan-${userId}`).value;
            let payload = { plan };

            if (plan === 'custom') {
                payload.customName = document.getElementById(`custom-name-${userId}`).value;
                payload.years = document.getElementById(`custom-y-${userId}`).value;
                payload.months = document.getElementById(`custom-m-${userId}`).value;
                payload.days = document.getElementById(`custom-d-${userId}`).value;
            }

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/subscription`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ Failed: ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert(`❌ Error updating plan!`, 'danger'); }
        }

        function startEditEntry(requestId) {
            document.getElementById(`he-view-${requestId}`).style.display = 'none';
            document.getElementById(`he-edit-${requestId}`).style.display = 'grid';
        }

        function cancelEditEntry(userId) { renderHistoryContent(userId); }

        function toggleAddForm(userId) {
            const form = document.getElementById(`addPaymentForm-${userId}`);
            const isOpen = form.style.display === 'block';
            form.style.display = isOpen ? 'none' : 'block';
            if (!isOpen) {
                document.getElementById(`addPhone-${userId}`).value = '';
                document.getElementById(`addTrxId-${userId}`).value = '';
            }
        }

        async function saveEditEntry(userId, requestId) {
            const plan = document.getElementById(`he-plan-${requestId}`).value.trim();
            const paymentMethod = document.getElementById(`he-method-${requestId}`).value;
            const phone = document.getElementById(`he-phone-${requestId}`).value.trim();
            const transactionId = document.getElementById(`he-trx-${requestId}`).value.trim();

            if (!phone || !transactionId || !plan) { showTopAlert('প্ল্যান, ফোন নাম্বার ও Transaction ID দিতে হবে।', 'warning'); return; }

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/pending-requests/${requestId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ plan, paymentMethod, phone, transactionId })
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert('❌ Error updating record!', 'danger'); }
        }

        async function deleteEntry(userId, requestId) {
            const confirmed = await showTopAlert('এই Payment Record-টা স্থায়ীভাবে মুছে ফেলতে চান?', 'danger', true);
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/pending-requests/${requestId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert('❌ Error deleting record!', 'danger'); }
        }

        async function submitAddPayment(userId) {
            const plan = document.getElementById(`addPlan-${userId}`).value.trim();
            const status = document.getElementById(`addStatus-${userId}`).value;
            const phone = document.getElementById(`addPhone-${userId}`).value.trim();
            const transactionId = document.getElementById(`addTrxId-${userId}`).value.trim();
            const paymentMethod = document.getElementById(`addMethod-${userId}`).value;

            if (!phone || !transactionId || !plan) { showTopAlert('প্ল্যান, ফোন নাম্বার ও Transaction ID দিতে হবে।', 'warning'); return; }

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/pending-requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ plan, status, phone, transactionId, paymentMethod })
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert('❌ Error adding record!', 'danger'); }
        }

        async function approveRequest(userId, requestId) {
            const confirmed = await showTopAlert('এই রিকোয়েস্টটা Approve করলে ইউজারের মেয়াদ যোগ হয়ে যাবে। নিশ্চিত?', 'success', true);
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/pending-requests/${requestId}/approve`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ Failed: ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert(`❌ Error approving request!`, 'danger'); }
        }

        async function rejectRequest(userId, requestId) {
            const reason = prompt('Reject করার কারণ লিখুন (ইউজার এটা দেখতে পাবে):', 'পেমেন্ট তথ্য সঠিক নয়।');
            if (reason === null) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}/pending-requests/${requestId}/reject`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ reason })
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ Failed: ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert(`❌ Error rejecting request!`, 'danger'); }
        }

        async function deleteUser(userId, userName) {
            const confirmed = await showTopAlert(`Are you sure you want to delete user '${userName}'?`, 'danger', true);
            if (!confirmed) return;

            try {
                const res = await fetch(`${API_BASE}/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) { showTopAlert(`✅ ${data.message}`, 'success'); loadUsers(); } 
                else { showTopAlert(`❌ Delete failed: ${data.message}`, 'danger'); }
            } catch (err) { showTopAlert(`❌ Error deleting user!`, 'danger'); }
        }

        async function logout() {
            const confirmed = await showTopAlert('আপনি কি নিশ্চিত যে লগআউট করতে চান?', 'warning', true);
            if (confirmed) {
                localStorage.clear();
                window.location.replace('../login.html');
            }
        }

        window.onload = loadUsers;
    </script>
</body>
</html>

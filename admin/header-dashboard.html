<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Dashboard - TopMCQ</title>
    
    <!-- Instant Auth Check -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) {
                window.location.replace('../login.html');
            }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="../global/global.css">

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #17a2b8;
            --warning: #ff9f43;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --gray-btn: #6c757d;
            --main-dash-btn: #28a745;
            --purple-btn: #6f42c1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: #333; padding-bottom: 80px; }

        .alert-container-inner { max-width: 1300px !important; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; }
        
        .container { margin-top: 30px; margin-bottom: 30px; padding: 0 25px 25px 25px; }
        
        .section-card { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .section-card.announce-card { border-left: 6px solid var(--warning); }
        .section-card.header-card { border-left: 6px solid var(--primary); }
        .section-card.header-btn-card { border-left: 6px solid #e83e8c; }
        .section-card.menu-card { border-left: 6px solid #20c997; }
        .section-card.mega-menu-card { border-left: 6px solid #6f42c1; }

        .section-title { font-size: 20px; color: var(--dark); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px dashed #e2e8f0; }

        .read-box { background: #fdfdfd; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #20c997; transition: all 0.2s ease; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }

        .read-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .read-subtitle { font-size: 14px; color: #555; margin-bottom: 8px; }
        .read-meta { font-size: 13px; color: #555; margin-bottom: 6px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; outline: none; background: white; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }

        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-info { background-color: #17a2b8; color: white; }
        .btn-info:hover { background-color: #138496; }
        .btn-add { background: var(--main-dash-btn); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

        .sub-menu-list { margin-top: 10px; padding-left: 15px; border-left: 3px solid #17a2b8; margin-bottom: 12px; }
        .sub-menu-item { background: #ffffff; padding: 8px 12px; border: 1px dashed #cbd5e1; border-radius: 5px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }

        .drag-handle {
            cursor: grab;
            color: #475569;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            margin-right: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .drag-handle:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }
        .drag-handle:active {
            cursor: grabbing;
        }
        
        .arrow-btn-group { display: inline-flex; flex-direction: column; gap: 2px; margin-right: 10px; }
        .btn-arrow { background: #e2e8f0; border: none; color: #475569; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer; line-height: 1; transition: background 0.2s ease; }
        .btn-arrow:hover { background: var(--primary); color: #ffffff; }
        
        .draggable-item { position: relative; transition: opacity 0.2s; }
        .draggable-item.dragging { opacity: 0.35; }
        
        .drop-above::before {
            content: ''; position: absolute; top: -3px; left: 0; width: 100%; height: 3px;
            background-color: var(--primary); z-index: 100; border-radius: 2px;
        }
        .drop-below::after {
            content: ''; position: absolute; bottom: -3px; left: 0; width: 100%; height: 3px;
            background-color: var(--primary); z-index: 100; border-radius: 2px;
        }

        #reorder-action-bar {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: #2c3e50;
            padding: 15px;
            border-top: 4px solid #ffc107;
            z-index: 9999;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            justify-content: center; align-items: center; gap: 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="admin-navbar-container"></div>

    <div class="container">
        
        <!-- ১. ANNOUNCEMENT BAR CARD -->
        <div class="section-card announce-card">
            <div class="section-title"><div style="display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-bullhorn" style="color: var(--warning);"></i> ১. অ্যানাউন্সমেন্ট বার (Notice Bar)</div></div>
            <div id="announce-container"></div>
        </div>

        <!-- ২.১ LOGO, TITLE, & FAVICON CARD -->
        <div class="section-card header-card">
            <div class="section-title"><div style="display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-id-card" style="color: var(--primary);"></i> ২.১ লোগো, টাইটেল ও ফেভিকন সেটিং</div></div>
            <div id="header-brand-container"></div>
        </div>

        <!-- ২.২ HEADER BUTTON CARD -->
        <div class="section-card header-btn-card">
            <div class="section-title"><div style="display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-link" style="color: #e83e8c;"></i> ২.২ হেডার বাটন সেটিং</div></div>
            <div id="header-btn-container"></div>
        </div>

        <!-- ২.৩ MENU & SUB-MENU CARD -->
        <div class="section-card menu-card">
            <div class="section-title"><div style="display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-bars-staggered" style="color: #20c997;"></i> ২.৩ নেভিগেশন মেনু ও সাব-মেনু সেটিং</div></div>
            <div id="header-menu-container"></div>
            <div id="new-menu-form-box"></div>
            <div class="card-actions" style="margin-top:10px;" id="main-menu-action-bar">
                <button class="btn btn-add" id="add-menu-btn" onclick="showNewMenuForm()">
                    <i class="fa-solid fa-plus"></i> মূল মেনু যোগ করুন
                </button>
            </div>
        </div>

        <!-- ২.৪ MEGA MENU BUILDER CARD -->
        <div class="section-card mega-menu-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-layer-group" style="color: #6f42c1;"></i> ২.৪ মেগা মেনু বিল্ডার (Multiple Mega Menus)
                </div>
                 <div style="display:flex; gap:10px;">
                    <button class="btn btn-add btn-sm" onclick="createNewMegaMenuBlock()"><i class="fa-solid fa-plus"></i> নতুন মেগা মেনু তৈরি করুন</button>
                </div>
            </div>
            <div id="mega-menu-builder-container"></div>
        </div>

    </div>

    <!-- Drag & Drop Save Action Bar -->
    <div id="reorder-action-bar">
        <span style="color: #ffffff; font-weight: bold; font-size: 15px;">
            আপনি মেনু বা লিংকের ক্রম পরিবর্তন করেছেন। সেভ করতে বোতাম চাপুন।
        </span>
        <button class="btn btn-submit" style="padding: 10px 20px; font-size:14px;" onclick="saveReorder()"><i class="fa-solid fa-floppy-disk"></i> পরিবর্তন সেভ করুন</button>
        <button class="btn btn-danger" style="padding: 10px 15px; font-size:14px;" onclick="cancelReorder()"><i class="fa-solid fa-xmark"></i> বাতিল করুন</button>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="../config.js"></script>
    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>

    <script>
        window.LAYOUT_API_URL = `${CONFIG.ADMIN_API}/layout-config`;

        let announceInfo = null;
        let headerInfo = null;
        let footerInfo = null;
        let copyrightInfo = null;
        
        let isMenuReordered = false;
        let dragData = null; 

        async function fetchLayoutConfig() {
            try {
                const res = await fetch(window.LAYOUT_API_URL);
                const data = await res.json();

                announceInfo = data.announcement || null;
                headerInfo = data.header || {};
                footerInfo = data.footer || null;
                copyrightInfo = data.copyright || null;

                if (!headerInfo.menus) headerInfo.menus = [];
                if (!headerInfo.megaMenus) headerInfo.megaMenus = [];

                isMenuReordered = false;
                document.getElementById('reorder-action-bar').style.display = 'none';

                renderAnnounceSection();
                renderHeaderBrandSection();
                renderHeaderBtnSection(); 
                
                renderMegaMenuBuilder(); 
                renderHeaderMenuCards();
            } catch (err) { 
                console.error("Layout Config Fetch Error:", err); 
            }
        }

        function dragStart(e, type, mIdx, idx2, idx3) {
            e.stopPropagation();
            
            dragData = { 
                type: String(type), 
                mIdx: Number(mIdx), 
                idx2: idx2 !== undefined && idx2 !== null ? Number(idx2) : null, 
                idx3: idx3 !== undefined && idx3 !== null ? Number(idx3) : null 
            };
            
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", "");
            
            const item = e.currentTarget;
            if (item) {
                setTimeout(() => item.classList.add('dragging'), 0);
            }
        }

        function dragEnd(e) {
            e.stopPropagation();
            document.querySelectorAll('.draggable-item').forEach(el => {
                el.classList.remove('dragging', 'drop-above', 'drop-below');
            });
            dragData = null;
        }

        function dragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = "move";
            
            const item = e.currentTarget;
            if (!item || !dragData) return;

            if (item.dataset.type !== dragData.type) return;

            if (dragData.type === 'sub' && Number(item.dataset.midx) !== dragData.mIdx) return;
            if (dragData.type === 'megacol' && Number(item.dataset.midx) !== dragData.mIdx) return;
            if (dragData.type === 'megalink' && (Number(item.dataset.midx) !== dragData.mIdx || Number(item.dataset.idx2) !== dragData.idx2)) return;

            document.querySelectorAll('.drop-above, .drop-below').forEach(el => {
                if (el !== item) el.classList.remove('drop-above', 'drop-below');
            });

            const rect = item.getBoundingClientRect();
            const midY = rect.top + (rect.height / 2);
            
            item.classList.remove('drop-above', 'drop-below');
            if (e.clientY < midY) {
                item.classList.add('drop-above');
            } else {
                item.classList.add('drop-below');
            }
        }

        function drop(e, targetType, targetMIdx, targetIdx2, targetIdx3) {
            e.preventDefault();
            e.stopPropagation();

            const item = e.currentTarget;
            let position = 'below';
            
            if (item && item.classList.contains('drop-above')) {
                position = 'above';
            }

            document.querySelectorAll('.drop-above, .drop-below').forEach(el => el.classList.remove('drop-above', 'drop-below'));

            if (!dragData || dragData.type !== String(targetType)) {
                dragData = null;
                return;
            }

            targetMIdx = Number(targetMIdx);
            if (targetIdx2 !== undefined && targetIdx2 !== null) targetIdx2 = Number(targetIdx2);
            if (targetIdx3 !== undefined && targetIdx3 !== null) targetIdx3 = Number(targetIdx3);

            let list;
            let fromIdx, toIdx;

            if (targetType === 'main') {
                list = headerInfo.menus;
                fromIdx = dragData.mIdx;
                toIdx = targetMIdx;
            } else if (targetType === 'sub') {
                if (dragData.mIdx !== targetMIdx) return;
                list = headerInfo.menus[targetMIdx].subMenus;
                fromIdx = dragData.idx2;
                toIdx = targetIdx2;
            } else if (targetType === 'megacol') {
                if (dragData.mIdx !== targetMIdx) return;
                list = headerInfo.megaMenus[targetMIdx].columns;
                fromIdx = dragData.idx2;
                toIdx = targetIdx2;
            } else if (targetType === 'megalink') {
                if (dragData.mIdx !== targetMIdx || dragData.idx2 !== targetIdx2) return;
                list = headerInfo.megaMenus[targetMIdx].columns[targetIdx2].links;
                fromIdx = dragData.idx3;
                toIdx = targetIdx3;
            }

            if (fromIdx !== null && toIdx !== null && fromIdx !== undefined && toIdx !== undefined) {
                let insertIdx = toIdx;
                if (position === 'below') {
                    insertIdx = toIdx + 1;
                }
                if (fromIdx < insertIdx) {
                    insertIdx--;
                }
                if (fromIdx !== insertIdx) {
                    const movedItem = list.splice(fromIdx, 1)[0];
                    list.splice(insertIdx, 0, movedItem);
                    markAsReordered();
                }
            }
            dragData = null;
        }

        function moveMainMenuPosition(mIdx, dir) {
            const list = headerInfo.menus;
            if (dir === 'up' && mIdx > 0) {
                const itm = list.splice(mIdx, 1)[0];
                list.splice(mIdx - 1, 0, itm);
                markAsReordered();
            } else if (dir === 'down' && mIdx < list.length - 1) {
                const itm = list.splice(mIdx, 1)[0];
                list.splice(mIdx + 1, 0, itm);
                markAsReordered();
            }
        }

        function moveSubMenuPosition(mIdx, smIdx, dir) {
            const list = headerInfo.menus[mIdx].subMenus;
            if (dir === 'up' && smIdx > 0) {
                const itm = list.splice(smIdx, 1)[0];
                list.splice(smIdx - 1, 0, itm);
                markAsReordered();
            } else if (dir === 'down' && smIdx < list.length - 1) {
                const itm = list.splice(smIdx, 1)[0];
                list.splice(smIdx + 1, 0, itm);
                markAsReordered();
            }
        }

        function moveMegaCol(mIdx, cIdx, dir) {
            const list = headerInfo.megaMenus[mIdx].columns;
            if (dir === 'up' && cIdx > 0) {
                const itm = list.splice(cIdx, 1)[0];
                list.splice(cIdx - 1, 0, itm);
                markAsReordered();
            } else if (dir === 'down' && cIdx < list.length - 1) {
                const itm = list.splice(cIdx, 1)[0];
                list.splice(cIdx + 1, 0, itm);
                markAsReordered();
            }
        }

        function moveMegaLink(mIdx, cIdx, lIdx, dir) {
            const list = headerInfo.megaMenus[mIdx].columns[cIdx].links;
            if (dir === 'up' && lIdx > 0) {
                const itm = list.splice(lIdx, 1)[0];
                list.splice(lIdx - 1, 0, itm);
                markAsReordered();
            } else if (dir === 'down' && lIdx < list.length - 1) {
                const itm = list.splice(lIdx, 1)[0];
                list.splice(lIdx + 1, 0, itm);
                markAsReordered();
            }
        }

        function markAsReordered() {
            isMenuReordered = true;
            document.getElementById('reorder-action-bar').style.display = 'flex';
            renderHeaderMenuCards();
            renderMegaMenuBuilder();
        }

        async function saveReorder() {
            await saveLayoutConfig();
            isMenuReordered = false;
            document.getElementById('reorder-action-bar').style.display = 'none';
        }

        async function cancelReorder() {
            isMenuReordered = false;
            document.getElementById('reorder-action-bar').style.display = 'none';
            await fetchLayoutConfig(); 
        }

        function renderAnnounceSection() {
            const container = document.getElementById('announce-container');
            container.innerHTML = '';
            if (announceInfo && (announceInfo.text || announceInfo.link)) {
                container.innerHTML = `
                    <div class="read-box" style="border-left: 5px solid #ff9f43;">
                        <div class="read-title"><i class="fa-solid fa-bullhorn"></i> ${announceInfo.text || '(কোনো নোটিশ নেই)'}</div>
                        <div class="read-subtitle"><b>লিংক (URL):</b> ${announceInfo.link || 'নাই'}</div>
                        <div class="card-actions">
                            <button class="btn btn-warning" onclick="editAnnounceSection()"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button class="btn btn-danger" onclick="deleteAnnounceSection()"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>`;
            } else {
                container.innerHTML = `<button class="btn btn-add" onclick="editAnnounceSection(true)"><i class="fa-solid fa-plus"></i> অ্যানাউন্সমেন্ট যোগ করুন</button>`;
            }
        }
        function editAnnounceSection(isNew = false) {
            const container = document.getElementById('announce-container');
            const textVal = announceInfo ? announceInfo.text || '' : '';
            const linkVal = announceInfo ? announceInfo.link || '' : '';
            container.innerHTML = `
                <div class="read-box" style="border-left: 5px solid #007bff; background: #ffffff;">
                    <div style="font-weight: bold; margin-bottom: 12px; color: #007bff;">${isNew ? 'নতুন অ্যানাউন্সমেন্ট যোগ করুন' : 'অ্যানাউন্সমেন্ট এডিট করুন'}</div>
                    <div class="row">
                        <div class="form-group" style="flex:2;"><label>নোটিশ টেক্সট:</label><input type="text" id="announce-text-input" value="${textVal.replace(/"/g, '&quot;')}" placeholder="যেমন: নতুন কুইজ ব্যাচ শুরু হয়েছে!"></div>
                        <div class="form-group" style="flex:1;"><label>নোটিশ লিংক (URL):</label><input type="text" id="announce-link-input" value="${linkVal.replace(/"/g, '&quot;')}" placeholder="যেমন: #notice"></div>
                    </div>
                    <div class="card-actions" style="margin-top: 10px;">
                        <button class="btn btn-submit" onclick="saveAnnounceSection()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                        <button class="btn btn-secondary" onclick="renderAnnounceSection()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>`;
        }
        async function saveAnnounceSection() {
            announceInfo = { text: document.getElementById('announce-text-input').value, link: document.getElementById('announce-link-input').value };
            await saveLayoutConfig(); renderAnnounceSection();
        }
        async function deleteAnnounceSection() {
            if (await showTopAlert("আপনি কি নিশ্চিত যে অ্যানাউন্সমেন্ট মুছে ফেলতে চান?", 'danger', true)) { announceInfo = null; await saveLayoutConfig(); renderAnnounceSection(); }
        }

        function renderHeaderBrandSection() {
            const container = document.getElementById('header-brand-container'); container.innerHTML = '';
            if (headerInfo && (headerInfo.siteTitle || headerInfo.logoUrl || headerInfo.faviconUrl)) {
                container.innerHTML = `
                    <div class="read-box" style="border-left: 5px solid #007bff;">
                        <div class="read-title"><i class="fa-solid fa-pager" style="color: #007bff;"></i> সাইট টাইটেল: ${headerInfo.siteTitle || 'TopMCQ'}</div>
                        <div class="read-meta" style="margin-top: 5px;"><b>Logo URL:</b> ${headerInfo.logoUrl || 'নাই'} | <b>Favicon URL:</b> ${headerInfo.faviconUrl || 'নাই'}</div>
                        <div class="card-actions" style="margin-top: 10px;"><button class="btn btn-warning" onclick="editHeaderBrandSection()"><i class="fa-solid fa-pen-to-square"></i> Edit</button><button class="btn btn-danger" onclick="deleteHeaderBrandSection()"><i class="fa-solid fa-trash"></i> Delete</button></div>
                    </div>`;
            } else { container.innerHTML = `<button class="btn btn-add" onclick="editHeaderBrandSection(true)"><i class="fa-solid fa-plus"></i> ব্রান্ড তথ্য যোগ করুন</button>`; }
        }
        function editHeaderBrandSection(isNew = false) {
            const container = document.getElementById('header-brand-container');
            const siteTitle = headerInfo ? headerInfo.siteTitle || '' : 'TopMCQ'; const logoUrl = headerInfo ? headerInfo.logoUrl || '' : ''; const faviconUrl = headerInfo ? headerInfo.faviconUrl || '' : '';
            container.innerHTML = `
                <div class="read-box" style="border-left: 5px solid #007bff; background: #ffffff;">
                    <div style="font-weight: bold; margin-bottom: 12px; color: #007bff;">${isNew ? 'নতুন ব্রান্ড তথ্য যোগ করুন' : 'ব্রান্ড সেটিং এডিট করুন'}</div>
                    <div class="row">

                headerInfo.megaMenus[mIdx].columns[cIdx].links.push({ title: t, url: u || '#' }); 
                await saveLayoutConfig(); 
                renderMegaMenuBuilder(); 
            } else {
                showTopAlert("লিংক টাইটেল প্রদান করুন!", "warning");
            }
        }
        
        async function deleteMegaLink(mIdx, cIdx, lIdx) { 
            headerInfo.megaMenus[mIdx].columns[cIdx].links.splice(lIdx, 1); 
            await saveLayoutConfig(); 
            renderMegaMenuBuilder(); 
        }

        function renderHeaderMenuCards() {
            const container = document.getElementById('header-menu-container'); 
            document.getElementById('new-menu-form-box').innerHTML = ''; 
            updateMenuActionBar();

            container.innerHTML = ''; 
            const menus = headerInfo.menus || [];
            
            if (menus.length === 0) { 
                container.innerHTML = `<p style="color:#777; margin-bottom:12px;">কোনো নেভিগেশন মেনু তৈরি করা হয়নি।</p>`; 
                return; 
            }

            menus.forEach((m, mIdx) => {
                const hasMega = m.isMegaMenu === true && m.megaMenuId;
                const hasSub = m.subMenus && m.subMenus.length > 0;

                let contentHtml = '';
                let actionButtonsHtml = '';

                if (hasMega) {
                    const linkedMega = (headerInfo.megaMenus || []).find(x => x.id === m.megaMenuId);
                    const megaName = linkedMega ? linkedMega.title : '<span style="color:red;">(মেগা মেনু পাওয়া যায়নি)</span>';
                    
                    contentHtml = `
                        <div style="background:#f3e8ff; padding:12px 15px; border-radius:6px; border:1px dashed #6f42c1; color:#6f42c1; font-weight:bold; font-size:13px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                            <span><i class="fa-solid fa-link"></i> যুক্ত মেগা মেনু: <b>${megaName}</b></span>
                            <div style="display:flex; gap:6px;">
                                <button class="btn btn-warning btn-sm" onclick="showConnectMegaMenuForm(${mIdx})"><i class="fa-solid fa-pen-to-square"></i> পরিবর্তন</button>
                                <button class="btn btn-danger btn-sm" onclick="removeMegaMenuConnection(${mIdx})"><i class="fa-solid fa-trash"></i> কানেকশন মুছুন</button>
                            </div>
                        </div>`;
                    actionButtonsHtml = ''; 
                } else if (hasSub) {
                    contentHtml = `
                        <div class="sub-menu-list">
                            <div style="font-size:12px; font-weight:bold; color:#555; margin-bottom:8px;">সাধারণ সাব-মেনু সমূহ:</div>
                            ${m.subMenus.map((sm, smIdx) => `
                                <div class="sub-menu-item draggable-item" draggable="true" data-type="sub" data-midx="${mIdx}" data-idx2="${smIdx}"
                                     ondragstart="dragStart(event, 'sub', ${mIdx}, ${smIdx})" 
                                     ondragend="dragEnd(event)" ondragover="dragOver(event)" 
                                     ondrop="drop(event, 'sub', ${mIdx}, ${smIdx})">
                                    <span style="font-size:13px; display:flex; align-items:center;">
                                        <i class="fa-solid fa-grip-vertical drag-handle" title="Drag to reorder"></i>
                                        <div class="arrow-btn-group">
                                            <button type="button" class="btn-arrow" onclick="moveSubMenuPosition(${mIdx}, ${smIdx}, 'up')">▲</button>
                                            <button type="button" class="btn-arrow" onclick="moveSubMenuPosition(${mIdx}, ${smIdx}, 'down')">▼</button>
                                        </div>
                                        <b>${sm.title}</b> <small style="color:#777; margin-left:5px;">(${sm.url || '#'})</small>
                                    </span>
                                    <div>
                                        <button class="btn btn-warning btn-sm" onclick="editSubMenuInline(${mIdx}, ${smIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteSubMenu(${mIdx}, ${smIdx})"><i class="fa-solid fa-trash"></i> Delete</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`;
                    actionButtonsHtml = `<button class="btn btn-info btn-sm" onclick="showSubMenuAddForm(${mIdx})"><i class="fa-solid fa-plus"></i> সাব-মেনু যোগ করুন</button>`;
                } else {
                    contentHtml = `<p style="color:#888; font-size:13px; font-style:italic; margin-bottom:10px;">কোনো সাব-মেনু বা মেগা মেনু যুক্ত নেই।</p>`;
                    actionButtonsHtml = `
                        <button class="btn btn-info btn-sm" onclick="showSubMenuAddForm(${mIdx})"><i class="fa-solid fa-plus"></i> সাব-মেনু যোগ করুন</button>
                        <button class="btn btn-purple btn-sm" style="background:#6f42c1; color:white;" onclick="showConnectMegaMenuForm(${mIdx})"><i class="fa-solid fa-layer-group"></i> মেগা মেনু কানেক্ট করুন</button>
                    `;
                }

                const megaBadge = hasMega ? `<span style="background:#6f42c1; color:white; padding:2px 8px; border-radius:4px; font-size:10px; margin-left:10px; display:inline-block;"><i class="fa-solid fa-layer-group"></i> Mega Menu Active</span>` : '';
                
                container.innerHTML += `
                    <div class="read-box draggable-item" draggable="true" data-type="main" data-midx="${mIdx}"
                         ondragstart="dragStart(event, 'main', ${mIdx})" 
                         ondragend="dragEnd(event)" ondragover="dragOver(event)" 
                         ondrop="drop(event, 'main', ${mIdx})"
                         style="border-left: 5px solid ${hasMega ? '#6f42c1' : '#20c997'}; margin-bottom: 15px;">
                        <div class="card-header-flex">
                            <div>
                                <div class="read-title" style="display:flex; align-items:center;">
                                    <i class="fa-solid fa-grip-vertical drag-handle" title="Drag to reorder"></i>
                                    <div class="arrow-btn-group">
                                        <button type="button" class="btn-arrow" onclick="moveMainMenuPosition(${mIdx}, 'up')">▲</button>
                                        <button type="button" class="btn-arrow" onclick="moveMainMenuPosition(${mIdx}, 'down')">▼</button>
                                    </div>
                                    <i class="fa-solid fa-bars" style="color:${hasMega ? '#6f42c1' : '#20c997'}; margin-right:6px;"></i> 
                                    ${m.title || '(নাম নেই)'} 
                                    ${megaBadge}
                                </div>
                                <div class="read-subtitle" style="margin-left: 55px;"><b>URL:</b> ${m.url || '#'}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-warning" onclick="editMainMenuInline(${mIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit Menu</button>
                                <button class="btn btn-danger" onclick="deleteMainMenu(${mIdx})"><i class="fa-solid fa-trash"></i> Delete</button>
                            </div>
                        </div>
                        <div style="margin-left:55px;">
                            ${contentHtml}
                            <div id="add-sub-${mIdx}"></div>
                            <div id="connect-mega-${mIdx}"></div>
                            <div class="card-actions" style="margin-top:10px;" id="menu-action-bar-${mIdx}">
                                ${actionButtonsHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function updateMenuActionBar() {
            const mainActionBar = document.getElementById('main-menu-action-bar'); 
            mainActionBar.innerHTML = `<button class="btn btn-add" id="add-menu-btn" onclick="showNewMenuForm()"><i class="fa-solid fa-plus"></i> মূল মেনু যোগ করুন</button>`;
        }

        function showConnectMegaMenuForm(mIdx) {
            renderHeaderMenuCards(); 
            const megaBox = document.getElementById(`connect-mega-${mIdx}`);
            const actionBox = document.getElementById(`menu-action-bar-${mIdx}`);
            
            if (actionBox) actionBox.style.display = 'none';

            const megaMenus = headerInfo.megaMenus || [];

            if (megaMenus.length === 0) {
                megaBox.innerHTML = `
                    <div style="background:#fff3cd; color:#856404; padding:12px 15px; border-radius:6px; border:1px solid #ffeeba; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; font-size:13px; flex-wrap:wrap; gap:10px;">
                        <span><i class="fa-solid fa-triangle-exclamation"></i> কোনো মেগা মেনু পাওয়া যায়নি! ২.৪ সেকশন থেকে আগে একটি মেগা মেনু তৈরি করুন।</span>
                        <button class="btn btn-secondary btn-sm" onclick="renderHeaderMenuCards()"><i class="fa-solid fa-xmark"></i> বন্ধ করুন</button>
                    </div>
                `;
                return;
            }

            const optionsHtml = megaMenus.map(m => 
                `<option value="${m.id}" ${headerInfo.menus[mIdx].megaMenuId === m.id ? 'selected' : ''}>${m.title}</option>`
            ).join('');

            megaBox.innerHTML = `
                <div style="background:#f3e8ff; padding:12px 15px; border-radius:6px; border:1px solid #d8b4fe; margin-bottom:10px;">
                    <div style="font-weight:bold; font-size:13px; color:#6f42c1; margin-bottom:8px;"><i class="fa-solid fa-layer-group"></i> মেগা মেনু সিলেক্ট করুন:</div>
                    <div class="row" style="margin-bottom:0;">
                        <select id="select-mega-id-${mIdx}" style="flex:1; padding:8px 12px; border:1px solid #cbd5e1; border-radius:5px; font-size:14px; font-weight:600; color:#333;">
                            ${optionsHtml}
                        </select>
                        <button class="btn btn-submit btn-sm" onclick="saveMegaMenuConnection(${mIdx})"><i class="fa-solid fa-floppy-disk"></i> কানেক্ট করুন</button>
                        <button class="btn btn-secondary btn-sm" onclick="renderHeaderMenuCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>
            `;
        }

        async function saveMegaMenuConnection(mIdx) {
            const selectedId = document.getElementById(`select-mega-id-${mIdx}`).value;
            if (selectedId) {
                headerInfo.menus[mIdx].isMegaMenu = true;
                headerInfo.menus[mIdx].megaMenuId = selectedId;
                headerInfo.menus[mIdx].subMenus = []; 
                await saveLayoutConfig();
                renderHeaderMenuCards();
            }
        }

        async function removeMegaMenuConnection(mIdx) {
            if (await showTopAlert("আপনি কি এই মেগা মেনু কানেকশনটি বিচ্ছিন্ন করতে চান?", 'warning', true)) {
                headerInfo.menus[mIdx].isMegaMenu = false;
                headerInfo.menus[mIdx].megaMenuId = null;
                await saveLayoutConfig();
                renderHeaderMenuCards(); 
            }
        }

        async function deleteMainMenu(mIdx) { 
            if(await showTopAlert("মেনুটি মুছতে চান?", 'warning', true)) { 
                headerInfo.menus.splice(mIdx, 1); 
                await saveLayoutConfig(); 
                renderHeaderMenuCards(); 
            } 
        }

        function showNewMenuForm() {
            const formBox = document.getElementById('new-menu-form-box');
            formBox.innerHTML = `
                <div class="read-box" style="border-left: 5px solid #28a745; background: #ffffff; margin-top:15px;">
                    <div style="font-weight: bold; margin-bottom: 12px; color: #28a745;">নতুন মূল মেনু যোগ করুন</div>
                    <div class="row" style="flex-wrap:wrap; background:#f8fafc; padding:15px; border:1px solid #e2e8f0; border-radius:6px;">
                        <input type="text" id="new-m-t" placeholder="মেনু টাইটেল (যেমন: সাধারণ জ্ঞান)" style="flex:1; min-width:200px;">
                        <input type="text" id="new-m-u" placeholder="URL (যেমন: gk.html)" style="flex:1; min-width:200px;">
                    </div>
                    <div class="card-actions" style="margin-top:10px;">
                        <button class="btn btn-submit" onclick="saveNewMainMenu()"><i class="fa-solid fa-floppy-disk"></i> Save Menu</button>
                        <button class="btn btn-secondary" onclick="document.getElementById('new-menu-form-box').innerHTML=''; document.getElementById('main-menu-action-bar').style.display = 'flex';"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>
            `;
            document.getElementById('main-menu-action-bar').style.display = 'none';
        }

        async function saveNewMainMenu() {
            const t = document.getElementById('new-m-t').value.trim(); 
            const u = document.getElementById('new-m-u').value.trim();
            
            if (t) {
                headerInfo.menus.push({ 
                    title: t, 
                    url: u || '#', 
                    subMenus: [], 
                    isMegaMenu: false, 
                    megaMenuId: null 
                });
                await saveLayoutConfig(); 
                document.getElementById('new-menu-form-box').innerHTML = ''; 
                document.getElementById('main-menu-action-bar').style.display = 'flex'; 
                renderHeaderMenuCards();
            } else {
                showTopAlert("মেনুর টাইটেল দিন!", "warning");
            }
        }

        function editMainMenuInline(mIdx) {
            renderHeaderMenuCards(); 
            const m = headerInfo.menus[mIdx];
            const container = document.getElementById('header-menu-container').children[mIdx];
            container.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px; color: #007bff;">মেনু এডিট করুন</div>
                <div class="row">
                    <input type="text" id="edit-m-t-${mIdx}" value="${m.title}" style="flex:1;" placeholder="মেনু টাইটেল">
                    <input type="text" id="edit-m-u-${mIdx}" value="${m.url}" style="flex:1;" placeholder="URL">
                </div>
                <div class="card-actions">
                    <button class="btn btn-submit" onclick="saveEditMainMenu(${mIdx})"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                    <button class="btn btn-secondary" onclick="renderHeaderMenuCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
        }

        async function saveEditMainMenu(mIdx) {
            headerInfo.menus[mIdx].title = document.getElementById(`edit-m-t-${mIdx}`).value; 
            headerInfo.menus[mIdx].url = document.getElementById(`edit-m-u-${mIdx}`).value;
            
            await saveLayoutConfig(); 
            renderHeaderMenuCards();
        }

        function showSubMenuAddForm(mIdx) {
            document.getElementById(`add-sub-${mIdx}`).innerHTML = `
                <div class="row" style="background:#f8fafc; padding:10px; border-radius:5px; border:1px solid #cbd5e1; margin-bottom:10px;">
                    <input type="text" id="new-sm-t-${mIdx}" placeholder="সাব-মেনু টাইটেল" style="flex:1;">
                    <input type="text" id="new-sm-u-${mIdx}" placeholder="URL" style="flex:1;">
                    <button class="btn btn-submit btn-sm" onclick="saveNewSubMenu(${mIdx})"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                    <button class="btn btn-secondary btn-sm" onclick="renderHeaderMenuCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
        }
        
        async function saveNewSubMenu(mIdx) {
            const t = document.getElementById(`new-sm-t-${mIdx}`).value.trim(); 
            const u = document.getElementById(`new-sm-u-${mIdx}`).value.trim();
            if (t) { 
                headerInfo.menus[mIdx].subMenus.push({title: t, url: u||'#'}); 
                await saveLayoutConfig(); 
                renderHeaderMenuCards(); 
            } else {
                showTopAlert("সাব-মেনু টাইটেল দিন!", "warning");
            }
        }

        async function deleteSubMenu(mIdx, smIdx) { 
            headerInfo.menus[mIdx].subMenus.splice(smIdx, 1); 
            await saveLayoutConfig(); 
            renderHeaderMenuCards(); 
        }

        function editSubMenuInline(mIdx, smIdx) {
            const sm = headerInfo.menus[mIdx].subMenus[smIdx]; 
            renderHeaderMenuCards(); 
            
            const card = document.getElementById('header-menu-container').children[mIdx]; 
            const targetItem = card.querySelectorAll('.sub-menu-item')[smIdx];
            
            if (targetItem) {
                targetItem.style.display = "block";
                targetItem.innerHTML = `
                    <div class="row" style="margin-bottom:5px;">
                        <input type="text" id="edit-sm-title-${mIdx}-${smIdx}" value="${(sm.title || '').replace(/"/g, '&quot;')}" style="flex:1;">
                        <input type="text" id="edit-sm-url-${mIdx}-${smIdx}" value="${(sm.url || '').replace(/"/g, '&quot;')}" style="flex:1;">
                    </div>
                    <div class="card-actions" style="margin-top:5px;">
                        <button class="btn btn-submit btn-sm" onclick="saveSubMenuInline(${mIdx}, ${smIdx})"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                        <button class="btn btn-secondary btn-sm" onclick="renderHeaderMenuCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>`;
            }
        }
        
        async function saveSubMenuInline(mIdx, smIdx) { 
            headerInfo.menus[mIdx].subMenus[smIdx].title = document.getElementById(`edit-sm-title-${mIdx}-${smIdx}`).value; 
            headerInfo.menus[mIdx].subMenus[smIdx].url = document.getElementById(`edit-sm-url-${mIdx}-${smIdx}`).value; 
            await saveLayoutConfig(); 
            renderHeaderMenuCards(); 
        }

        async function saveLayoutConfig() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            try {
                const res = await fetch(window.LAYOUT_API_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, 
                    body: JSON.stringify({ announcement: announceInfo, header: headerInfo, footer: footerInfo, copyright: copyrightInfo }) 
                });
                if (res.ok) { 
                    showTopAlert('✅ সফলভাবে সেভ হয়েছে!', 'success'); 
                } else { 
                    showTopAlert('❌ সেভ করতে ব্যর্থ হয়েছে!', 'danger'); 
                }
            } catch (err) { 
                showTopAlert('সার্ভারে যোগাযোগ করতে সমস্যা হয়েছে!', 'danger'); 
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchLayoutConfig);
    </script>
</body>
</html>

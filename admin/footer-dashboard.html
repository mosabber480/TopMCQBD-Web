<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Dashboard - TopMCQ</title>
    
    <!-- Instant Auth Check (Updated path for Root login.html) -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) {
                window.location.replace('../login.html');
            }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="../global/global.css">

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #17a2b8;
            --warning: #ff9f43;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --gray-btn: #6c757d;
            --main-dash-btn: #28a745;
            --purple-btn: #6f42c1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: #333; }

        /* OVERRIDE ALERT BANNER MAX-WIDTH FOR 1300PX CONTAINER */
        .alert-container-inner {
            max-width: 1300px !important;
            width: 100%;
            padding: 0 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 25px 25px 25px; }
        .section-card { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .section-card.announce-card { border-left: 6px solid var(--warning); }
        .section-card.header-card { border-left: 6px solid var(--primary); }
        .section-card.header-btn-card { border-left: 6px solid #e83e8c; }
        .section-card.menu-card { border-left: 6px solid #20c997; }
        .section-card.footer-card { border-left: 6px solid var(--secondary); }
        .section-card.copy-card { border-left: 6px solid var(--purple-btn); }

        .section-title { font-size: 20px; color: var(--dark); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px dashed #e2e8f0; }

        /* READ-ONLY CARD STYLE */
        .read-box { 
            background: #fdfdfd; 
            border: 1px solid #ddd; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border-left: 5px solid #20c997; 
            transition: all 0.2s ease;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .read-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;}
        .read-subtitle { font-size: 14px; color: #555; margin-bottom: 8px; }
        .read-meta { font-size: 13px; color: #555; margin-bottom: 6px; }
        .read-preview-text { font-size: 13px; color: #777; margin-bottom: 10px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; outline: none; background: white; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: nowrap; align-items: center; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        /* BUTTON STYLES */
        .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-info { background-color: #17a2b8; color: white; }
        .btn-info:hover { background-color: #138496; }
        .btn-add { background: var(--main-dash-btn); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

        .btn-icon-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 38px;
        }
        .btn-icon-danger:hover { background-color: #c82333; }

        .sub-menu-list {
            margin-top: 10px;
            padding-left: 15px;
            border-left: 3px solid #17a2b8;
            margin-bottom: 12px;
        }
        .sub-menu-item {
            background: #ffffff;
            padding: 8px 12px;
            border: 1px dashed #cbd5e1;
            border-radius: 5px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-top 0.1s ease, border-bottom 0.1s ease;
        }

        /* DRAG AND DROP & ARROW CONTROLS STYLES */
        .draggable-box {
            cursor: move;
            transition: transform 0.15s ease, opacity 0.15s ease, border-top 0.1s ease, border-bottom 0.1s ease;
        }
        .draggable-box.dragging {
            opacity: 0.4;
            background: #eef6ff !important;
        }
        .drag-handle {
            cursor: grab;
            color: #888;
            margin-right: 8px;
            font-size: 16px;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

         /* COLUMN DRAG STYLES */
         .col-drag-item { transition: border-top 0.1s ease, border-bottom 0.1s ease; }
        .dragging-col { opacity: 0.5; background: #f8f9fa !important; }
        .col-drag-handle { cursor: grab; color: #888; font-size: 18px; margin-right: 10px; transition: color 0.2s; }
        .col-drag-handle:hover { color: #007bff; }
        .col-drag-handle:active { cursor: grabbing; }

        /* 2PX DROP INDICATOR LINE STYLES */
        .drag-over-top {
            border-top: 2px solid #007bff !important;
        }
        .drag-over-bottom {
            border-bottom: 2px solid #007bff !important;
        }
        
        .arrow-btn-group {
            display: inline-flex;
            flex-direction: column;
            gap: 2px;
            margin-right: 10px;
        }
        .btn-arrow {
            background: #e2e8f0;
            border: none;
            color: #475569;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            line-height: 1;
            transition: background 0.2s ease;
        }
        .btn-arrow:hover {
            background: #007bff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Dynamic Admin Global Navigation Bar Container -->
    <div id="admin-navbar-container"></div>

    <div class="container">
        
        <!-- ৩. FOOTER SETTINGS CARD (DYNAMIC COLUMNS) -->
        <div class="section-card footer-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-table-columns" style="color: var(--secondary);"></i> ৩. ফুটার সেটিং (Drag & Drop Columns)
                </div>
                 <div style="display:flex; gap:10px;">
                    <!-- অ্যাড কলাম বাটন -->
                    <button class="btn btn-info btn-sm" onclick="addNewColumn('info')"><i class="fa-solid fa-plus"></i> Info Column যোগ</button>
                    <button class="btn btn-add btn-sm" onclick="addNewColumn('links')"><i class="fa-solid fa-plus"></i> Links Column যোগ</button>
                </div>
            </div>
            <div id="footer-container"></div>
        </div>

        <!-- ৪. COPYRIGHT SETTINGS CARD -->
        <div class="section-card copy-card">
            <div class="section-title"><i class="fa-solid fa-copyright" style="color: var(--purple-btn);"></i> ৪. কপিরাইট সেকশন (Copyright Text)</div>
            <div id="copyright-container"></div>
        </div>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>

    <script>
        // Use window.LAYOUT_API_URL to prevent redeclaration SyntaxError
        window.LAYOUT_API_URL = window.LAYOUT_API_URL || 'https://mosabber-quiz-app.onrender.com/api/layout-config';

        let announceInfo = null;
        let headerInfo = null;
        let footerInfo = null;
        let copyrightInfo = null;
        
        let isMenuReordered = false;
        let isFooterReordered = {};

        // GLOBAL LOGOUT FUNCTION
        async function logout() {
            const confirmLogout = await showTopAlert('আপনি কি নিশ্চিত যে লগআউট করতে চান?', 'warning', true);
            if (confirmLogout) {
                localStorage.removeItem('quiz_token');
                localStorage.removeItem('quiz_user');
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }
        async function fetchLayoutConfig() {
            try {
                const res = await fetch(window.LAYOUT_API_URL);
                const data = await res.json();

                // announcement/header o memory te rakha hocche jate save korar somoy data na hariye jay
                announceInfo = data.announcement || null;
                headerInfo = data.header || null;
                footerInfo = data.footer || {};
                copyrightInfo = data.copyright || null;

                // Migrate data if it uses the old hardcoded structure
                if (!footerInfo.columns) {
                    footerInfo.columns = [
                        { type: 'info', title: 'সাইট তথ্য ও সোশাল লিংক', text: footerInfo.col1Text || 'TopMCQ অনলাইন কুইজ প্ল্যাটফর্ম।', fb: footerInfo.col1Fb || '', yt: footerInfo.col1Yt || '', wa: footerInfo.col1Wa || '', tw: footerInfo.col1Tw || '', tg: footerInfo.col1Tg || '', ln: footerInfo.col1Ln || '' },
                        { type: 'links', title: footerInfo.col2Title || 'প্রয়োজনীয় লিংক', links: footerInfo.col2Links || [] },
                        { type: 'links', title: footerInfo.col3Title || 'ক্যাটাগরি', links: footerInfo.col3Links || [] },
                        { type: 'links', title: footerInfo.col4Title || 'যোগাযোগ', links: footerInfo.col4Links || [] }
                    ];
                }

                isFooterReordered = {};

                renderFooterSectionCards();
                renderCopyrightSection();
            } catch (err) { 
                console.error("Layout Config Fetch Error:", err); 
            }
        }
        /* ================= 3. FOOTER SECTION (WITH DRAG & DROP AND ARROW CONTROLS FOR LINKS) ================= */
        function renderFooterSectionCards() {
            const container = document.getElementById('footer-container');
            container.innerHTML = '';

            footerInfo.columns.forEach((col, colIdx) => {
                const card = document.createElement('div');
                card.className = 'read-box col-drag-item';
                card.style.borderLeft = "5px solid #17a2b8";
                card.draggable = true;
                card.dataset.colIdx = colIdx;

                if (col.type === 'info') {
                     // Active Social Links Preview Text
                    let activeSocials = [];
                    if (col.fb) activeSocials.push('Facebook');
                    if (col.yt) activeSocials.push('YouTube');
                    if (col.wa) activeSocials.push('WhatsApp');
                    if (col.tw) activeSocials.push('Twitter');
                    if (col.tg) activeSocials.push('Telegram');
                    if (col.ln) activeSocials.push('LinkedIn');

                    const socialPreview = activeSocials.length > 0 ? activeSocials.join(', ') : 'কোনো সোশ্যাল লিংক যুক্ত করা হয়নি';

                    card.innerHTML = `
                        <div class="card-header-flex">
                            <div>
                                <div class="read-title">
                                    <i class="fa-solid fa-grip-vertical col-drag-handle" title="কলামের পজিশন পরিবর্তন করতে ড্র্যাগ করুন"></i>
                                    <i class="fa-solid fa-circle-info" style="color:#17a2b8;"></i> ${col.title}
                                </div>
                                <div class="read-subtitle"><b>About Text:</b> ${col.text}</div>
                                <div class="read-meta"><b>Active Social Links:</b> ${socialPreview}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-warning" onclick="editFooterInfoInline(${colIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                 <button class="btn btn-danger" onclick="deleteFooterColumn(${colIdx})"><i class="fa-solid fa-trash"></i> Delete Column</button>
                            </div>
                        </div>
                    `;
                } else {
                    const linksList = col.links || [];
                    let linksHtml = '';
                    if (linksList.length > 0) {
                        linksHtml = `
                            <div class="sub-menu-list footer-drag-container" data-col-idx="${colIdx}">
                                <div style="font-size:12px; font-weight:bold; color:#555; margin-bottom:5px;">লিংক সমূহ (মাউস দিয়ে পজিশন ড্র্যাগ করা যাবে):</div>
                                ${linksList.map((lk, lkIdx) => `
                                    <div class="sub-menu-item draggable-box footer-drag-item" draggable="true" data-col-idx="${colIdx}" data-index="${lkIdx}">
                                        <span style="font-size:13px; color:#333; display:flex; align-items:center;">
                                            <i class="fa-solid fa-grip-vertical drag-handle" title="মাউস চেপে পজিশন পরিবর্তন করুন"></i>
                                            <div class="arrow-btn-group">
                                                <button type="button" class="btn-arrow" onclick="moveFooterLinkPosition(${colIdx}, ${lkIdx}, 'up')" title="উপরে তুলুন">▲</button>
                                                <button type="button" class="btn-arrow" onclick="moveFooterLinkPosition(${colIdx}, ${lkIdx}, 'down')" title="নিচে নামান">▼</button>
                                            </div>
                                            <b>${lk.title}</b> <small style="color:#777; margin-left:5px;">(${lk.url || '#'})</small>
                                        </span>
                                        <div>
                                            <button class="btn btn-warning btn-sm" onclick="editFooterLinkInline(${colIdx}, ${lkIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                            <button class="btn btn-danger btn-sm" onclick="deleteFooterLink(${colIdx}, ${lkIdx})"><i class="fa-solid fa-trash"></i> Delete</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    let saveCancelFooterBtns = '';
                    if (isFooterReordered[colIdx]) {
                        saveCancelFooterBtns = `
                            <button class="btn btn-submit" onclick="saveReorderedFooterLinks(${colIdx})"><i class="fa-solid fa-floppy-disk"></i> Save Footer Links</button>
                            <button class="btn btn-secondary" onclick="cancelFooterReorder()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                        `;
                    }

                    card.innerHTML = `
                        <div class="card-header-flex">
                            <div>
                                <div class="read-title">
                                    <i class="fa-solid fa-grip-vertical col-drag-handle" title="কলামের পজিশন পরিবর্তন করতে ড্র্যাগ করুন"></i>
                                    <i class="fa-solid fa-list" style="color:#17a2b8;"></i> ${col.title}
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-warning" onclick="editFooterTitleInline(${colIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit Title</button>
                                <button class="btn btn-danger" onclick="deleteFooterColumn(${colIdx})"><i class="fa-solid fa-trash"></i> Delete Column</button>
                            </div>
                        </div>
                        ${linksHtml}
                        <div id="add-footer-link-box-${colIdx}"></div>
                        <div class="card-actions" style="margin-top: 10px;" id="footer-link-action-bar-${colIdx}">
                            <button class="btn btn-info" onclick="showAddFooterLinkForm(${colIdx})"><i class="fa-solid fa-plus"></i> লিংক যোগ করুন</button>
                            ${saveCancelFooterBtns}
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            initColumnDragAndDrop();
            initFooterDragAndDrop();
        }

        /* --- ADD/DELETE COLUMN CONTROLS --- */
        function addNewColumn(type) {
            if(type === 'info') {
                footerInfo.columns.push({ type: 'info', title: 'নতুন তথ্য কলাম', text: 'সাইট সম্পর্কিত তথ্য...', fb: '', yt: '', wa: '', tw: '', tg: '', ln: '' });
            } else {
                footerInfo.columns.push({ type: 'links', title: 'নতুন লিংক কলাম', links: [] });
            }
            saveLayoutConfig(); 
        }

        async function deleteFooterColumn(colIdx) {
            if (await showTopAlert("পুরো কলামটি মুছে ফেলতে চান?", 'danger', true)) {
                footerInfo.columns.splice(colIdx, 1);
                await saveLayoutConfig();
            }
        }

         /* --- COLUMN DRAG AND DROP CONTROLS --- */
         function initColumnDragAndDrop() {
            const colItems = document.querySelectorAll('.col-drag-item');
            let draggedColIdx = null;

            colItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('footer-drag-item')) return; 
                    draggedColIdx = parseInt(item.dataset.colIdx);
                    item.classList.add('dragging-col');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging-col');
                    colItems.forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
                });

                item.addEventListener('dragover', (e) => {
                    if (!document.querySelector('.dragging-col')) return; 
                    e.preventDefault(); e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = item.getBoundingClientRect();
                    if ((e.clientY - rect.top) < rect.height / 2) {
                        item.classList.add('drag-over-top'); item.classList.remove('drag-over-bottom');
                    } else {
                        item.classList.add('drag-over-bottom'); item.classList.remove('drag-over-top');
                    }
                });

                item.addEventListener('dragleave', () => item.classList.remove('drag-over-top', 'drag-over-bottom'));

                item.addEventListener('drop', async (e) => {
                    if (!document.querySelector('.dragging-col')) return;
                    e.preventDefault(); e.stopPropagation();
                    item.classList.remove('drag-over-top', 'drag-over-bottom');
                    
                    let targetColIdx = parseInt(item.dataset.colIdx);
                    const rect = item.getBoundingClientRect();
                    if ((e.clientY - rect.top) >= rect.height / 2 && targetColIdx < draggedColIdx) targetColIdx++;
                    
                    if (draggedColIdx !== null && draggedColIdx !== targetColIdx) {
                        const movedCol = footerInfo.columns.splice(draggedColIdx, 1)[0];
                        footerInfo.columns.splice(targetColIdx, 0, movedCol);
                        renderFooterSectionCards();
                        await saveLayoutConfig(); 
                    }
                });
            });
        }

        /* --- FOOTER ARROW CONTROLS --- */
        function moveFooterLinkPosition(colIdx, lkIdx, direction) {
            const list = footerInfo.columns[colIdx].links;
            if (direction === 'up' && lkIdx > 0) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx - 1, 0, item);
                isFooterReordered[colIdx] = true;
                renderFooterSectionCards();
            } else if (direction === 'down' && lkIdx < list.length - 1) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx + 1, 0, item);
                isFooterReordered[colIdx] = true;
                renderFooterSectionCards();
            }
        }

        /* --- FOOTER DRAG AND DROP CONTROLS (WITH 2PX LINE INDICATOR) --- */
        function initFooterDragAndDrop() {
            const container = document.getElementById('footer-container');
            const dragContainers = container.querySelectorAll('.footer-drag-container');

            const clearIndicator = (el) => {
                el.classList.remove('drag-over-top', 'drag-over-bottom');
            };

            dragContainers.forEach(dragContainer => {
                const dragItems = dragContainer.querySelectorAll('.footer-drag-item');
                let draggedIdx = null;
                let colIdx = null;

                dragItems.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        e.stopPropagation();
                        draggedIdx = parseInt(item.dataset.index);
                        colIdx = parseInt(item.dataset.colIdx);
                        item.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    });

                    item.addEventListener('dragend', (e) => {
                        e.stopPropagation();
                        item.classList.remove('dragging');
                        clearIndicator(item);
                    });

                    item.addEventListener('dragover', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';

                        const rect = item.getBoundingClientRect();
                        const offset = e.clientY - rect.top;
                        if (offset < rect.height / 2) {
                            item.classList.add('drag-over-top');
                            item.classList.remove('drag-over-bottom');
                        } else {
                            item.classList.add('drag-over-bottom');
                            item.classList.remove('drag-over-top');
                        }
                    });

                    item.addEventListener('dragleave', (e) => {
                        e.stopPropagation();
                        clearIndicator(item);
                    });

                    item.addEventListener('drop', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        clearIndicator(item);

                        let targetIdx = parseInt(item.dataset.index);
                        const targetColIdx = parseInt(item.dataset.colIdx);

                        const rect = item.getBoundingClientRect();
                        const offset = e.clientY - rect.top;
                        if (offset >= rect.height / 2 && targetIdx < draggedIdx) {
                            targetIdx++;
                        }

                        if (colIdx === targetColIdx && draggedIdx !== null && draggedIdx !== targetIdx) {
                            const list = footerInfo.columns[colIdx].links;
                            const movedItem = list.splice(draggedIdx, 1)[0];
                            list.splice(targetIdx, 0, movedItem);

                            isFooterReordered[colIdx] = true;
                            renderFooterSectionCards();
                        }
                    });
                });
            });
        }

        async function saveReorderedFooterLinks(colIdx) {
            await saveLayoutConfig();
            isFooterReordered[colIdx] = false;
            renderFooterSectionCards();
        }

        function cancelFooterReorder() {
            fetchLayoutConfig();
        }
        
        /* --- Info Type Column Edit --- */
        function editFooterInfoInline(colIdx) {
            const col = footerInfo.columns[colIdx];
            const card = document.querySelectorAll('.col-drag-item')[colIdx];
            card.style.background = "#ffffff";
            card.draggable = false;
            card.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px; color: #17a2b8;">সাইট তথ্য এডিট করুন</div>
                <div class="form-group">
                    <label>কলাম টাইটেল:</label>
                    <input type="text" id="edit-info-title-${colIdx}" value="${(col.title || '').replace(/"/g, '&quot;')}">
                </div>
                <div class="form-group">
                    <label>সাইট সম্পর্কে বিবরণ:</label>
                    <textarea id="edit-info-text-${colIdx}" rows="2">${col.text || ''}</textarea>
                </div>
                <div class="row">
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-facebook" style="color:#1877f2;"></i> Facebook Page URL:</label>
                        <input type="text" id="edit-info-fb-${colIdx}" value="${(col.fb || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://facebook.com/yourpage">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-youtube" style="color:#ff0000;"></i> YouTube Channel URL:</label>
                        <input type="text" id="edit-info-yt-${colIdx}" value="${(col.yt || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://youtube.com/@yourchannel">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-whatsapp" style="color:#25d366;"></i> WhatsApp Link / Number:</label>
                        <input type="text" id="edit-info-wa-${colIdx}" value="${(col.wa || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://wa.me/8801700000000">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-x-twitter" style="color:#000000;"></i> Twitter / X Profile URL:</label>
                        <input type="text" id="edit-info-tw-${colIdx}" value="${(col.tw || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://x.com/yourprofile">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-telegram" style="color:#0088cc;"></i> Telegram Channel / Link:</label>
                        <input type="text" id="edit-info-tg-${colIdx}" value="${(col.tg || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://t.me/yourchannel">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label><i class="fa-brands fa-linkedin" style="color:#0a66c2;"></i> LinkedIn Profile / Page URL:</label>
                        <input type="text" id="edit-info-ln-${colIdx}" value="${(col.ln || '').replace(/"/g, '&quot;')}" placeholder="যেমন: https://linkedin.com/in/yourprofile">
                    </div>
                </div>
                <div class="card-actions" style="margin-top: 10px;">
                    <button class="btn btn-submit" onclick="saveFooterInfoInline(${colIdx})"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                    <button class="btn btn-secondary" onclick="renderFooterSectionCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
        }

        async function saveFooterInfoInline(colIdx) {
            const col = footerInfo.columns[colIdx];
            col.title = document.getElementById(`edit-info-title-${colIdx}`).value;
            col.text = document.getElementById(`edit-info-text-${colIdx}`).value;
            col.fb = document.getElementById(`edit-info-fb-${colIdx}`).value;
            col.yt = document.getElementById(`edit-info-yt-${colIdx}`).value;
            col.wa = document.getElementById(`edit-info-wa-${colIdx}`).value;
            col.tw = document.getElementById(`edit-info-tw-${colIdx}`).value;
            col.tg = document.getElementById(`edit-info-tg-${colIdx}`).value;
            col.ln = document.getElementById(`edit-info-ln-${colIdx}`).value;

            await saveLayoutConfig();
            renderFooterSectionCards();
        }

        /* --- Links Type Column Edit --- */
        function editFooterTitleInline(colIdx) {
            const col = footerInfo.columns[colIdx];
            const card = document.querySelectorAll('.col-drag-item')[colIdx];
            card.style.background = "#ffffff";
            card.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px; color: #17a2b8;">কলাম টাইটেল এডিট করুন</div>
                <div class="form-group">
                    <label>কলাম টাইটেল:</label>
                    <input type="text" id="edit-col-title-${colIdx}" value="${(col.title || '').replace(/"/g, '&quot;')}">
                </div>
                <div class="card-actions">
                    <button class="btn btn-submit" onclick="saveFooterTitleInline(${colIdx})"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                    <button class="btn btn-secondary" onclick="renderFooterSectionCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
        }

        async function saveFooterTitleInline(colIdx) {
            footerInfo.columns[colIdx].title = document.getElementById(`edit-col-title-${colIdx}`).value;
            await saveLayoutConfig();
            renderFooterSectionCards();
        }

        /* --- Footer Link Inline Edit --- */
        function editFooterLinkInline(colIdx, lkIdx) {
            const lk = footerInfo.columns[colIdx].links[lkIdx];
            renderFooterSectionCards();

            const card = document.querySelectorAll('.col-drag-item')[colIdx];
            const subItems = card.querySelectorAll('.sub-menu-item');
            const targetItem = subItems[lkIdx];

            if (targetItem) {
                targetItem.draggable = false;
                targetItem.style.display = "block";
                targetItem.innerHTML = `
                    <div class="row" style="margin-bottom:5px;">
                        <input type="text" id="edit-fl-title-${colIdx}-${lkIdx}" value="${(lk.title || '').replace(/"/g, '&quot;')}" style="flex:1;">
                        <input type="text" id="edit-fl-url-${colIdx}-${lkIdx}" value="${(lk.url || '').replace(/"/g, '&quot;')}" style="flex:1;">
                    </div>
                    <div class="card-actions" style="margin-top:5px;">
                        <button class="btn btn-submit btn-sm" onclick="saveFooterLinkInline(${colIdx}, ${lkIdx})"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                        <button class="btn btn-secondary btn-sm" onclick="renderFooterSectionCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                `;
            }
        }

        async function saveFooterLinkInline(colIdx, lkIdx) {
            footerInfo.columns[colIdx].links[lkIdx].title = document.getElementById(`edit-fl-title-${colIdx}-${lkIdx}`).value;
            footerInfo.columns[colIdx].links[lkIdx].url = document.getElementById(`edit-fl-url-${colIdx}-${lkIdx}`).value;
            await saveLayoutConfig();
            renderFooterSectionCards();
        }

        function showAddFooterLinkForm(colIdx) {
            const container = document.getElementById(`add-footer-link-box-${colIdx}`);
            const actionBar = document.getElementById(`footer-link-action-bar-${colIdx}`);
            if (!container) return;

            let formWrapper = container.querySelector('.new-footer-link-form-wrapper');

            if (!formWrapper) {
                formWrapper = document.createElement('div');
                formWrapper.className = 'new-footer-link-form-wrapper';
                formWrapper.style.cssText = "margin-top:10px; background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #cbd5e1;";
                formWrapper.innerHTML = `
                    <div style="font-weight:bold; font-size:13px; color:#17a2b8; margin-bottom:10px;">নতুন লিংক যোগ করুন:</div>
                    <div class="new-footer-link-rows-container"></div>
                `;
                container.appendChild(formWrapper);

                if (actionBar && !actionBar.querySelector('.btn-submit')) {
                    actionBar.innerHTML += `
                        <button class="btn btn-submit" onclick="saveAllNewFooterLinks(${colIdx})"><i class="fa-solid fa-floppy-disk"></i> Save Links</button>
                        <button class="btn btn-secondary" onclick="renderFooterSectionCards()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    `;
                }
            }

            const rowsContainer = formWrapper.querySelector('.new-footer-link-rows-container');
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row new-footer-link-row';
            rowDiv.style.cssText = 'margin-bottom:8px; display:flex; gap:10px; align-items:center;';
            rowDiv.innerHTML = `
                <input type="text" class="new-fl-title" placeholder="লিংক টাইটেল (যেমন: প্রাইভেসি পলিসি)" style="flex:1;">
                <input type="text" class="new-fl-url" placeholder="URL (যেমন: privacy.html)" style="flex:1;">
                <button type="button" class="btn-icon-danger" onclick="removeNewFooterLinkRow(this, ${colIdx})" title="মুছে ফেলুন">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            rowsContainer.appendChild(rowDiv);
        }

        function removeNewFooterLinkRow(btn, colIdx) {
            const row = btn.closest('.new-footer-link-row');
            if (row) {
                const rowsContainer = row.parentElement;
                row.remove();
                if (rowsContainer && rowsContainer.children.length === 0) {
                    renderFooterSectionCards();
                }
            }
        }

        async function saveAllNewFooterLinks(colIdx) {
            const container = document.getElementById(`add-footer-link-box-${colIdx}`);
            if (!container) return;

            const rows = container.querySelectorAll('.new-footer-link-row');
            if (rows.length === 0) {
                showTopAlert("কমপক্ষে একটি লিংক পূরণ করুন!", "warning");
                return;
            }

            let addedCount = 0;
            rows.forEach(row => {
                const title = row.querySelector('.new-fl-title')?.value.trim();
                const url = row.querySelector('.new-fl-url')?.value.trim();

                if (title) {
                    footerInfo.columns[colIdx].links.push({ title, url: url || '#' });
                    addedCount++;
                }
            });

            if (addedCount === 0) {
                showTopAlert("লিংক টাইটেল প্রদান করুন!", "warning");
                return;
            }

            await saveLayoutConfig();
            renderFooterSectionCards();
        }

        async function deleteFooterLink(colIdx, lkIdx) {
            if (await showTopAlert("আপনি কি নিশ্চিত যে এই লিংকটি মুছে ফেলতে চান?", 'danger', true)) {
                footerInfo.columns[colIdx].links.splice(lkIdx, 1);
                await saveLayoutConfig();
                renderFooterSectionCards();
            }
        }

        /* ================= 4. COPYRIGHT SECTION ================= */
        function renderCopyrightSection() {
            const container = document.getElementById('copyright-container');
            container.innerHTML = '';

            if (copyrightInfo && copyrightInfo.text) {
                container.innerHTML = `
                    <div class="read-box" style="border-left: 5px solid #6f42c1;">
                        <div class="read-title"><i class="fa-solid fa-copyright"></i> ${copyrightInfo.text}</div>
                        <div class="card-actions">
                            <button class="btn btn-warning" onclick="editCopyrightSection()"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button class="btn btn-danger" onclick="deleteCopyrightSection()"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button class="btn btn-add" onclick="editCopyrightSection(true)">
                        <i class="fa-solid fa-plus"></i> কপিরাইট টেক্সট যোগ করুন
                    </button>
                `;
            }
        }

        function editCopyrightSection(isNew = false) {
            const container = document.getElementById('copyright-container');
            const copyText = copyrightInfo ? copyrightInfo.text || '' : '© 2026 TopMCQ. All rights reserved.';

            container.innerHTML = `
                <div class="read-box" style="border-left: 5px solid #007bff; background: #ffffff;">
                    <div style="font-weight: bold; margin-bottom: 12px; color: #007bff;">
                        ${isNew ? 'নতুন কপিরাইট যোগ করুন' : 'কপিরাইট টেক্সট এডিট করুন'}
                    </div>
                    <div class="form-group">
                        <label>কপিরাইট টেক্সট:</label>
                        <input type="text" id="copyright-text-input" value="${copyText.replace(/"/g, '&quot;')}">
                    </div>
                    <div class="card-actions" style="margin-top: 10px;">
                        <button class="btn btn-submit" onclick="saveCopyrightSection()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                        <button class="btn btn-secondary" onclick="renderCopyrightSection()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>
            `;
        }

        async function saveCopyrightSection() {
            copyrightInfo = {
                text: document.getElementById('copyright-text-input').value
            };
            await saveLayoutConfig();
            renderCopyrightSection();
        }

        async function deleteCopyrightSection() {
            if (await showTopAlert("আপনি কি নিশ্চিত যে কপিরাইট টেক্সট মুছে ফেলতে চান?", 'danger', true)) {
                copyrightInfo = null;
                await saveLayoutConfig();
                renderCopyrightSection();
            }
        }

        /* ================= SAVE ALL LAYOUT CONFIG TO BACKEND ================= */
        async function saveLayoutConfig() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) { 
                showTopAlert('অনুগ্রহ করে লগইন করুন!', 'warning'); 
                return; 
            }

            try {
                const res = await fetch(window.LAYOUT_API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ 
                        announcement: announceInfo,
                        header: headerInfo,
                        footer: footerInfo,
                        copyright: copyrightInfo
                    })
                });

                const result = await res.json();

                if (res.ok) {
                    showTopAlert('✅ সফলভাবে সেভ হয়েছে!', 'success');
                    fetchLayoutConfig();
                } else { 
                    showTopAlert('❌ ' + (result.message || 'সেভ করতে ব্যর্থ হয়েছে!'), 'danger'); 
                }
            } catch (err) { 
                console.error("Layout Save error:", err);
                showTopAlert('সার্ভারে যোগাযোগ করতে সমস্যা হয়েছে!', 'danger'); 
            }
        }

        // DOMContentLoaded Event Listener to ensure initial data loads properly
        document.addEventListener('DOMContentLoaded', () => {
            fetchLayoutConfig();
        });
    </script>
</body>
</html>

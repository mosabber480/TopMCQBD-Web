<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Dashboard - TopMCQ</title>
    
    <!-- Instant Auth Check -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) {
                window.location.replace('../login.html');
            }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="../global/global.css">

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #17a2b8;
            --warning: #ff9f43;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --gray-btn: #6c757d;
            --main-dash-btn: #28a745;
            --purple-btn: #6f42c1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: #333; padding-bottom: 80px; }

        .alert-container-inner { max-width: 1300px !important; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; }
        
        /* max-width & margin: auto সরানো হয়েছে যাতে global.css এর sidebar layout ঠিকমতো কাজ করে */
        .container { margin-top: 30px; margin-bottom: 30px; padding: 0 25px 25px 25px; }
        
        .section-card { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .section-card.footer-card { border-left: 6px solid var(--secondary); }
        .section-card.copy-card { border-left: 6px solid var(--purple-btn); }

        .section-title { font-size: 20px; color: var(--dark); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px dashed #e2e8f0; }

        .read-box { background: #fdfdfd; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #20c997; transition: all 0.2s ease; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }

        .read-title { font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 4px; display: flex; align-items: center; gap: 8px;}
        .read-subtitle { font-size: 14px; color: #555; margin-top: 8px; }
        .read-meta { font-size: 13px; color: #555; margin-bottom: 6px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; outline: none; background: white; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); }

        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: nowrap; align-items: center; }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-warning:hover { background-color: #e0a800; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-info { background-color: #17a2b8; color: white; }
        .btn-info:hover { background-color: #138496; }
        .btn-add { background: var(--main-dash-btn); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

        .btn-icon-danger { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; transition: background 0.2s ease; display: inline-flex; align-items: center; justify-content: center; height: 38px; }
        .btn-icon-danger:hover { background-color: #c82333; }

        .sub-menu-list { margin-top: 10px; padding-left: 15px; border-left: 3px solid #17a2b8; margin-bottom: 12px; }
        .sub-menu-item { background: #ffffff; padding: 8px 12px; border: 1px dashed #cbd5e1; border-radius: 5px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

        /* ====== ARROWS & DRAG HANDLES ====== */
        .drag-handle, .col-drag-handle {
            cursor: grab; color: #475569; background: #f1f5f9; border: 1px solid #cbd5e1;
            border-radius: 4px; padding: 4px 6px; font-size: 13px; margin-right: 6px;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .col-drag-handle { font-size: 16px; padding: 6px 8px; }
        .drag-handle:hover, .col-drag-handle:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); }
        .drag-handle:active, .col-drag-handle:active { cursor: grabbing; }

        .arrow-btn-group { display: inline-flex; flex-direction: column; gap: 2px; margin-right: 10px; }
        .btn-arrow { background: #e2e8f0; border: none; color: #475569; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer; line-height: 1; transition: background 0.2s ease; }
        .btn-arrow:hover { background: #007bff; color: #ffffff; }

        /* ====== DRAG & DROP WITH 2PX INDICATORS ====== */
        .col-drag-item, .footer-drag-item, .copy-drag-item { position: relative; transition: opacity 0.15s ease; }
        .dragging-col, .dragging { opacity: 0.4; background: #eef6ff !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .drag-over-top::before {
            content: ''; position: absolute; top: -3px; left: 0; width: 100%; height: 3px;
            background-color: var(--primary); z-index: 100; border-radius: 2px;
        }
        .drag-over-bottom::after {
            content: ''; position: absolute; bottom: -3px; left: 0; width: 100%; height: 3px;
            background-color: var(--primary); z-index: 100; border-radius: 2px;
        }

        /* ====== REORDER ACTION BAR ====== */
        #reorder-action-bar {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2c3e50;
            padding: 15px; border-top: 4px solid #ffc107; z-index: 9999; box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            justify-content: center; align-items: center; gap: 20px; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Dynamic Admin Global Navigation Bar Container -->
    <div id="admin-navbar-container"></div>

    <div class="container">
        
        <!-- ৩. FOOTER SETTINGS CARD -->
        <div class="section-card footer-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-table-columns" style="color: var(--secondary);"></i> ৩. ফুটার সেটিং (Drag & Drop Columns)
                </div>
                 <div style="display:flex; gap:10px;">
                    <button class="btn btn-info btn-sm" onclick="addNewColumn('info')"><i class="fa-solid fa-plus"></i> Info Column যোগ</button>
                    <button class="btn btn-add btn-sm" onclick="addNewColumn('links')"><i class="fa-solid fa-plus"></i> Links Column যোগ</button>
                </div>
            </div>
            <div id="footer-container"></div>
        </div>

        <!-- ৪. COPYRIGHT SETTINGS CARD -->
        <div class="section-card copy-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-copyright" style="color: var(--purple-btn);"></i> ৪. কপিরাইট ও ফুটনোট লিংক
                </div>
            </div>
            <div id="copyright-container"></div>
        </div>
    </div>

    <!-- Drag & Drop Save Action Bar -->
    <div id="reorder-action-bar">
        <span style="color: #ffffff; font-weight: bold; font-size: 15px;">
            আপনি ক্রম পরিবর্তন করেছেন। সেভ করতে বোতাম চাপুন।
        </span>
        <button class="btn btn-submit" style="padding: 10px 20px; font-size:14px;" onclick="saveReorderedLayout()"><i class="fa-solid fa-floppy-disk"></i> পরিবর্তন সেভ করুন</button>
        <button class="btn btn-danger" style="padding: 10px 15px; font-size:14px;" onclick="cancelReorder()"><i class="fa-solid fa-xmark"></i> বাতিল করুন</button>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>

    <script>
        window.LAYOUT_API_URL = window.LAYOUT_API_URL || 'https://topmcqbd.onrender.com/api/layout-config';

        let announceInfo = null;
        let headerInfo = null;
        let footerInfo = null;
        let copyrightInfo = null;
        
        let hasPendingReorder = false;

        async function fetchLayoutConfig() {
            try {
                const res = await fetch(window.LAYOUT_API_URL);
                const data = await res.json();

                announceInfo = data.announcement || null;
                headerInfo = data.header || null;
                footerInfo = data.footer || {};
                
                copyrightInfo = data.copyright || { text: '© 2026 TopMCQ. All rights reserved.', links: [] };
                if (!copyrightInfo.links) {
                    copyrightInfo.links = [];
                }

                if (!footerInfo.columns) {
                    footerInfo.columns = [
                        { type: 'info', title: 'সাইট তথ্য ও সোশাল লিংক', text: footerInfo.col1Text || 'TopMCQ অনলাইন কুইজ প্ল্যাটফর্ম।', fb: footerInfo.col1Fb || '', yt: footerInfo.col1Yt || '', wa: footerInfo.col1Wa || '', tw: footerInfo.col1Tw || '', tg: footerInfo.col1Tg || '', ln: footerInfo.col1Ln || '' },
                        { type: 'links', title: footerInfo.col2Title || 'প্রয়োজনীয় লিংক', links: footerInfo.col2Links || [] },
                        { type: 'links', title: footerInfo.col3Title || 'ক্যাটাগরি', links: footerInfo.col3Links || [] },
                        { type: 'links', title: footerInfo.col4Title || 'যোগাযোগ', links: footerInfo.col4Links || [] }
                    ];
                }

                hideGlobalSaveBar();

                renderFooterSectionCards();
                renderCopyrightSection();
            } catch (err) { 
                console.error("Layout Config Fetch Error:", err); 
            }
        }

        /* ================= TRIGGER GLOBAL SAVE BAR ================= */
        function triggerGlobalSaveBar() {
            hasPendingReorder = true;
            document.getElementById('reorder-action-bar').style.display = 'flex';
        }

        function hideGlobalSaveBar() {
            hasPendingReorder = false;
            document.getElementById('reorder-action-bar').style.display = 'none';
        }

        async function saveReorderedLayout() {
            await saveLayoutConfig();
            hideGlobalSaveBar();
        }

        function cancelReorder() {
            hideGlobalSaveBar();
            fetchLayoutConfig(); // Refetch to discard changes
        }

        /* ================= 3. FOOTER SECTION RENDER ================= */
        function renderFooterSectionCards() {
            const container = document.getElementById('footer-container');
            container.innerHTML = '';

            footerInfo.columns.forEach((col, colIdx) => {
                const card = document.createElement('div');
                card.className = 'read-box col-drag-item';
                card.style.borderLeft = "5px solid #17a2b8";
                card.draggable = true;
                card.dataset.colIdx = colIdx;

                if (col.type === 'info') {
                    let activeSocials = [];
                    if (col.fb) activeSocials.push('Facebook');
                    if (col.yt) activeSocials.push('YouTube');
                    if (col.wa) activeSocials.push('WhatsApp');
                    if (col.tw) activeSocials.push('Twitter');
                    if (col.tg) activeSocials.push('Telegram');
                    if (col.ln) activeSocials.push('LinkedIn');
                    const socialPreview = activeSocials.length > 0 ? activeSocials.join(', ') : 'কোনো সোশ্যাল লিংক যুক্ত করা হয়নি';

                    card.innerHTML = `
                        <div class="card-header-flex">
                            <div>
                                <div class="read-title">
                                    <i class="fa-solid fa-grip-vertical col-drag-handle" title="কলামের পজিশন পরিবর্তন করতে ড্র্যাগ করুন"></i>
                                    <div class="arrow-btn-group">
                                        <button type="button" class="btn-arrow" onclick="moveColumnPosition(${colIdx}, 'up')" title="উপরে তুলুন">▲</button>
                                        <button type="button" class="btn-arrow" onclick="moveColumnPosition(${colIdx}, 'down')" title="নিচে নামান">▼</button>
                                    </div>
                                    <i class="fa-solid fa-circle-info" style="color:#17a2b8;"></i> ${col.title}
                                </div>
                                <div class="read-subtitle"><b>About Text:</b> ${col.text}</div>
                                <div class="read-meta"><b>Active Social Links:</b> ${socialPreview}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-warning" onclick="editFooterInfoInline(${colIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                 <button class="btn btn-danger" onclick="deleteFooterColumn(${colIdx})"><i class="fa-solid fa-trash"></i> Delete Column</button>
                            </div>
                        </div>
                    `;
                } else {
                    const linksList = col.links || [];
                    let linksHtml = '';
                    if (linksList.length > 0) {
                        linksHtml = `
                            <div class="sub-menu-list footer-drag-container" data-col-idx="${colIdx}">
                                <div style="font-size:12px; font-weight:bold; color:#555; margin-bottom:5px;">লিংক সমূহ (মাউস দিয়ে পজিশন ড্র্যাগ করা যাবে):</div>
                                ${linksList.map((lk, lkIdx) => `
                                    <div class="sub-menu-item footer-drag-item" draggable="true" data-col-idx="${colIdx}" data-index="${lkIdx}">
                                        <span style="font-size:13px; color:#333; display:flex; align-items:center;">
                                            <i class="fa-solid fa-grip-vertical drag-handle" title="মাউস চেপে পজিশন পরিবর্তন করুন"></i>
                                            <div class="arrow-btn-group">
                                                <button type="button" class="btn-arrow" onclick="moveFooterLinkPosition(${colIdx}, ${lkIdx}, 'up')" title="উপরে তুলুন">▲</button>
                                                <button type="button" class="btn-arrow" onclick="moveFooterLinkPosition(${colIdx}, ${lkIdx}, 'down')" title="নিচে নামান">▼</button>
                                            </div>
                                            <b>${lk.title}</b> <small style="color:#777; margin-left:5px;">(${lk.url || '#'})</small>
                                        </span>
                                        <div>
                                            <button class="btn btn-warning btn-sm" onclick="editFooterLinkInline(${colIdx}, ${lkIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                                            <button class="btn btn-danger btn-sm" onclick="deleteFooterLink(${colIdx}, ${lkIdx})"><i class="fa-solid fa-trash"></i> Delete</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="card-header-flex">
                            <div>
                                <div class="read-title">
                                    <i class="fa-solid fa-grip-vertical col-drag-handle" title="কলামের পজিশন পরিবর্তন করতে ড্র্যাগ করুন"></i>
                                    <div class="arrow-btn-group">
                                        <button type="button" class="btn-arrow" onclick="moveColumnPosition(${colIdx}, 'up')" title="উপরে তুলুন">▲</button>
                                        <button type="button" class="btn-arrow" onclick="moveColumnPosition(${colIdx}, 'down')" title="নিচে নামান">▼</button>
                                    </div>
                                    <i class="fa-solid fa-list" style="color:#17a2b8;"></i> ${col.title}
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-warning" onclick="editFooterTitleInline(${colIdx})"><i class="fa-solid fa-pen-to-square"></i> Edit Title</button>
                                <button class="btn btn-danger" onclick="deleteFooterColumn(${colIdx})"><i class="fa-solid fa-trash"></i> Delete Column</button>
                            </div>
                        </div>
                        ${linksHtml}
                        <div id="add-footer-link-box-${colIdx}"></div>
                        <div class="card-actions" style="margin-top: 10px;" id="footer-link-action-bar-${colIdx}">
                            <button class="btn btn-info" onclick="showAddFooterLinkForm(${colIdx})"><i class="fa-solid fa-plus"></i> লিংক যোগ করুন</button>
                        </div>
                    `;
                }
                container.appendChild(card);
            });

            initColumnDragAndDrop();
            initFooterDragAndDrop();
        }

        /* --- Footer ARROWS Logic --- */
        function moveColumnPosition(colIdx, direction) {
            const cols = footerInfo.columns;
            if (direction === 'up' && colIdx > 0) {
                const item = cols.splice(colIdx, 1)[0];
                cols.splice(colIdx - 1, 0, item);
                renderFooterSectionCards();
                triggerGlobalSaveBar();
            } else if (direction === 'down' && colIdx < cols.length - 1) {
                const item = cols.splice(colIdx, 1)[0];
                cols.splice(colIdx + 1, 0, item);
                renderFooterSectionCards();
                triggerGlobalSaveBar();
            }
        }

        function moveFooterLinkPosition(colIdx, lkIdx, direction) {
            const list = footerInfo.columns[colIdx].links;
            if (direction === 'up' && lkIdx > 0) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx - 1, 0, item);
                renderFooterSectionCards();
                triggerGlobalSaveBar();
            } else if (direction === 'down' && lkIdx < list.length - 1) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx + 1, 0, item);
                renderFooterSectionCards();
                triggerGlobalSaveBar();
            }
        }

        function moveCopyLinkPosition(lkIdx, direction) {
            const list = copyrightInfo.links;
            if (direction === 'up' && lkIdx > 0) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx - 1, 0, item);
                renderCopyrightSection();
                triggerGlobalSaveBar();
            } else if (direction === 'down' && lkIdx < list.length - 1) {
                const item = list.splice(lkIdx, 1)[0];
                list.splice(lkIdx + 1, 0, item);
                renderCopyrightSection();
                triggerGlobalSaveBar();
            }
        }

        /* --- YOUR ORIGINAL COLUMN DRAG AND DROP (Updated with 2px line) --- */
        function initColumnDragAndDrop() {
            const colItems = document.querySelectorAll('.col-drag-item');
            let draggedColIdx = null;

            colItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('footer-drag-item') || e.target.classList.contains('copy-drag-item')) return; 
                    draggedColIdx = parseInt(item.dataset.colIdx);
                    item.classList.add('dragging-col');
                    e.dataTransfer.effectAllowed = 'move';
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging-col');
                    colItems.forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));
                });

                item.addEventListener('dragover', (e) => {
                    if (!document.querySelector('.dragging-col')) return; 
                    e.preventDefault(); e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = item.getBoundingClientRect();
                    if ((e.clientY - rect.top) < rect.height / 2) {
                        item.classList.add('drag-over-top'); item.classList.remove('drag-over-bottom');
                    } else {
                        item.classList.add('drag-over-bottom'); item.classList.remove('drag-over-top');
                    }
                });

                item.addEventListener('dragleave', () => item.classList.remove('drag-over-top', 'drag-over-bottom'));

                item.addEventListener('drop', (e) => {
                    if (!document.querySelector('.dragging-col')) return;
                    e.preventDefault(); e.stopPropagation();
                    item.classList.remove('drag-over-top', 'drag-over-bottom');
                    
                    let targetColIdx = parseInt(item.dataset.colIdx);
                    const rect = item.getBoundingClientRect();
                    if ((e.clientY - rect.top) >= rect.height / 2 && targetColIdx < draggedColIdx) targetColIdx++;
                    
                    if (draggedColIdx !== null && draggedColIdx !== targetColIdx) {
                        const movedCol = footerInfo.columns.splice(draggedColIdx, 1)[0];
                        footerInfo.columns.splice(targetColIdx, 0, movedCol);
                        
                        renderFooterSectionCards();
                        triggerGlobalSaveBar();
                    }
                });
            });
        }

        /* --- YOUR ORIGINAL FOOTER LINKS DRAG AND DROP (Updated with 2px line) --- */
        function initFooterDragAndDrop() {
            const container = document.getElementById('footer-container');
            const dragContainers = container.querySelectorAll('.footer-drag-container');
            const clearIndicator = (el) => { el.classList.remove('drag-over-top', 'drag-over-bottom'); };

            dragContainers.forEach(dragContainer => {
                const dragItems = dragContainer.querySelectorAll('.footer-drag-item');
                let draggedIdx = null; let colIdx = null;

                dragItems.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        e.stopPropagation(); draggedIdx = parseInt(item.dataset.index); colIdx = parseInt(item.dataset.colIdx);
                        item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
                    });
                    item.addEventListener('dragend', (e) => { e.stopPropagation(); item.classList.remove('dragging'); clearIndicator(item); });
                    item.addEventListener('dragover', (e) => {
                        e.stopPropagation(); e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                        const rect = item.getBoundingClientRect(); const offset = e.clientY - rect.top;
                        if (offset < rect.height / 2) { item.classList.add('drag-over-top'); item.classList.remove('drag-over-bottom'); } 
                        else { item.classList.add('drag-over-bottom'); item.classList.remove('drag-over-top'); }
                    });
                    item.addEventListener('dragleave', (e) => { e.stopPropagation(); clearIndicator(item); });
                    item.addEventListener('drop', (e) => {
                        e.stopPropagation(); e.preventDefault(); clearIndicator(item);
                        let targetIdx = parseInt(item.dataset.index); const targetColIdx = parseInt(item.dataset.colIdx);
                        const rect = item.getBoundingClientRect(); const offset = e.clientY - rect.top;
                        if (offset >= rect.height / 2 && targetIdx < draggedIdx) { targetIdx++; }
                        if (colIdx === targetColIdx && draggedIdx !== null && draggedIdx !== targetIdx) {
                            const list = footerInfo.columns[colIdx].links;
                            const movedItem = list.splice(draggedIdx, 1)[0];
                            list.splice(targetIdx, 0, movedItem);
                            
                            renderFooterSectionCards();

        /* --- YOUR ORIGINAL COPYRIGHT DRAG AND DROP (Updated with 2px line) --- */
        function initCopyDragAndDrop() {
            const container = document.getElementById('copyright-container');
            const dragContainer = container.querySelector('.copy-drag-container');
            if(!dragContainer) return;

            const dragItems = dragContainer.querySelectorAll('.copy-drag-item');
            let draggedIdx = null;
            const clearIndicator = (el) => { el.classList.remove('drag-over-top', 'drag-over-bottom'); };

            dragItems.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    e.stopPropagation(); draggedIdx = parseInt(item.dataset.index);
                    item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
                });
                item.addEventListener('dragend', (e) => {
                    e.stopPropagation(); item.classList.remove('dragging'); clearIndicator(item);
                });
                item.addEventListener('dragover', (e) => {
                    e.stopPropagation(); e.preventDefault(); e.dataTransfer.dropEffect = 'move';
                    const rect = item.getBoundingClientRect(); const offset = e.clientY - rect.top;
                    if (offset < rect.height / 2) { item.classList.add('drag-over-top'); item.classList.remove('drag-over-bottom'); } 
                    else { item.classList.add('drag-over-bottom'); item.classList.remove('drag-over-top'); }
                });
                item.addEventListener('dragleave', (e) => { e.stopPropagation(); clearIndicator(item); });
                item.addEventListener('drop', (e) => {
                    e.stopPropagation(); e.preventDefault(); clearIndicator(item);
                    let targetIdx = parseInt(item.dataset.index);
                    const rect = item.getBoundingClientRect(); const offset = e.clientY - rect.top;
                    if (offset >= rect.height / 2 && targetIdx < draggedIdx) targetIdx++;
                    if (draggedIdx !== null && draggedIdx !== targetIdx) {
                        const list = copyrightInfo.links; const movedItem = list.splice(draggedIdx, 1)[0];
                        list.splice(targetIdx, 0, movedItem);
                        
                        renderCopyrightSection();
                        triggerGlobalSaveBar();
                    }
                });
            });
        }

                });

                else { showTopAlert('❌ ' + (result.message || 'সেভ করতে ব্যর্থ হয়েছে!'), 'danger'); }

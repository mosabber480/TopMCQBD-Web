<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Menu Dashboard - TopMCQ</title>
    
    <!-- Instant Auth Check -->
    <script>
        (function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            if (!token) {
                window.location.replace('../login.html');
            }
        })();
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- GLOBAL CSS LINK -->
    <link rel="stylesheet" href="../global/global.css">

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #17a2b8;
            --warning: #ff9f43;
            --danger: #dc3545;
            --dark: #2c3e50;
            --light: #f4f7f6;
            --gray-btn: #6c757d;
            --main-dash-btn: #28a745;
            --purple-btn: #6f42c1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--light); color: #333; padding-bottom: 80px; }

        .container { margin-top: 30px; margin-bottom: 30px; padding: 0 25px; }
        
        .section-card { background: white; padding: 25px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; border-left: 6px solid var(--primary); }

        .section-title { font-size: 20px; color: var(--dark); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px dashed #e2e8f0; }

        .read-box { background: #fdfdfd; border: 1px solid #ddd; padding: 18px 20px; border-radius: 8px; margin-bottom: 12px; border-left: 5px solid #20c997; transition: all 0.2s ease; position: relative; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; }

        .read-title { font-size: 15px; font-weight: bold; color: #2c3e50; display: flex; align-items: center; gap: 10px; }
        .read-subtitle { font-size: 13px; color: #666; margin-top: 4px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 13px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; outline: none; background: white; font-family: inherit; }
        input:focus { border-color: var(--primary); }

        .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .card-actions { display: flex; gap: 8px; align-items: center; }

        .btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-warning { background-color: #ffc107; color: #212529; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-info { background-color: #17a2b8; color: white; }
        .btn-add { background: var(--main-dash-btn); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

        /* ARROWS & DRAG HANDLES */
        .drag-handle { cursor: grab; color: #475569; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; padding: 4px 6px; font-size: 13px; margin-right: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .drag-handle:active { cursor: grabbing; }

        .arrow-btn-group { display: inline-flex; flex-direction: column; gap: 2px; margin-right: 10px; }
        .btn-arrow { background: #e2e8f0; border: none; color: #475569; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer; line-height: 1; }
        .btn-arrow:hover { background: var(--primary); color: #ffffff; }

        .draggable-item { position: relative; transition: opacity 0.2s; }
        .draggable-item.dragging { opacity: 0.35; }
        
        .drop-above::before { content: ''; position: absolute; top: -3px; left: 0; width: 100%; height: 3px; background-color: var(--primary); z-index: 100; border-radius: 2px; }
        .drop-below::after { content: ''; position: absolute; bottom: -3px; left: 0; width: 100%; height: 3px; background-color: var(--primary); z-index: 100; border-radius: 2px; }

        /* SUBMENU STYLES IN ADMIN UI */
        .submenu-container { margin-top: 15px; padding-left: 25px; border-left: 3px dashed var(--primary); }
        .submenu-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px 15px; border-radius: 6px; margin-bottom: 8px; }

        /* Reorder Save Action Bar */
        #reorder-action-bar {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2c3e50;
            padding: 15px; border-top: 4px solid #ffc107; z-index: 9999; box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
            justify-content: center; align-items: center; gap: 20px; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Dynamic Admin Global Navigation Bar Container -->
    <div id="admin-navbar-container"></div>

    <div class="container">
        <div class="section-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-list-check" style="color: var(--primary);"></i> অ্যাডমিন সাইডবার মেনু বিল্ডার
                </div>
                <button class="btn btn-add" onclick="showNewMenuForm()"><i class="fa-solid fa-plus"></i> নতুন মেনু যোগ করুন</button>
            </div>
            
            <div id="new-menu-form-box"></div>
            <div id="sidebar-menu-list"></div>
        </div>
    </div>

    <!-- Drag & Drop Save Action Bar -->
    <div id="reorder-action-bar">
        <span style="color: #ffffff; font-weight: bold; font-size: 15px;">
            আপনি সাইডবার মেনুর ক্রম পরিবর্তন করেছেন। সেভ করতে বোতাম চাপুন।
        </span>
        <button class="btn btn-submit" style="padding: 10px 20px; font-size:14px;" onclick="saveReorder()"><i class="fa-solid fa-floppy-disk"></i> সেভ করুন</button>
        <button class="btn btn-danger" style="padding: 10px 15px; font-size:14px;" onclick="cancelReorder()"><i class="fa-solid fa-xmark"></i> বাতিল করুন</button>
    </div>

    <!-- GLOBAL JS LINKS -->
    <script src="../global/global.js"></script>
    <script src="../global/admin-global.js"></script>

    <script>
        window.MENU_API_URL = window.MENU_API_URL || 'https://topmcqbd.onrender.com/api/sidebar-config';

        let sidebarMenus = [];
        let isReordered = false;
        let dragData = null;

        // ডিফল্ট সাইডবার মেনু ব্যাকআপ (যদি ব্যাকএন্ডে এখনো ডাটা না থাকে)
        const defaultMenus = [
            { title: "Dashboard Overview", url: "dashboard.html", icon: "fa-solid fa-gauge-high", subMenus: [] },
            { title: "Manage Quizzes", url: "quiz-dashboard.html", icon: "fa-solid fa-file-circle-question", subMenus: [] },
            { title: "Header Settings", url: "header-dashboard.html", icon: "fa-solid fa-window-restore", subMenus: [] },
            { title: "Home Settings", url: "home-dashboard.html", icon: "fa-solid fa-sliders", subMenus: [] },
            { title: "Footer Settings", url: "footer-dashboard.html", icon: "fa-solid fa-table-columns", subMenus: [] },
            { title: "User & Subscriptions", url: "users.html", icon: "fa-solid fa-users-gear", subMenus: [] },
            { title: "Sidebar Menu Settings", url: "admin-menu-dashboard.html", icon: "fa-solid fa-list-check", subMenus: [] },
            { title: "My Profile", url: "admin-profile.html", icon: "fa-solid fa-user-shield", subMenus: [] }
        ];

        async function fetchSidebarConfig() {
            try {
                const res = await fetch(window.MENU_API_URL);
                if (res.ok) {
                    const data = await res.json();
                    sidebarMenus = data.menus && data.menus.length > 0 ? data.menus : defaultMenus;
                } else {
                    sidebarMenus = defaultMenus;
                }
                renderMenuList();
            } catch (err) {
                console.error("Fetch Error:", err);
                sidebarMenus = defaultMenus;
                renderMenuList();
            }
        }

        function renderMenuList() {
            const container = document.getElementById('sidebar-menu-list');
            container.innerHTML = '';

            if (sidebarMenus.length === 0) {
                container.innerHTML = `<p style="color:#777; font-style:italic;">কোনো মেনু যোগ করা হয়নি।</p>`;
                return;
            }

            sidebarMenus.forEach((m, idx) => {
                const card = document.createElement('div');
                card.className = 'read-box draggable-item';
                card.draggable = true;
                card.dataset.index = idx;

                const hasSub = m.subMenus && m.subMenus.length > 0;
                let subHTML = '';

                if (hasSub) {
                    subHTML = `
                        <div class="submenu-container">
                            <div style="font-size:12px; font-weight:bold; color:var(--primary); margin-bottom:6px;">সাব-মেনু তালিকা (${m.subMenus.length}টি):</div>
                            ${m.subMenus.map((sub, sIdx) => `
                                <div class="submenu-box card-header-flex">
                                    <div>
                                        <i class="${sub.icon || 'fa-solid fa-circle'}" style="color:var(--secondary); font-size: 13px;"></i>
                                        <b style="font-size:13px; margin-left:5px;">${sub.title}</b>
                                        <span style="font-size:12px; color:#666; margin-left:10px;">(URL: ${sub.url})</span>
                                    </div>
                                    <div>
                                        <button class="btn btn-danger btn-sm" style="padding:2px 8px; font-size:10px;" onclick="deleteSubMenu(${idx}, ${sIdx})"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header-flex">
                        <div>
                            <div class="read-title">
                                <i class="fa-solid fa-grip-vertical drag-handle" title="Drag to reorder"></i>
                                <div class="arrow-btn-group">
                                    <button type="button" class="btn-arrow" onclick="moveMenu(${idx}, 'up')">▲</button>
                                    <button type="button" class="btn-arrow" onclick="moveMenu(${idx}, 'down')">▼</button>
                                </div>
                                <i class="${m.icon || 'fa-solid fa-link'}" style="color:var(--primary); font-size: 16px; width: 20px; text-align:center;"></i>
                                <span>${m.title}</span>
                            </div>
                            <div class="read-subtitle" style="margin-left: 65px;">
                                <b>URL:</b> ${m.url} | <b>Icon Class:</b> <code>${m.icon}</code>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-info btn-sm" onclick="showSubMenuForm(${idx})"><i class="fa-solid fa-plus"></i> সাব-মেনু</button>
                            <button class="btn btn-warning btn-sm" onclick="editMenuInline(${idx})"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMenu(${idx})"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                    ${subHTML}
                    <div id="sub-form-box-${idx}"></div>
                `;

                // Drag Events
                card.addEventListener('dragstart', (e) => dragStart(e, idx));
                card.addEventListener('dragend', dragEnd);
                card.addEventListener('dragover', dragOver);
                card.addEventListener('drop', (e) => drop(e, idx));

                container.appendChild(card);
            });
        }

        /* --- Drag and Drop Handlers --- */
        function dragStart(e, idx) {
            dragData = idx;
            e.dataTransfer.effectAllowed = "move";
            e.currentTarget.classList.add('dragging');
        }

        function dragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.drop-above, .drop-below').forEach(el => el.classList.remove('drop-above', 'drop-below'));
            dragData = null;
        }

        function dragOver(e) {
            e.preventDefault();
            const item = e.currentTarget;
            const rect = item.getBoundingClientRect();
            const midY = rect.top + (rect.height / 2);
            
            item.classList.remove('drop-above', 'drop-below');
            if (e.clientY < midY) {
                item.classList.add('drop-above');
            } else {
                item.classList.add('drop-below');
            }
        }

        function drop(e, targetIdx) {
            e.preventDefault();
            const item = e.currentTarget;
            let position = item.classList.contains('drop-above') ? 'above' : 'below';
            
            document.querySelectorAll('.drop-above, .drop-below').forEach(el => el.classList.remove('drop-above', 'drop-below'));

            if (dragData === null || dragData === targetIdx) return;

            let insertIdx = targetIdx;
            if (position === 'below') insertIdx++;
            if (dragData < insertIdx) insertIdx--;

            const movedItem = sidebarMenus.splice(dragData, 1)[0];
            sidebarMenus.splice(insertIdx, 0, movedItem);

            markAsReordered();
        }

        /* --- Arrow Handlers --- */
        function moveMenu(idx, dir) {
            if (dir === 'up' && idx > 0) {
                const item = sidebarMenus.splice(idx, 1)[0];
                sidebarMenus.splice(idx - 1, 0, item);
                markAsReordered();
            } else if (dir === 'down' && idx < sidebarMenus.length - 1) {
                const item = sidebarMenus.splice(idx, 1)[0];
                sidebarMenus.splice(idx + 1, 0, item);
                markAsReordered();
            }
        }

        function markAsReordered() {
            isReordered = true;
            document.getElementById('reorder-action-bar').style.display = 'flex';
            renderMenuList();
        }

        async function saveReorder() {
            await saveConfig();
            isReordered = false;
            document.getElementById('reorder-action-bar').style.display = 'none';
        }

        function cancelReorder() {
            isReordered = false;
            document.getElementById('reorder-action-bar').style.display = 'none';
            fetchSidebarConfig();
        }

        /* --- CRUD Functions --- */
        function showNewMenuForm() {
            const formBox = document.getElementById('new-menu-form-box');
            formBox.innerHTML = `
                <div class="read-box" style="border-left: 5px solid #28a745; background: #ffffff; margin-bottom: 20px;">
                    <div style="font-weight: bold; margin-bottom: 12px; color: #28a745;">নতুন সাইডবার মেনু যোগ করুন</div>
                    <div class="row">
                        <div class="form-group" style="flex:1; min-width:200px;">
                            <label>মেনু টাইটেল:</label>
                            <input type="text" id="new-m-title" placeholder="যেমন: Settings">
                        </div>
                        <div class="form-group" style="flex:1; min-width:200px;">
                            <label>URL (ফাইল পাথ):</label>
                            <input type="text" id="new-m-url" placeholder="যেমন: settings.html বা #">
                        </div>
                        <div class="form-group" style="flex:1; min-width:200px;">
                            <label>FontAwesome Icon Class:</label>
                            <input type="text" id="new-m-icon" placeholder="যেমন: fa-solid fa-gear">
                        </div>
                    </div>
                    <div class="card-actions" style="margin-top:10px;">
                        <button class="btn btn-submit" onclick="saveNewMenu()"><i class="fa-solid fa-floppy-disk"></i> Save Menu</button>
                        <button class="btn btn-secondary" onclick="document.getElementById('new-menu-form-box').innerHTML=''"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>
            `;
        }

        async function saveNewMenu() {
            const title = document.getElementById('new-m-title').value.trim();
            const url = document.getElementById('new-m-url').value.trim();
            const icon = document.getElementById('new-m-icon').value.trim();

            if (!title) return showTopAlert('টাইটেল দেওয়া প্রয়োজন!', 'warning');

            sidebarMenus.push({ 
                title, 
                url: url || '#', 
                icon: icon || 'fa-solid fa-circle',
                subMenus: []
            });
            await saveConfig();
            document.getElementById('new-menu-form-box').innerHTML = '';
            renderMenuList();
        }

        /* --- SubMenu CRUD --- */
        function showSubMenuForm(parentIdx) {
            const formBox = document.getElementById(`sub-form-box-${parentIdx}`);
            formBox.innerHTML = `
                <div style="background: #f1f5f9; padding: 12px 15px; border-radius:6px; margin-top: 10px; border: 1px solid #cbd5e1;">
                    <div style="font-weight: bold; font-size:13px; margin-bottom: 8px; color: var(--primary);">নতুন সাব-মেনু যোগ করুন</div>
                    <div class="row">
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label>টাইটেল:</label>
                            <input type="text" id="sub-title-${parentIdx}" placeholder="যেমন: General Settings">
                        </div>
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label>URL (ফাইল পাথ):</label>
                            <input type="text" id="sub-url-${parentIdx}" placeholder="যেমন: general-settings.html">
                        </div>
                        <div class="form-group" style="flex:1; min-width:150px;">
                            <label>Icon Class:</label>
                            <input type="text" id="sub-icon-${parentIdx}" placeholder="যেমন: fa-solid fa-sliders">
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-submit btn-sm" onclick="saveSubMenu(${parentIdx})"><i class="fa-solid fa-plus"></i> Add Submenu</button>
                        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('sub-form-box-${parentIdx}').innerHTML=''"><i class="fa-solid fa-xmark"></i> Cancel</button>
                    </div>
                </div>
            `;
        }

        async function saveSubMenu(parentIdx) {
            const title = document.getElementById(`sub-title-${parentIdx}`).value.trim();
            const url = document.getElementById(`sub-url-${parentIdx}`).value.trim();
            const icon = document.getElementById(`sub-icon-${parentIdx}`).value.trim();

            if (!title || !url) return showTopAlert('সাব-মেনুর টাইটেল এবং URL প্রয়োজন!', 'warning');

            if (!sidebarMenus[parentIdx].subMenus) {
                sidebarMenus[parentIdx].subMenus = [];
            }

            sidebarMenus[parentIdx].subMenus.push({
                title,
                url,
                icon: icon || 'fa-solid fa-circle'
            });

            await saveConfig();
            renderMenuList();
        }

        async function deleteSubMenu(parentIdx, subIdx) {
            if (await showTopAlert("সাব-মেনুটি মুছে ফেলতে চান?", 'danger', true)) {
                sidebarMenus[parentIdx].subMenus.splice(subIdx, 1);
                await saveConfig();
                renderMenuList();
            }
        }

        function editMenuInline(idx) {
            renderMenuList();
            const m = sidebarMenus[idx];
            const card = document.querySelectorAll('.read-box')[idx];
            card.style.background = "#ffffff"; card.draggable = false;
            
            card.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px; color: var(--primary);">মেনু এডিট করুন</div>
                <div class="row">
                    <div class="form-group" style="flex:1;"><label>টাইটেল:</label><input type="text" id="edit-m-t-${idx}" value="${m.title}"></div>
                    <div class="form-group" style="flex:1;"><label>URL:</label><input type="text" id="edit-m-u-${idx}" value="${m.url}"></div>
                    <div class="form-group" style="flex:1;"><label>Icon Class:</label><input type="text" id="edit-m-i-${idx}" value="${m.icon}"></div>
                </div>
                <div class="card-actions">
                    <button class="btn btn-submit btn-sm" onclick="saveEditMenu(${idx})"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                    <button class="btn btn-secondary btn-sm" onclick="renderMenuList()"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
            `;
        }

        async function saveEditMenu(idx) {
            sidebarMenus[idx].title = document.getElementById(`edit-m-t-${idx}`).value.trim();
            sidebarMenus[idx].url = document.getElementById(`edit-m-u-${idx}`).value.trim();
            sidebarMenus[idx].icon = document.getElementById(`edit-m-i-${idx}`).value.trim();

            await saveConfig();
            renderMenuList();
        }

        async function deleteMenu(idx) {
            if (await showTopAlert("মেনুটি মুছে ফেলতে চান?", 'danger', true)) {
                sidebarMenus.splice(idx, 1);
                await saveConfig();
                renderMenuList();
            }
        }

        async function saveConfig() {
            const token = localStorage.getItem('token') || localStorage.getItem('quiz_token');
            try {
                const res = await fetch(window.MENU_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ menus: sidebarMenus })
                });
                if (res.ok) {
                    showTopAlert('✅ সফলভাবে সাইডবার আপডেট হয়েছে!', 'success');
                } else {
                    showTopAlert('❌ সেভ করতে ব্যর্থ হয়েছে!', 'danger');
                }
            } catch (err) {
                showTopAlert('সার্ভারে সমস্যা হয়েছে!', 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchSidebarConfig);
    </script>
</body>
</html>
